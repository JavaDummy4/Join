<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objekt-Beziehungsmodell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --canvas-bg:#12161c;
    --canvas-grid:#1c222b;
    --panel-bg:#eceef2;
    --panel-bg-2:#dde1e8;
    --ink:#1a2028;
    --ink-soft:#5a6472;
    --line:#c7cdd7;
    --accent:#3fa9a0;
    --accent-dark:#2c7d76;
    --warn:#e8963c;
    --danger:#d1495b;
    --edge:#5b93c9;
    --node-neutral:#8a8f98;
    --white:#f6f7f9;
    font-family:'Space Grotesk',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--canvas-bg);color:var(--ink);overflow:hidden;}
  body{display:flex;flex-direction:column;}
  #app{display:flex;flex-direction:column;height:100vh;width:100vw;}

  /* Toolbar — Apple-Design */
  #toolbar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:#f5f5f7;border-bottom:1px solid rgba(0,0,0,.08);
    padding:10px 14px;z-index:5;
  }
  #toolbar .grp{display:flex;align-items:center;gap:8px;padding:0 10px;border-right:1px solid rgba(0,0,0,.08);}
  #toolbar .grp:last-child{border-right:none;}
  #bottomBar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
    background:#f5f5f7;border-top:1px solid rgba(0,0,0,.08);
    padding:8px 14px;z-index:5;
  }
  #bottomBar .grp{display:flex;align-items:center;gap:8px;padding:0 10px;border-right:1px solid rgba(0,0,0,.08);}
  #bottomBar .grp:last-child{border-right:none;}
  .modelname{font-weight:600;font-size:14px;padding:0 10px 0 2px;color:#1d1d1f;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;}
  button.btn{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    font-size:13px;font-weight:600;letter-spacing:-.1px;
    background:#ffffff;border:1px solid rgba(0,0,0,.1);color:#1d1d1f;
    padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    transition:background .15s ease, box-shadow .15s ease, transform .05s ease, border-color .15s ease;
  }
  button.btn:hover{background:#f5f5f7;border-color:rgba(0,0,0,.14);box-shadow:0 2px 6px rgba(0,0,0,.07);}
  button.btn:active{transform:scale(.96);box-shadow:0 1px 1px rgba(0,0,0,.05);}
  button.btn.primary{background:#0071e3;border-color:#0071e3;color:#fff;box-shadow:0 1px 3px rgba(0,113,227,.35);}
  button.btn.primary:hover{background:#0077ed;border-color:#0077ed;box-shadow:0 3px 8px rgba(0,113,227,.4);}
  button.btn.danger{background:#ff3b30;border-color:#ff3b30;color:#fff;box-shadow:0 1px 3px rgba(255,59,48,.35);}
  button.btn.danger:hover{background:#ff443a;box-shadow:0 3px 8px rgba(255,59,48,.4);}
  button.btn.toggle-on{background:#ff9500;border-color:#ff9500;color:#fff;box-shadow:0 1px 3px rgba(255,149,0,.35);}
  button.btn.toggle-on:hover{background:#ffa421;}
  button.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
  button.btn:disabled:hover{background:#ffffff;border-color:rgba(0,0,0,.1);box-shadow:none;}
  .segmented{display:flex;align-items:center;background:#e8e8ed;border-radius:8px;padding:2px;gap:2px;}
  .segmented button{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    font-size:13px;font-weight:600;color:#6e6e73;background:transparent;border:none;
    padding:6px 16px;border-radius:6px;cursor:pointer;transition:background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .segmented button:hover{color:#1d1d1f;}
  .segmented button.active{background:#ffffff;color:#0071e3;box-shadow:0 1px 3px rgba(0,0,0,.15);}
  button.mic{
    border:1px solid rgba(0,0,0,.1);background:#ffffff;border-radius:50%;
    width:30px;height:30px;flex:none;cursor:pointer;font-size:14px;line-height:1;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, box-shadow .15s ease;
  }
  button.mic:hover{background:#f5f5f7;}
  button.mic.listening{background:#ff3b30;color:#fff;border-color:#ff3b30;animation:pulse 1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.5);}70%{box-shadow:0 0 0 8px rgba(255,59,48,0);}100%{box-shadow:0 0 0 0 rgba(255,59,48,0);}}

  #hopWrap{display:flex;align-items:center;gap:8px;font-size:12px;color:#6e6e73;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;}
  #hopWrap input[type=range]{width:110px;accent-color:#0071e3;}
  #hopLabel{font-family:'IBM Plex Mono',monospace;min-width:34px;text-align:center;font-size:12px;background:#e8e8ed;border-radius:4px;padding:2px 4px;color:#1d1d1f;}
  button.lang-flag{opacity:.45;padding:6px 10px;}
  button.lang-flag.active{opacity:1;border-color:#0071e3;background:#fff;color:#0071e3;font-weight:700;}
  #searchGrp{gap:6px;}
  .dropdown{position:relative;}
  .dropdown-caret{font-size:10px;opacity:.6;margin-left:2px;}
  .dropdown-panel{
    display:none;flex-direction:column;gap:2px;position:fixed;
    background:#ffffff;border-radius:10px;border:1px solid rgba(0,0,0,.08);
    box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px;min-width:230px;max-width:calc(100vw - 16px);z-index:80;
  }
  .dropdown-panel.open{display:flex;}
  .dropdown-item{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    font-size:13px;font-weight:500;color:#1d1d1f;background:none;border:none;
    text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;
    display:flex;align-items:center;white-space:nowrap;width:100%;
    transition:background .1s ease;
  }
  .dropdown-item:hover{background:#f5f5f7;}
  .dropdown-item:disabled{opacity:.35;cursor:not-allowed;}
  .dropdown-item:disabled:hover{background:none;}
  .dropdown-item.toggle-on{background:#ff9500;color:#fff;}
  .dropdown-item.toggle-on:hover{background:#ffa421;}
  .dropdown-sep{height:1px;background:rgba(0,0,0,.08);margin:5px 4px;}
  .share-grid{display:flex;gap:14px;justify-content:center;padding:8px 0 4px;flex-wrap:wrap;}
  .share-item{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:none;border:none;cursor:pointer;width:76px;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  }
  .share-icon{
    width:56px;height:56px;border-radius:14px;background:#f5f5f7;
    display:flex;align-items:center;justify-content:center;font-size:26px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .1s ease, box-shadow .15s ease;
  }
  .share-item:hover .share-icon{transform:scale(1.06);box-shadow:0 3px 8px rgba(0,0,0,.14);}
  .share-item:active .share-icon{transform:scale(.96);}
  .share-label{font-size:12px;font-weight:600;color:#1d1d1f;text-align:center;}
  #searchInput{
    font-family:'Space Grotesk',sans-serif;font-size:13px;padding:7px 10px;border:1px solid var(--line);
    border-radius:6px;background:#fff;color:var(--ink);width:150px;
  }
  #searchInput:focus{outline:none;border-color:var(--accent);}
  #searchMic{width:30px;height:30px;font-size:13px;}
  .search-results{
    display:none;position:fixed;z-index:45;background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 6px 20px rgba(0,0,0,.2);max-height:50vh;overflow-y:auto;min-width:220px;
  }
  .search-results.open{display:block;}
  .search-results .sr-item{
    display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);
  }
  .search-results .sr-item:last-child{border-bottom:none;}
  .search-results .sr-item:hover{background:#f2fbfa;}
  .search-results .sr-icon{font-size:18px;flex:none;}
  .search-results .sr-main{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .search-results .sr-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .search-results .sr-meta{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .search-results .sr-empty{padding:12px;font-size:13px;color:var(--ink-soft);}
  @keyframes searchPulse{
    0%{ filter:drop-shadow(0 0 0px var(--warn)); }
    40%{ filter:drop-shadow(0 0 14px var(--warn)); }
    100%{ filter:drop-shadow(0 0 0px var(--warn)); }
  }
  .search-pulse{ animation:searchPulse 1.1s ease-out 2; }

  /* Layout */
  #layout{flex:1;display:flex;min-height:0;position:relative;}
  #inspector{
    width:300px;flex:none;background:var(--panel-bg);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-width:0;
    transition:width .2s ease;position:relative;z-index:4;
  }
  #inspector.collapsed{width:34px;}
  #inspectorHeader{
    display:flex;align-items:center;justify-content:flex-end;flex:none;
    padding:8px;border-bottom:1px solid var(--line);
  }
  #inspectorArrowBtn{
    background:var(--white);border:1px solid var(--line);border-radius:6px;
    width:26px;height:26px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none;
  }
  #inspectorArrowBtn:hover{border-color:var(--accent);}
  #inspectorContent{overflow-y:auto;padding:0 16px 16px;flex:1;min-width:266px;}
  #inspector.collapsed #inspectorContent{display:none;}
  #inspector.collapsed #inspectorHeader{justify-content:center;}
  #inspector h2{font-size:15px;margin:0 0 12px;letter-spacing:.2px;}
  #inspector .empty{color:var(--ink-soft);font-size:13px;line-height:1.5;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
  .field-row{display:flex;gap:6px;align-items:center;}
  .field input[type=text]{
    flex:1;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:7px 8px;
    border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%;
  }
  .field select{
    flex:1;font-family:'Space Grotesk',sans-serif;font-size:13px;padding:7px 8px;
    border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);
  }
  .node-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .node-icon{font-size:28px;width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .node-class-label{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .rel-list{list-style:none;margin:0;padding:0;}
  .rel-list li{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);}
  .rel-list .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--panel-bg-2);border-radius:3px;padding:1px 5px;}
  .link-btn{background:none;border:none;color:var(--accent-dark);font-size:12px;cursor:pointer;padding:0;text-decoration:underline;font-family:'Space Grotesk',sans-serif;}
  .small-x{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:0 4px;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .hint{font-size:11px;color:var(--ink-soft);line-height:1.5;margin-top:4px;}

  /* Canvas area */
  #canvasWrap{flex:1;position:relative;min-width:0;background:
      radial-gradient(circle at 1px 1px, var(--canvas-grid) 1px, transparent 0) 0 0/22px 22px,
      var(--canvas-bg);
  }
  svg#graph2d, #graph3d{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  #graph3d{display:none;}
  #graph3d canvas{display:block;}
  #graph2d{cursor:grab;}
  #graph2d.panning{cursor:grabbing;}
  .node-label{font-family:'Space Grotesk',sans-serif;font-size:12px;fill:var(--white);pointer-events:none;}
  .edge-line{stroke:var(--edge);stroke-width:2.2;fill:none;marker-end:url(#arrow);cursor:pointer;}
  .edge-line.selected{stroke:var(--danger);stroke-width:3;}
  .edge-line-hit{stroke:transparent;stroke-width:16;fill:none;cursor:pointer;}
  .node-circle{stroke-width:2.5;cursor:grab;}
  .node-circle.focus{stroke:var(--warn);stroke-width:4;}
  .connect-handle{fill:var(--accent);stroke:#fff;stroke-width:1.5;cursor:crosshair;opacity:0;transition:opacity .1s;}
  .node-group:hover .connect-handle{opacity:1;}
  .expand-badge{cursor:pointer;}
  .expand-badge circle{fill:var(--warn);stroke:#fff;stroke-width:1.5;}
  .expand-badge text{fill:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;pointer-events:none;}
  .expand-badge:hover circle{fill:#b06f26;}
  .temp-edge{stroke:var(--warn);stroke-width:2;stroke-dasharray:5 4;fill:none;pointer-events:none;}

  #legend{position:absolute;left:14px;bottom:14px;background:rgba(20,24,30,.82);border:1px solid #2a323d;border-radius:8px;padding:10px 12px;font-size:11px;color:#c9d0da;max-width:230px;max-height:60vh;display:flex;flex-direction:column;}
  #legendBody{overflow-y:auto;order:-1;}
  .legend-group{margin-bottom:6px;}
  .legend-group-title{color:#8fd8d0;font-weight:600;padding-left:0 !important;}
  .legend-cluster{margin-bottom:4px;}
  .legend-cluster summary{cursor:pointer;font-weight:700;color:#f0c86e;padding:3px 0;list-style:revert;}
  .legend-cluster summary:hover{color:#ffdd94;}
  .legend-cluster[open] summary{margin-bottom:2px;}
  #legend h3{margin:0 0 6px;font-size:11px;color:#8fd8d0;font-family:'IBM Plex Mono',monospace;font-weight:500;cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px;}
  #legend h3:hover{color:#bff0ea;}
  #legendArrow{display:inline-block;transition:transform .15s;font-size:10px;}
  #legendArrow.collapsed{transform:rotate(-90deg);}
  #legendBody{overflow:hidden;transition:max-height .18s ease;}
  #legendBody.collapsed{max-height:0 !important;}

  #legend .row{display:flex;align-items:center;gap:6px;margin:2px 0;}

  /* Modal */
  #modalRoot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,15,.55);z-index:50;}
  #modalRoot.open{display:flex;}
  .modal{background:#fff;border-radius:10px;padding:20px;width:380px;max-width:90vw;max-height:80vh;overflow-y:auto;}
  .modal.modal-wide{width:560px;}
  .modal h3{margin:0 0 12px;font-size:16px;}
  .modal-list{list-style:none;margin:0;padding:0;}
  .modal-list li{padding:10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;}
  .modal-list li:hover{border-color:var(--accent);background:#f2fbfa;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  .modal input[type=text]{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .help-body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;}
  .help-body h4{margin:16px 0 4px;font-size:13.5px;font-weight:700;color:#0071e3;}
  .help-body h4:first-child{margin-top:0;}
  .help-body p{margin:0 0 4px;font-size:13px;line-height:1.55;color:var(--ink);}

  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1a2028;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;}
  #toast.show{opacity:1;}

  /* Smartphone / schmale Bildschirme */
  @media (max-width: 700px){
    #toolbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 8px;}
    #toolbar .grp{padding:0 6px;}
    .modelname{max-width:110px;font-size:13px;}
    button.btn{padding:7px 10px;font-size:12px;}
    #hopWrap input[type=range]{width:80px;}
    #searchInput{width:100px;}
    #inspector{position:absolute;left:0;top:0;bottom:0;box-shadow:2px 0 10px rgba(0,0,0,.25);width:82vw;max-width:320px;}
    #inspector.collapsed{width:34px;box-shadow:none;}
    #legend{max-width:56vw;font-size:10px;padding:8px 10px;max-height:40vh;}
    #legend h3{font-size:10px;}
  }
  @media (max-width: 380px){
    #inspector{width:88vw;}
    .modelname{display:none;}
  }

</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="grp">
      <span class="modelname" id="modelNameLabel">Neues Modell</span>
    </div>
    <div class="grp">
      <button class="btn" id="btnNewModel">Neues Modell</button>
      <button class="btn" id="btnOpen">Öffnen</button>
      <button class="btn primary" id="btnSave">Speichern</button>
      <button class="btn" id="btnNewObject">+ Objekt</button>
    </div>
    <div class="grp">
      <div class="dropdown" id="menuDropdown">
        <button class="btn" id="menuToggleBtn"><span id="menuToggleLabel">Menü</span> <span class="dropdown-caret">▾</span></button>
        <div class="dropdown-panel" id="menuPanel">
          <button class="dropdown-item" id="btnMerge">Fusionieren</button>
          <button class="dropdown-item" id="btnCouple">Koppeln</button>
          <div class="dropdown-sep"></div>
          <button class="dropdown-item" id="btnExportFile" title="Modell als Datei auf dein Gerät herunterladen">⬇ Als Datei sichern</button>
          <button class="dropdown-item" id="btnImportFile" title="Zuvor gesicherte Datei wieder öffnen">⬆ Datei öffnen</button>
          <button class="dropdown-item" id="btnShareFile" title="Modell teilen (z. B. per E-Mail, WhatsApp, AirDrop)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px;"><path d="M12 3v12"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v6.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V12"/></svg><span id="btnShareFileLabel">Teilen</span>
          </button>
          <div class="dropdown-sep"></div>
          <button class="dropdown-item" id="btnConnectMode">🔗 Verbinden</button>
          <button class="dropdown-item" id="btnDeleteEdge" disabled>Kante entfernen</button>
        </div>
      </div>
      <input type="file" id="fileImportInput" accept="application/json,.json" style="display:none">
    </div>
    <div class="grp" id="langGrp">
      <button class="btn lang-flag active" id="btnLangDe" title="Deutsch">🇩🇪 DE</button>
      <button class="btn lang-flag" id="btnLangEn" title="English">🇬🇧 EN</button>
      <button class="btn" id="btnHelp" title="Hilfe / Help">?</button>
    </div>
  </div>
  <div id="searchResults" class="search-results"></div>

  <div id="layout">
    <aside id="inspector">
      <div id="inspectorHeader"><button id="inspectorArrowBtn" title="Fenster ein-/ausklappen"><span id="inspectorArrow">◂</span></button></div>
      <div id="inspectorContent"><h2>Objekt</h2><div class="empty">Klicke auf ein Objekt im Diagramm, um seine Eigenschaften zu sehen oder zu bearbeiten.</div></div>
    </aside>
    <div id="canvasWrap">
      <svg id="graph2d">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#5b93c9"></path>
          </marker>
        </defs>
        <g id="edgeLayer"></g>
        <g id="nodeLayer"></g>
      </svg>
      <div id="graph3d"></div>
      <div id="legend">
        <h3 id="legendToggle"><span id="legendArrow">▴</span> <span id="legendTitleText">Klassen</span></h3>
        <div id="legendBody"></div>
      </div>
    </div>
  </div>

  <div id="bottomBar">
    <div class="grp" id="hopWrap">
      <span id="hopWrapLabel">Ebenen:</span>
      <input type="range" id="hopSlider" min="0" max="5" step="1" value="5">
      <span id="hopLabel">Alle</span>
    </div>
    <div class="grp">
      <div class="segmented" id="viewSegmented">
        <button id="btnView2D" class="active">2D</button>
        <button id="btnView3D">3D</button>
      </div>
    </div>
    <div class="grp">
      <button class="btn" id="btnRelayout">Neu anordnen</button>
    </div>
    <div class="grp" id="searchGrp">
      <input type="text" id="searchInput" placeholder="Suchen…" autocomplete="off">
      <button class="mic" id="searchMic">🎤</button>
    </div>
  </div>
</div>

<div id="modalRoot"><div class="modal" id="modalBody"></div></div>

function t(key){ const e = UI[key]; return e ? (e[lang]||e.de) : key; }

/* ---------------------------------------------------------------
   2. STATE
--------------------------------------------------------------- */
let state = { modelId:null, modelName:"Neues Modell", nodes:[], edges:[], dirty:false };
let selectedNodeId = null, focusNodeId = null, selectedEdgeId = null;
let connectMode = false, view3D = false;
let hopIdx = 5;
let expandedNodes = new Set();
let pendingFileMode = "open"; // 'open' | 'merge' | 'couple' -- steuert, was beim Datei-Dialog passiert
let lastSelectedCluster = "technik";
let pulseNodeId = null;

function uid(prefix){ return prefix+"_"+Math.random().toString(36).slice(2,9); }
function markDirty(){ state.dirty = true; }

function newModel(){
  state = { modelId:null, modelName:t("newModelDefaultName"), nodes:[], edges:[], dirty:false };
  const n = { id:uid("obj"), class:"neutral", name:t("newObjectDefaultName"), params:{}, group:"A",
              pos2d:{x:0,y:0}, pos3d:{x:0,y:0,z:0}, pinned2d:false, pinned3d:false };
  state.nodes.push(n);
  selectedNodeId = n.id; focusNodeId = null; selectedEdgeId = null; expandedNodes = new Set();
  document.getElementById("modelNameLabel").textContent = state.modelName;
  layout2D(); layout3D();
  renderAll();
}

/* ---------------------------------------------------------------
   3. FORCE LAYOUT (einfache Feder/Abstoßungs-Simulation, statisch berechnet)
--------------------------------------------------------------- */
function runForceLayout(getPos, setPos, dims){
  const nodes = state.nodes;
  if(!nodes.length) return;
  const idIndex = {}; nodes.forEach((n,i)=>idIndex[n.id]=i);
  let pos = nodes.map(n=>Object.assign({},getPos(n)));
  const pinned = nodes.map(n=> dims===2 ? n.pinned2d : n.pinned3d);
  // Zufällige Startwerte falls alles 0
  const allZero = pos.every(p=>p.x===0 && p.y===0 && (dims===2 || p.z===0));
  if(allZero){
    pos.forEach((p,i)=>{
      const a = (i/nodes.length)*Math.PI*2;
      p.x = Math.cos(a)*140; p.y = Math.sin(a)*140;
      if(dims===3) p.z = (Math.random()-0.5)*140;
    });
  }
  const REPULSE = dims===2 ? 9000 : 4500;
  const SPRING = 0.02, IDEAL = dims===2 ? 130 : 110, CENTER = 0.003, ITER = 260;
  for(let it=0; it<ITER; it++){
    const disp = pos.map(()=>({x:0,y:0,z:0}));
    for(let i=0;i<pos.length;i++){
      for(let j=i+1;j<pos.length;j++){
        let dx=pos[i].x-pos[j].x, dy=pos[i].y-pos[j].y, dz=dims===3?(pos[i].z-pos[j].z):0;
        let d2 = dx*dx+dy*dy+dz*dz; if(d2<1) d2=1;
        const d = Math.sqrt(d2);
        const f = REPULSE/d2;
        const ux=dx/d, uy=dy/d, uz=dz/d;
        disp[i].x+=ux*f; disp[i].y+=uy*f; if(dims===3) disp[i].z+=uz*f;
        disp[j].x-=ux*f; disp[j].y-=uy*f; if(dims===3) disp[j].z-=uz*f;
      }
    }
    state.edges.forEach(e=>{
      const i=idIndex[e.from], j=idIndex[e.to];
      if(i===undefined||j===undefined) return;
      let dx=pos[i].x-pos[j].x, dy=pos[i].y-pos[j].y, dz=dims===3?(pos[i].z-pos[j].z):0;
      const d = Math.max(1,Math.sqrt(dx*dx+dy*dy+dz*dz));
      const f = SPRING*(d-IDEAL);
      const ux=dx/d, uy=dy/d, uz=dz/d;
      disp[i].x-=ux*f; disp[i].y-=uy*f; if(dims===3) disp[i].z-=uz*f;
      disp[j].x+=ux*f; disp[j].y+=uy*f; if(dims===3) disp[j].z+=uz*f;
    });
    for(let i=0;i<pos.length;i++){
      if(pinned[i]) continue;
      disp[i].x -= pos[i].x*CENTER; disp[i].y -= pos[i].y*CENTER;
      if(dims===3) disp[i].z -= pos[i].z*CENTER;
      pos[i].x += disp[i].x; pos[i].y += disp[i].y;
      if(dims===3) pos[i].z += disp[i].z;
    }
  }
  nodes.forEach((n,i)=> setPos(n,pos[i]));
}
function layout2D(){ runForceLayout(n=>n.pos2d, (n,p)=>{n.pos2d.x=p.x;n.pos2d.y=p.y;}, 2); }
function layout3D(){ runForceLayout(n=>n.pos3d, (n,p)=>{n.pos3d.x=p.x;n.pos3d.y=p.y;n.pos3d.z=p.z;}, 3); }

/* ---------------------------------------------------------------
   4. SICHTBARKEIT / EBENEN-FILTER
--------------------------------------------------------------- */
function visibleSet(){
  const maxHop = HOP_STEPS[hopIdx];
  const adj = {};
  state.nodes.forEach(n=>adj[n.id]=[]);
  state.edges.forEach(e=>{ if(adj[e.from]) adj[e.from].push([e.to,e.id]); if(adj[e.to]) adj[e.to].push([e.from,e.id]); });
  if(!focusNodeId || maxHop===Infinity){
    return { nodes:new Set(state.nodes.map(n=>n.id)), edges:new Set(state.edges.map(e=>e.id)), adj, hidden:new Set() };
  }
  const dist = {}; dist[focusNodeId]=0;
  const queue=[focusNodeId]; const edgesUsed = new Set();
  while(queue.length){
    const cur = queue.shift();
    if(dist[cur]>=maxHop) continue;
    (adj[cur]||[]).forEach(([nb,eid])=>{
      edgesUsed.add(eid);
      if(!(nb in dist)){ dist[nb]=dist[cur]+1; queue.push(nb); }
    });
  }
  const nodeSet = new Set(Object.keys(dist));
  // Manuell per "+" aufgeklappte Objekte: deren Nachbarn zusätzlich sichtbar machen
  expandedNodes.forEach(id=>{
    (adj[id]||[]).forEach(([nb,eid])=>{ nodeSet.add(nb); edgesUsed.add(eid); });
  });
  // Objekte ganz ohne Beziehungen sind über die Graph-Traversierung vom Fokus-Objekt aus
  // niemals erreichbar und würden bei JEDER Auswahl dauerhaft unsichtbar bleiben -> immer mit anzeigen
  state.nodes.forEach(n=>{ if((adj[n.id]||[]).length===0) nodeSet.add(n.id); });
  const edgeSet = new Set([...edgesUsed].filter(eid=>{
    const e = state.edges.find(x=>x.id===eid);
    return e && nodeSet.has(e.from) && nodeSet.has(e.to);
  }));
  const hidden = new Set();
  nodeSet.forEach(id=>{
    const hasHiddenNb = (adj[id]||[]).some(([nb])=>!nodeSet.has(nb));
    if(hasHiddenNb) hidden.add(id);
  });
  return { nodes:nodeSet, edges:edgeSet, adj, hidden };
}
function expandNode(id){
  expandedNodes.add(id);
  renderAll();
}

/* ---------------------------------------------------------------
   5. RENDERING – 2D (SVG)
--------------------------------------------------------------- */
const svg = document.getElementById("graph2d");
const edgeLayer = document.getElementById("edgeLayer");
const nodeLayer = document.getElementById("nodeLayer");
let panX=0, panY=0, zoom=1;
const ZOOM_MIN=0.2, ZOOM_MAX=4;

function svgSetTransform(){
  const t = `translate(${panX} ${panY}) scale(${zoom})`;
  edgeLayer.setAttribute("transform",t);
  nodeLayer.setAttribute("transform",t);
}
function centerOf(){ const r = svg.getBoundingClientRect(); return {cx:r.width/2, cy:r.height/2}; }

function render2D(){
  const {cx,cy} = centerOf();
  panX = panX || cx; panY = panY || cy;
  const vis = visibleSet();
  edgeLayer.innerHTML=""; nodeLayer.innerHTML="";
  state.edges.forEach(e=>{
    if(!vis.edges.has(e.id)) return;
    const a = state.nodes.find(n=>n.id===e.from), b = state.nodes.find(n=>n.id===e.to);
    if(!a||!b) return;
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    const hit = document.createElementNS("http://www.w3.org/2000/svg","path");
    hit.setAttribute("class","edge-line-hit");
    hit.setAttribute("d",`M${a.pos2d.x},${a.pos2d.y} L${b.pos2d.x},${b.pos2d.y}`);
    const line = document.createElementNS("http://www.w3.org/2000/svg","path");
    line.setAttribute("class","edge-line"+(selectedEdgeId===e.id?" selected":""));
    line.setAttribute("d",`M${a.pos2d.x},${a.pos2d.y} L${b.pos2d.x},${b.pos2d.y}`);
    [hit,line].forEach(el=>el.addEventListener("click",(ev)=>{ ev.stopPropagation(); selectEdge(e.id); }));
    g.appendChild(hit); g.appendChild(line);
    edgeLayer.appendChild(g);
  });
  state.nodes.forEach(n=>{
    if(!vis.nodes.has(n.id)) return;
    const cls = CLASSES[n.class];
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","node-group"+(pulseNodeId===n.id ? " search-pulse":""));
    g.setAttribute("transform",`translate(${n.pos2d.x},${n.pos2d.y})`);
    const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("class","node-circle"+(focusNodeId===n.id?" focus":""));
    circle.setAttribute("r",26);
    circle.setAttribute("fill",cls.color);
    circle.setAttribute("stroke", n.class==="neutral" ? "#fff" : "#12161c");
    const icon = document.createElementNS("http://www.w3.org/2000/svg","text");
    icon.setAttribute("text-anchor","middle"); icon.setAttribute("dy","7"); icon.setAttribute("font-size","22");
    icon.textContent = cls.icon;
    const label = document.createElementNS("http://www.w3.org/2000/svg","text");
    label.setAttribute("class","node-label"); label.setAttribute("text-anchor","middle"); label.setAttribute("dy","44");
    label.textContent = n.name || t("noNameLabel");
    const handle = document.createElementNS("http://www.w3.org/2000/svg","circle");
    handle.setAttribute("class","connect-handle"); handle.setAttribute("r",7);
    handle.setAttribute("cx",26*Math.cos(-Math.PI/4)); handle.setAttribute("cy",26*Math.sin(-Math.PI/4));
    g.appendChild(circle); g.appendChild(icon); g.appendChild(label); g.appendChild(handle);
    if(vis.hidden && vis.hidden.has(n.id)){
      const bx = 26*Math.cos(-3*Math.PI/4), by = 26*Math.sin(-3*Math.PI/4);
      const badge = document.createElementNS("http://www.w3.org/2000/svg","g");
      badge.setAttribute("class","expand-badge");
      badge.setAttribute("transform",`translate(${bx},${by})`);
      const bCircle = document.createElementNS("http://www.w3.org/2000/svg","circle");
      bCircle.setAttribute("r",9);
      const bPlus = document.createElementNS("http://www.w3.org/2000/svg","text");
      bPlus.setAttribute("text-anchor","middle"); bPlus.setAttribute("dy","4"); bPlus.setAttribute("font-size","13");
      bPlus.textContent = "+";
      badge.appendChild(bCircle); badge.appendChild(bPlus);
      badge.addEventListener("pointerdown",(ev)=>{ ev.stopPropagation(); });
      badge.addEventListener("click",(ev)=>{ ev.stopPropagation(); expandNode(n.id); });
      g.appendChild(badge);
    }
    attachNodeEvents2D(g, n, handle);
    nodeLayer.appendChild(g);
  });
  svgSetTransform();
}

/* Pointer-Interaktion 2D */
let dragNode2D = null, dragStart = null, panning=false, panStart=null, tempLineSrc=null;
let tempLineEl = null, dragActuallyMoved=false;
const DRAG_THRESHOLD = 5;

function attachNodeEvents2D(g, n, handle){
  g.addEventListener("pointerdown",(ev)=>{
    ev.stopPropagation();
    if(ev.target===handle || connectMode){
      tempLineSrc = n;
      tempLineEl = document.createElementNS("http://www.w3.org/2000/svg","line");
      tempLineEl.setAttribute("class","temp-edge");
      edgeLayer.appendChild(tempLineEl);
    } else {
      dragNode2D = n; dragActuallyMoved=false;
      dragStart = {x:ev.clientX,y:ev.clientY, ox:n.pos2d.x, oy:n.pos2d.y};
    }
    window.addEventListener("pointermove",onPointerMove2D);
    window.addEventListener("pointerup",onPointerUp2D,{once:true});
  });
}
function onPointerMove2D(ev){
  if(tempLineSrc){
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX-r.left-panX)/zoom, y=(ev.clientY-r.top-panY)/zoom;
    tempLineEl.setAttribute("x1",tempLineSrc.pos2d.x); tempLineEl.setAttribute("y1",tempLineSrc.pos2d.y);
    tempLineEl.setAttribute("x2",x); tempLineEl.setAttribute("y2",y);
  } else if(dragNode2D){
    const dx=(ev.clientX-dragStart.x)/zoom, dy=(ev.clientY-dragStart.y)/zoom;
    if(!dragActuallyMoved && Math.hypot(ev.clientX-dragStart.x, ev.clientY-dragStart.y) > DRAG_THRESHOLD){
      dragActuallyMoved = true; dragNode2D.pinned2d = true; markDirty();
    }
    if(dragActuallyMoved){
      dragNode2D.pos2d.x = dragStart.ox+dx; dragNode2D.pos2d.y = dragStart.oy+dy;
      render2D();
    }
  } else if(panning){
    panX = panStart.px + (ev.clientX-panStart.x);
    panY = panStart.py + (ev.clientY-panStart.y);
    svgSetTransform();
  }
}
function onPointerUp2D(ev){
  window.removeEventListener("pointermove",onPointerMove2D);
  if(tempLineSrc){
    const el = document.elementFromPoint(ev.clientX,ev.clientY);
    const targetG = el ? el.closest(".node-group") : null;
    if(targetG){
      const idx = [...nodeLayer.children].indexOf(targetG);
      const visNodes = state.nodes.filter(n=>visibleSet().nodes.has(n.id));
      const targetNode = visNodes[idx];
      if(targetNode && targetNode.id!==tempLineSrc.id) createEdge(tempLineSrc.id, targetNode.id);
    }
    tempLineEl && tempLineEl.remove();
    tempLineSrc=null; tempLineEl=null;
  }
  if(dragNode2D){
    if(!dragActuallyMoved){ selectNode(dragNode2D.id); }
    dragNode2D=null;
  }
  panning=false; svg.classList.remove("panning");
  render2D();
}
svg.addEventListener("pointerdown",(ev)=>{
  if(ev.target===svg){
    panning=true; panStart={x:ev.clientX,y:ev.clientY,px:panX,py:panY};
    svg.classList.add("panning");
    selectedEdgeId=null; updateDeleteEdgeBtn();
    window.addEventListener("pointermove",onPointerMove2D);
    window.addEventListener("pointerup",onPointerUp2D,{once:true});
  }
});
svg.addEventListener("wheel",(ev)=>{
  ev.preventDefault();
  const factor = ev.deltaY<0 ? 1.08 : 0.92;
  zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom*factor));
  svgSetTransform();
},{passive:false});

/* ---------------------------------------------------------------
   6. RENDERING – 3D (three.js)
--------------------------------------------------------------- */
let three = { scene:null, camera:null, renderer:null, group:null, raycaster:null, meshes:{}, initialized:false };
let rot = {x:-0.3, y:0.5}, camDist=420;
const CAM_MIN=120, CAM_MAX=1400;
document.getElementById("graph3d").addEventListener("wheel",(ev)=>{
  ev.preventDefault();
  const factor = ev.deltaY<0 ? 0.9 : 1.1;
  camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, camDist*factor));
},{passive:false});
let dragging3D=null, panningView3D=false, panStart3D=null, connectSrc3D=null, tempLine3D=null;
let dragActuallyMoved3D=false, dragStart3D=null;

function init3D(){
  if(three.initialized) return;
  const container = document.getElementById("graph3d");
  const w = container.clientWidth, h = container.clientHeight;
  three.scene = new THREE.Scene();
  three.camera = new THREE.PerspectiveCamera(50, w/h, 1, 5000);
  three.renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  three.renderer.setSize(w,h); three.renderer.setPixelRatio(window.devicePixelRatio||1);
  container.appendChild(three.renderer.domElement);
  three.scene.add(new THREE.AmbientLight(0xffffff,0.8));
  const dl = new THREE.DirectionalLight(0xffffff,0.6); dl.position.set(200,300,400); three.scene.add(dl);
  three.group = new THREE.Group(); three.scene.add(three.group);
  three.raycaster = new THREE.Raycaster();
  three.initialized = true;

  const dom = three.renderer.domElement;
  dom.addEventListener("pointerdown", on3DPointerDown);
  window.addEventListener("resize", resize3D);
  animate3D();
}
function resize3D(){
  if(!three.initialized) return;
  const container = document.getElementById("graph3d");
  const w = container.clientWidth, h = container.clientHeight;
  three.camera.aspect = w/h; three.camera.updateProjectionMatrix();
  three.renderer.setSize(w,h);
}
function makeSprite(text, color){
  const cvs = document.createElement("canvas"); cvs.width=256; cvs.height=96;
  const ctx = cvs.getContext("2d");
  ctx.font="46px sans-serif"; ctx.textAlign="center"; ctx.fillText(text.icon,128,54);
  ctx.font="500 26px 'Space Grotesk', sans-serif"; ctx.fillStyle="#f6f7f9";
  ctx.fillText(text.label.length>16?text.label.slice(0,15)+"…":text.label,128,88);
  const tex = new THREE.CanvasTexture(cvs);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
  const spr = new THREE.Sprite(mat); spr.scale.set(70,26,1);
  return spr;
}
function rebuild3DObjects(){
  if(!three.initialized) return;
  while(three.group.children.length) three.group.remove(three.group.children[0]);
  three.meshes = {};
  const vis = visibleSet();
  const edgeMat = new THREE.LineBasicMaterial({color:0x5b93c9});
  state.edges.forEach(e=>{
    if(!vis.edges.has(e.id)) return;
    const a = state.nodes.find(n=>n.id===e.from), b = state.nodes.find(n=>n.id===e.to);
    if(!a||!b) return;
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(a.pos3d.x,a.pos3d.y,a.pos3d.z),
      new THREE.Vector3(b.pos3d.x,b.pos3d.y,b.pos3d.z)]);
    const mat = e.id===selectedEdgeId ? new THREE.LineBasicMaterial({color:0xd1495b}) : edgeMat;
    const line = new THREE.Line(geo,mat); line.userData.edgeId = e.id;
    three.group.add(line);
  });
  state.nodes.forEach(n=>{
    if(!vis.nodes.has(n.id)) return;
    const cls = CLASSES[n.class];
    const geo = new THREE.SphereGeometry(16,20,20);
    const mat = new THREE.MeshStandardMaterial({color: new THREE.Color(cls.color), emissive: n.id===focusNodeId? new THREE.Color(0xE8963C):0x000000, emissiveIntensity:0.4});
    const mesh = new THREE.Mesh(geo,mat);
    mesh.position.set(n.pos3d.x,n.pos3d.y,n.pos3d.z);
    mesh.userData.nodeId = n.id;
    three.group.add(mesh);
    three.meshes[n.id]=mesh;
    const spr = makeSprite({icon:cls.icon, label:n.name||t("noNameLabel")}, cls.color);
    spr.position.set(n.pos3d.x,n.pos3d.y+34,n.pos3d.z);
    three.group.add(spr);
  });
}
function animate3D(){
  requestAnimationFrame(animate3D);
  if(!three.initialized || !view3D) return;
  three.group.rotation.x = rot.x; three.group.rotation.y = rot.y;
  three.camera.position.set(0,0,camDist); three.camera.lookAt(0,0,0);
  three.renderer.render(three.scene, three.camera);
}
function ndcFromEvent(ev){
  const r = three.renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
}
function pickNode3D(ev){
  three.raycaster.setFromCamera(ndcFromEvent(ev), three.camera);
  const meshList = Object.values(three.meshes);
  const hits = three.raycaster.intersectObjects(meshList);
  return hits.length ? state.nodes.find(n=>n.id===hits[0].object.userData.nodeId) : null;
}
function on3DPointerDown(ev){
  const hitNode = pickNode3D(ev);
  if(hitNode && connectMode){
    connectSrc3D = hitNode;
    const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(hitNode.pos3d.x,hitNode.pos3d.y,hitNode.pos3d.z), new THREE.Vector3(hitNode.pos3d.x,hitNode.pos3d.y,hitNode.pos3d.z)]);
    tempLine3D = new THREE.Line(geo, new THREE.LineDashedMaterial({color:0xe8963c, dashSize:4, gapSize:3}));
    three.group.add(tempLine3D);
    window.addEventListener("pointermove", on3DConnectMove);
    window.addEventListener("pointerup", on3DConnectUp, {once:true});
  } else if(hitNode){
    dragging3D = hitNode; dragActuallyMoved3D=false; dragStart3D={x:ev.clientX,y:ev.clientY};
    window.addEventListener("pointermove", on3DDragMove);
    window.addEventListener("pointerup", on3DDragUp, {once:true});
  } else {
    // Check edge click
    three.raycaster.setFromCamera(ndcFromEvent(ev), three.camera);
    const lines = three.group.children.filter(c=>c.type==="Line" && c.userData.edgeId);
    const hits = three.raycaster.intersectObjects(lines);
    if(hits.length){ selectEdge(hits[0].object.userData.edgeId); return; }
    panningView3D = true;
    panStart3D = {x:ev.clientX,y:ev.clientY, rx:rot.x, ry:rot.y};
    selectedEdgeId=null; updateDeleteEdgeBtn(); rebuild3DObjects();
    window.addEventListener("pointermove", on3DPanMove);
    window.addEventListener("pointerup", ()=>{ panningView3D=false; window.removeEventListener("pointermove",on3DPanMove); }, {once:true});
  }
}
function on3DPanMove(ev){
  if(!panningView3D) return;
  rot.y = panStart3D.ry + (ev.clientX-panStart3D.x)*0.008;
  rot.x = Math.max(-1.3, Math.min(1.3, panStart3D.rx + (ev.clientY-panStart3D.y)*0.008));
}
function on3DDragMove(ev){
  if(!dragging3D) return;
  if(!dragActuallyMoved3D){
    if(Math.hypot(ev.clientX-dragStart3D.x, ev.clientY-dragStart3D.y) <= DRAG_THRESHOLD) return;
    dragActuallyMoved3D = true; dragging3D.pinned3d = true; markDirty();
  }
  // Verschiebung auf einer Ebene parallel zur Kamera, in Höhe des Knotens
  three.raycaster.setFromCamera(ndcFromEvent(ev), three.camera);
  const normal = new THREE.Vector3(); three.camera.getWorldDirection(normal);
  const planePoint = new THREE.Vector3(dragging3D.pos3d.x,dragging3D.pos3d.y,dragging3D.pos3d.z).applyEuler(three.group.rotation);
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, planePoint);
  const ipt = new THREE.Vector3();
  three.raycaster.ray.intersectPlane(plane, ipt);
  if(ipt){
    const inv = three.group.rotation.clone();
    const local = ipt.clone().applyEuler(new THREE.Euler(-inv.x,-inv.y,-inv.z,"ZYX"));
    dragging3D.pos3d.x = local.x; dragging3D.pos3d.y = local.y; dragging3D.pos3d.z = local.z;
    rebuild3DObjects();
  }
}
function on3DDragUp(){
  if(dragging3D && !dragActuallyMoved3D){ selectNode(dragging3D.id); }
  dragging3D=null; window.removeEventListener("pointermove",on3DDragMove);
}
function on3DConnectMove(ev){
  if(!connectSrc3D) return;
  three.raycaster.setFromCamera(ndcFromEvent(ev), three.camera);
  const normal = new THREE.Vector3(); three.camera.getWorldDirection(normal);
  const planePoint = new THREE.Vector3(connectSrc3D.pos3d.x,connectSrc3D.pos3d.y,connectSrc3D.pos3d.z).applyEuler(three.group.rotation);
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, planePoint);
  const ipt = new THREE.Vector3();
  three.raycaster.ray.intersectPlane(plane, ipt);
  if(ipt && tempLine3D){
    const posAttr = tempLine3D.geometry.attributes.position;
    const localEnd = ipt.clone(); three.group.worldToLocal(localEnd);
    posAttr.setXYZ(1, localEnd.x, localEnd.y, localEnd.z);
    posAttr.needsUpdate = true;
  }
}
function on3DConnectUp(ev){
  window.removeEventListener("pointermove", on3DConnectMove);
  const target = pickNode3D(ev);
  if(target && connectSrc3D && target.id!==connectSrc3D.id) createEdge(connectSrc3D.id, target.id);
  if(tempLine3D){ three.group.remove(tempLine3D); tempLine3D=null; }
  connectSrc3D=null;
  rebuild3DObjects();
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRecognition = null; // nur eine Spracherkennungs-Sitzung darf gleichzeitig laufen
function micErrorMessage(err){
  switch(err){
    case "not-allowed":
    case "service-not-allowed": return t("micNotAllowed");
    case "no-speech": return t("micNoSpeech");
    case "network": return t("micNetwork");
    case "aborted": return null; // vom Nutzer/Programm selbst abgebrochen, keine Fehlermeldung nötig
    default: return t("micFailed");
  }
}
function startRecognition(button, onResult){
  // Falls bereits eine Sitzung läuft (z. B. anderer Mic-Button), diese zuerst sauber stoppen
  if(activeRecognition){
    try{ activeRecognition.abort(); }catch(e){}
    activeRecognition = null;
  }
  let rec;
  try{
    rec = new SpeechRec();
  }catch(e){
    toast(t("micFailed"));
    return;
  }
  rec.lang = lang==="en" ? "en-US" : "de-DE"; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onresult = (e)=>{ onResult(e.results[0][0].transcript); };
  rec.onerror = (e)=>{
    const msg = micErrorMessage(e && e.error);
    if(msg) toast(msg);
  };
  rec.onend = ()=>{
    button.classList.remove("listening");
    if(activeRecognition===rec) activeRecognition=null;
  };
  try{
    rec.start();
    activeRecognition = rec;
    button.classList.add("listening");
  }catch(e){
    toast(t("micFailed"));
    button.classList.remove("listening");
  }
}
function attachMic(button, onResult){
  if(!SpeechRec){ button.title=t("micUnavailable"); button.disabled=true; button.style.opacity=.35; return; }
  button.addEventListener("click",(ev)=>{
    ev.preventDefault();
    startRecognition(button, onResult);
  });
}
function normalizeText(s){ return s.toLowerCase().replace(/[^a-zäöüß0-9]+/g," ").trim(); }
function matchClassBySpeech(spokenText){
  const spoken = normalizeText(spokenText);
  let best=null, bestScore=0;
  Object.entries(CLASSES).forEach(([key,c])=>{
    if(key==="neutral") return;
    [c.label, c.labelEn].filter(Boolean).forEach(rawLabel=>{
      const label = normalizeText(rawLabel);
      let score = 0;
      if(spoken===label) score = 100;
      else if(spoken.includes(label) || label.includes(spoken)) score = 80;
      else {
        const words = label.split(" ").filter(w=>w.length>2);
        if(words.some(w=>spoken.includes(w))) score = 50;
      }
      if(score>bestScore){ bestScore=score; best=key; }
    });
  });
  return bestScore>0 ? best : null;
}

/* Zweisprachige Werte: jedes Merkmal (außer dem Namen) wird als {de,en}
   abgelegt. Alte, einfache Textwerte werden beim ersten Zugriff automatisch
   migriert (als Wert der zuvor genutzten Sprache, meist Deutsch). */
function getBilingual(obj, key){
  if(!obj[key] || typeof obj[key] !== "object"){
    obj[key] = { de: (typeof obj[key]==="string" ? obj[key] : ""), en:"" };
  }
  return obj[key];
}
function getBiValue(obj, key){ return getBilingual(obj,key)[lang] || ""; }
function setBiValue(obj, key, val){ getBilingual(obj,key)[lang] = val; }

function renderInspector(){

  const node = state.nodes.find(n=>n.id===selectedNodeId);
  if(!node){ box.innerHTML = `<h2>${t("objectHeader")}</h2><div class="empty">${t("emptyInspector")}</div>`; return; }
  const cls = CLASSES[node.class];
  box.innerHTML="";

  const nh = document.createElement("div"); nh.className="node-head";

                  <div><div class="node-class-label">${classLabel(node.class)}</div></div>`;
  box.appendChild(nh);

  // Name (einsprachig, wird nicht übersetzt)
  box.appendChild(fieldRow(t("objectName"), node.name, (val)=>{ node.name=val; renderAll(); }, true));

  // Bemerkung: für jedes Objekt verfügbar, unabhängig von der Klasse -- direkt unter dem Namen
  node.params["bemerkung"] = node.params["bemerkung"] || {de:"",en:""};
  box.appendChild(bilingualFieldRow(t("remarkFieldLabel"), node.params, "bemerkung"));

    // Cluster-Vorauswahl: filtert, welche Gruppen/Klassen im Dropdown erscheinen
    const clusterRow = document.createElement("div"); clusterRow.className="field"; clusterRow.style.marginBottom="8px";
    const clusterLabelEl = document.createElement("label"); clusterLabelEl.textContent = t("clusterLabel");
    const clusterSelect = document.createElement("select");
    clusterSelect.innerHTML = Object.entries(CLUSTERS).map(([ck,c])=>`<option value="${ck}">${c.icon} ${clusterLabel(ck)}</option>`).join("");
    clusterSelect.value = lastSelectedCluster;
    clusterRow.appendChild(clusterLabelEl); clusterRow.appendChild(clusterSelect);
    box.appendChild(clusterRow);

    const row = document.createElement("div"); row.className="field-row";
    const select = document.createElement("select");
    function buildClassOptions(clusterKey){
      select.innerHTML = Object.entries(GROUPS).filter(([,g])=>g.cluster===clusterKey).map(([gKey,g])=>{
        const opts = Object.entries(CLASSES).filter(([,c])=>c.group===gKey)
          .map(([k,c])=>`<option value="${k}">${c.icon} ${classLabel(k)}</option>`).join("");
        return `<optgroup label="${g.icon} ${groupLabel(gKey)}">${opts}</optgroup>`;
      }).join("");
    }
    buildClassOptions(lastSelectedCluster);
    clusterSelect.addEventListener("change",()=>{ lastSelectedCluster = clusterSelect.value; buildClassOptions(clusterSelect.value); });
    const assignBtn = document.createElement("button"); assignBtn.className="btn primary"; assignBtn.textContent=t("assign");
    assignBtn.addEventListener("click",()=>assignClass(node, select.value));
    const mic = document.createElement("button"); mic.className="mic"; mic.textContent="🎤";
    attachMic(mic,(spokenText)=>{
      const match = matchClassBySpeech(spokenText);
      if(match){ lastSelectedCluster = GROUPS[CLASSES[match].group].cluster; assignClass(node, match); } else { toast(`"${spokenText}" – ${t("classNotRecognized")}`); }
    });
    row.appendChild(select); row.appendChild(mic);
    box.appendChild(row);
    box.appendChild(assignBtn);
    const hint = document.createElement("div"); hint.className="hint";
    hint.textContent = t("assignHint");
    box.appendChild(hint);
  } else {
    const changeBtn = document.createElement("button"); changeBtn.className="link-btn"; changeBtn.textContent=t("resetClass");
    changeBtn.style.marginBottom="10px";
    changeBtn.addEventListener("click",()=>{ node.class="neutral"; node.params={ bemerkung: node.params.bemerkung || {de:"",en:""} }; markDirty(); renderInspector(); renderAll(); });
    box.appendChild(changeBtn);
    box.appendChild(document.createElement("div")).className="divider";
    cls.fields.forEach(f=>{
      node.params[f.key] = node.params[f.key] || {de:"",en:""};
      box.appendChild(bilingualFieldRow(fieldLabel(f), node.params, f.key));

  // Beziehungen

  const relTitle = document.createElement("label"); relTitle.textContent=t("relationships"); relTitle.style.fontFamily="'IBM Plex Mono',monospace"; relTitle.style.fontSize="11px"; relTitle.style.color="var(--ink-soft)";
  box.appendChild(relTitle);
  const list = document.createElement("ul"); list.className="rel-list";
  const relatedEdges = state.edges.filter(e=>e.from===node.id||e.to===node.id);
  relatedEdges.forEach(e=>{
    const otherId = e.from===node.id ? e.to : e.from;

    const li = document.createElement("li"); li.style.flexDirection="column"; li.style.alignItems="stretch";
    const top = document.createElement("div"); top.style.display="flex"; top.style.justifyContent="space-between"; top.style.alignItems="center";

    const x = document.createElement("button"); x.className="small-x"; x.textContent="✕";
    x.addEventListener("click",()=>deleteEdge(e.id));
    top.appendChild(x);
    li.appendChild(top);
    // Rolle/Kontakt beziehen sich auf DIESE konkrete Beziehung, nicht auf das Objekt allgemein

    const li = document.createElement("li"); li.innerHTML=`<span style='color:var(--ink-soft)'>${t("noConnections")}</span>`;
    list.appendChild(li);
  }
  box.appendChild(list);
  const relHint = document.createElement("div"); relHint.className="hint";
  relHint.textContent = t("relationshipHint");
  box.appendChild(relHint);

  const div3 = document.createElement("div"); div3.className="divider"; box.appendChild(div3);
  const delBtn = document.createElement("button"); delBtn.className="btn danger"; delBtn.textContent=t("deleteObject"); delBtn.style.width="100%";
  delBtn.addEventListener("click",()=>{ if(confirm(t("confirmDeleteObject"))) deleteObject(node); });
  box.appendChild(delBtn);

function edgeFieldRow(labelText, edge, key){
  const row = document.createElement("div"); row.className="field-row"; row.style.gap="4px";
  const input = document.createElement("input"); input.type="text"; input.placeholder=labelText;
  input.style.fontSize="11px"; input.style.padding="5px 7px"; input.value = getBiValue(edge,key);
  input.addEventListener("input",()=>{ setBiValue(edge,key,input.value); markDirty(); });
  const mic = document.createElement("button"); mic.className="mic"; mic.style.width="24px"; mic.style.height="24px"; mic.style.fontSize="11px"; mic.textContent="🎤";
  attachMic(mic,(spokenText)=>{ input.value=spokenText; setBiValue(edge,key,spokenText); markDirty(); });
  row.appendChild(input); row.appendChild(mic);
  return row;
}
function bilingualFieldRow(labelText, obj, key){
  const wrap = document.createElement("div"); wrap.className="field";
  const label = document.createElement("label"); label.textContent = labelText+" · "+lang.toUpperCase();
  const row = document.createElement("div"); row.className="field-row";
  const input = document.createElement("input"); input.type="text"; input.value = getBiValue(obj,key);
  input.addEventListener("input",()=>{ setBiValue(obj,key,input.value); markDirty(); });
  row.appendChild(input);
  const mic = document.createElement("button"); mic.className="mic"; mic.textContent="🎤";
  attachMic(mic,(spokenText)=>{ input.value=spokenText; setBiValue(obj,key,spokenText); markDirty(); });
  row.appendChild(mic);
  wrap.appendChild(label); wrap.appendChild(row);
  return wrap;
}
function fieldRow(labelText, value, onChange, withMic){
  const wrap = document.createElement("div"); wrap.className="field";
  const label = document.createElement("label"); label.textContent = labelText;
  const row = document.createElement("div"); row.className="field-row";
  const input = document.createElement("input"); input.type="text"; input.value=value||"";
  input.addEventListener("input",()=>{ onChange(input.value); markDirty(); });
  row.appendChild(input);
  if(withMic){
    const mic = document.createElement("button"); mic.className="mic"; mic.textContent="🎤";
    attachMic(mic,(spokenText)=>{ input.value=spokenText; onChange(spokenText); markDirty(); });
    row.appendChild(mic);
  }
  wrap.appendChild(label); wrap.appendChild(row);
  return wrap;
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")||"modell"; }

// Zugriffsschicht: Speichern/Öffnen läuft vorerst ausschließlich über die
// lokale Ablage im Gerät/Browser (keine Cloud-Anbindung mehr aktiv).
async function storageSet(key, value){
  localStorage.setItem(key, value);
  return {key, value, shared:false};
}
async function storageGet(key){
  const v = localStorage.getItem(key);
  if(v!==null) return {key, value:v, shared:false};
  throw new Error(key);
}
async function storageList(prefix){
  const keys = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(prefix)===0) keys.push(k);
  }
  return { keys };
}

async function saveCurrentModel(name){
  const id = state.modelId || (slug(name)+"-"+Date.now());
  const payload = { name, nodes: state.nodes, edges: state.edges, savedAt: Date.now() };
  try{
    await storageSet("model:"+id, JSON.stringify(payload));
    state.modelId = id; state.modelName = name; state.dirty = false;
    document.getElementById("modelNameLabel").textContent = name;
    toast(t("savedLocally"));
  }catch(err){
    toast(t("saveFailed")+(err && err.message ? err.message : "?")+t("saveFailedHint"));
    console.error("Speichern fehlgeschlagen:", err);
  }
}
async function listSavedModels(){
  try{
    const res = await storageList("model:");
    if(!res || !res.keys) return [];
    const items = [];
    for(const k of res.keys){
      try{
        const r = await storageGet(k);
        if(r){ const data = JSON.parse(r.value); items.push({key:k, name:data.name, savedAt:data.savedAt, count:(data.nodes||[]).length}); }
      }catch(e){}
    }
    items.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
    return items;
  }catch(err){ console.error(err); return []; }
}
async function loadModel(key){
  try{
    const r = await storageGet(key);
    if(!r) return;
    const data = JSON.parse(r.value);
    state = { modelId:key.replace("model:",""), modelName:data.name, nodes:data.nodes, edges:data.edges, dirty:false };
    state.nodes.forEach(n=>{ n.pos2d = n.pos2d||{x:0,y:0}; n.pos3d = n.pos3d||{x:0,y:0,z:0}; n.group = n.group||"A"; n.params = n.params||{}; });
    state.edges.forEach(e=>{ if(e.rolle===undefined) e.rolle={de:"",en:""}; if(e.kontakt===undefined) e.kontakt={de:"",en:""}; });
    selectedNodeId=null; focusNodeId=null; selectedEdgeId=null; expandedNodes = new Set();
    layout2D(); layout3D();
    document.getElementById("modelNameLabel").textContent = data.name;
    renderInspector(); renderAll();
    toast(t("modelLoaded")+data.name);
  }catch(err){ toast(t("loadFailed")+(err && err.message ? err.message : "?")); console.error(err); }
}
function remapAndImport(data, sameGroup){
  const idMap = {};
  const newGroup = sameGroup ? (state.nodes[0]?state.nodes[0].group:"A") : uid("grp");
  let mergedCount = 0;
  data.nodes.forEach(n=>{
    let targetNode = null;
    if(sameGroup){
      // Objekte mit gleichem Namen UND gleicher Klasse gelten als dasselbe Objekt
      targetNode = state.nodes.find(existing=>
        existing.class===n.class && existing.name.trim().toLowerCase()===n.name.trim().toLowerCase()
      );
    }
    if(targetNode){
      idMap[n.id] = targetNode.id;
      const cls = CLASSES[targetNode.class];
      const fieldKeys = new Set([...(cls && cls.fields ? cls.fields.map(f=>f.key) : []), ...Object.keys(n.params||{}), "bemerkung"]);
      const conflictNotes = [];
      fieldKeys.forEach(key=>{
        if(key==="bemerkung") return; // wird separat zusammengeführt
        const incoming = (n.params||{})[key];
        const incomingVal = incoming ? (incoming.de || incoming.en || "") : "";
        if(!incomingVal) return;
        targetNode.params[key] = targetNode.params[key] || {de:"",en:""};
        const existingVal = targetNode.params[key].de || targetNode.params[key].en || "";
        if(!existingVal){
          targetNode.params[key] = { de: incoming.de || incomingVal, en: incoming.en || incomingVal };
        } else if(existingVal.trim() !== incomingVal.trim()){
          const fdef = cls && cls.fields ? cls.fields.find(f=>f.key===key) : null;
          const label = fdef ? fdef.label : key;
          conflictNotes.push(`${label}: "${incomingVal}" (übernommen wurde "${existingVal}")`);
        }
      });
      // Bemerkungen beider Objekte sowie ggf. Konflikthinweise zusammenführen
      const incomingRemark = (n.params||{}).bemerkung ? ((n.params.bemerkung.de || n.params.bemerkung.en || "")) : "";
      targetNode.params.bemerkung = targetNode.params.bemerkung || {de:"",en:""};
      const existingRemark = targetNode.params.bemerkung.de || targetNode.params.bemerkung.en || "";
      const pieces = [existingRemark];
      if(incomingRemark && incomingRemark.trim() !== existingRemark.trim()) pieces.push(incomingRemark);
      if(conflictNotes.length) pieces.push(t("mergeConflictNote").replace("{model}", data.name||"") + " " + conflictNotes.join("; "));
      const combined = pieces.filter(Boolean).join(" | ");
      targetNode.params.bemerkung = { de: combined, en: combined };
      mergedCount++;
    } else {
      const newId = uid("obj");
      idMap[n.id]=newId;
      const paramsCopy = JSON.parse(JSON.stringify(n.params||{}));
      paramsCopy.bemerkung = paramsCopy.bemerkung || {de:"",en:""};
      state.nodes.push(Object.assign({},n,{id:newId, group:newGroup, params: paramsCopy,
        pos2d:{x:n.pos2d.x+300,y:n.pos2d.y}, pos3d:{x:n.pos3d.x+300,y:n.pos3d.y,z:n.pos3d.z}, pinned2d:false, pinned3d:false}));
    }
  });
  data.edges.forEach(e=>{
    if(idMap[e.from] && idMap[e.to]){
      const incomingRolle = (e.rolle && e.rolle.de) || "";
      const alreadyExists = state.edges.some(ex=> ex.from===idMap[e.from] && ex.to===idMap[e.to] && ((ex.rolle&&ex.rolle.de)||"")===incomingRolle );
      if(!alreadyExists) state.edges.push({id:uid("edge"), from:idMap[e.from], to:idMap[e.to], rolle:e.rolle||{de:"",en:""}, kontakt:e.kontakt||{de:"",en:""}});
    }
  });
  layout2D(); layout3D(); markDirty(); renderAll();
  if(sameGroup && mergedCount>0){
    setTimeout(()=>toast(t("mergedObjectsCount").replace("{n}", mergedCount)), 1600);
  }
}

/* --- Als Datei sichern (Download) / aus Datei öffnen (Upload) --- */
function normalizeLoadedModel(data){
  data.nodes = data.nodes||[];
  data.edges = data.edges||[];
  data.nodes.forEach(n=>{
    n.pos2d = n.pos2d||{x:0,y:0}; n.pos3d = n.pos3d||{x:0,y:0,z:0};
    n.group = n.group||"A"; n.pinned2d=false; n.pinned3d=false;
    n.params = n.params||{}; n.class = CLASSES[n.class] ? n.class : "neutral";
  });
  data.edges.forEach(e=>{ if(e.rolle===undefined) e.rolle={de:"",en:""}; if(e.kontakt===undefined) e.kontakt={de:"",en:""}; });
  return data;
}
function exportModelToFile(){
  const payload = { format:"objekt-beziehungsmodell-v1", name: state.modelName, nodes: state.nodes, edges: state.edges, exportedAt: Date.now() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = slug(state.modelName)+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  state.dirty = false;
  toast(t("fileDownloading")+a.download);
}
function downloadJsonFile(json, filename){
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
async function shareModelFile(){
  const payload = { format:"objekt-beziehungsmodell-v1", name: state.modelName, nodes: state.nodes, edges: state.edges, exportedAt: Date.now() };
  const json = JSON.stringify(payload, null, 2);
  const filename = slug(state.modelName)+".json";
  let file = null;
  try{ file = new File([json], filename, {type:"application/json"}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({ files:[file], title: state.modelName, text: t("shareText")+state.modelName });
      return;
    }catch(err){
      if(err && err.name==="AbortError"){ toast(t("shareCancelled")); return; }
      // Bei sonstigem Fehler auf die Icon-Auswahl unten ausweichen
    }
  }
  openShareSheet(json, filename);
}
function openShareSheet(json, filename){
  const items = [
    { icon:"📧", label:t("shareEmail"), action:"email" },
    { icon:"💬", label:"WhatsApp", action:"whatsapp" },
    { icon:"📋", label:t("shareCopy"), action:"copy" },
    { icon:"⬇️", label:t("shareDownload"), action:"download" },
  ];
  const itemsHtml = items.map(it=>`<button class="share-item" data-action="${it.action}"><span class="share-icon">${it.icon}</span><span class="share-label">${it.label}</span></button>`).join("");
  openModal(`<h3>${t("shareTitle")}</h3><p class="hint">${t("shareHint")}</p><div class="share-grid">${itemsHtml}</div><p class="hint" style="font-size:11px;opacity:.75;">${t("shareAttachNotice")}</p><div class="modal-actions"><button class="btn" id="closeM">${t("close")}</button></div>`);
  document.getElementById("closeM").onclick = closeModal;
  document.querySelectorAll(".share-item").forEach(btn=>{

        setTimeout(()=>{ window.location.href = `mailto:?subject=${subject}&body=${body}`; }, 900);
      } else if(action==="whatsapp"){

function importModelFromFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const raw = JSON.parse(reader.result);
      if(!raw || !Array.isArray(raw.nodes) || !Array.isArray(raw.edges)) throw new Error("invalid format");
      const data = normalizeLoadedModel(raw);
      state = { modelId:null, modelName: data.name || file.name.replace(/\.json$/i,""), nodes:data.nodes, edges:data.edges, dirty:false };
      selectedNodeId=null; focusNodeId=null; selectedEdgeId=null; expandedNodes = new Set();
      layout2D(); layout3D();
      document.getElementById("modelNameLabel").textContent = state.modelName;
      renderInspector(); renderAll();
      toast(t("modelLoadedFromFile")+state.modelName);
    }catch(err){
      toast(t("fileInvalidFormat"));
      console.error(err);
    }
  };
  reader.onerror = ()=>toast(t("fileReadError"));
  reader.readAsText(file);
}

/* ---------------------------------------------------------------
   14b. ZWEI-FINGER-PINCH (ZOOM PER TOUCH)
--------------------------------------------------------------- */
const canvasWrapEl = document.getElementById("canvasWrap");
const activeTouches = new Map();
let pinchPrevDist = null, pinchPrevMid = null;
function touchPt(ev){ return {x:ev.clientX, y:ev.clientY}; }
function touchDist(){ const p=[...activeTouches.values()]; return Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y); }
function touchMid(){ const p=[...activeTouches.values()]; return {x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2}; }
canvasWrapEl.addEventListener("pointerdown",(ev)=>{
  if(ev.pointerType!=="touch") return;
  activeTouches.set(ev.pointerId, touchPt(ev));
  if(activeTouches.size===2){
    // Laufende Einzelfinger-Aktionen (Verschieben/Verbinden) abbrechen, Pinch übernimmt
    dragNode2D=null; panning=false;
    if(tempLineSrc){ tempLineEl && tempLineEl.remove(); tempLineSrc=null; tempLineEl=null; }
    dragging3D=null; panningView3D=false;
    pinchPrevDist = touchDist(); pinchPrevMid = touchMid();
  }
},true);
canvasWrapEl.addEventListener("pointermove",(ev)=>{
  if(ev.pointerType!=="touch" || !activeTouches.has(ev.pointerId)) return;
  activeTouches.set(ev.pointerId, touchPt(ev));
  if(activeTouches.size===2 && pinchPrevDist){
    ev.preventDefault();
    const dist = touchDist(), mid = touchMid();
    const scaleFactor = dist/pinchPrevDist;
    if(view3D){
      camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, camDist/scaleFactor));
    } else {
      const worldX = (pinchPrevMid.x-panX)/zoom, worldY = (pinchPrevMid.y-panY)/zoom;
      zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom*scaleFactor));
      panX = mid.x - worldX*zoom; panY = mid.y - worldY*zoom;
      svgSetTransform();
    }
    pinchPrevDist = dist; pinchPrevMid = mid;
  }
},{capture:true, passive:false});
function endTouch(ev){
  activeTouches.delete(ev.pointerId);
  if(activeTouches.size<2){ pinchPrevDist=null; pinchPrevMid=null; }
}
canvasWrapEl.addEventListener("pointerup", endTouch, true);
canvasWrapEl.addEventListener("pointercancel", endTouch, true);

function searchModel(queryRaw){
  const q = normalizeText(queryRaw);
  if(!q) return [];
  const resultsMap = new Map();
  const addResult = (node, snippet)=>{ if(!resultsMap.has(node.id)) resultsMap.set(node.id, {node, snippet}); };
  state.nodes.forEach(node=>{
    const cls = CLASSES[node.class];
    if(node.name && normalizeText(node.name).includes(q)){ addResult(node, node.name); return; }
    if(cls.label && normalizeText(cls.label).includes(q)){ addResult(node, cls.label); return; }
    if(cls.labelEn && normalizeText(cls.labelEn).includes(q)){ addResult(node, cls.labelEn); return; }
    if(node.params){
      for(const val of Object.values(node.params)){
        if(val && typeof val==="object"){
          if(val.de && normalizeText(val.de).includes(q)){ addResult(node, val.de); return; }
          if(val.en && normalizeText(val.en).includes(q)){ addResult(node, val.en); return; }
        }
      }
    }
  });
  state.edges.forEach(e=>{
    [e.rolle, e.kontakt].forEach(field=>{
      if(field && typeof field==="object"){
        const hit = (field.de && normalizeText(field.de).includes(q)) || (field.en && normalizeText(field.en).includes(q));
        if(hit){
          const a = state.nodes.find(n=>n.id===e.from), b = state.nodes.find(n=>n.id===e.to);
          const snippet = field.de || field.en;
          if(a) addResult(a, snippet);
          if(b) addResult(b, snippet);
        }
      }
    });
  });
  return [...resultsMap.values()];
}
function centerNode2D(node){
  const {cx,cy} = centerOf();
  panX = cx - node.pos2d.x*zoom;
  panY = cy - node.pos2d.y*zoom;
  render2D();
}
function centerNode3D(node){
  if(!three.initialized) return;
  const p = new THREE.Vector3(node.pos3d.x, node.pos3d.y, node.pos3d.z).applyEuler(three.group.rotation);
  three.group.position.set(-p.x, -p.y, -p.z);
}
function focusAndCenterNode(node){
  pulseNodeId = node.id;
  selectNode(node.id);
  setInspectorCollapsed(false);
  if(view3D){ centerNode3D(node); rebuild3DObjects(); }
  else { centerNode2D(node); }
  setTimeout(()=>{ pulseNodeId=null; }, 2300);
}
function positionSearchResults(){
  const input = document.getElementById("searchInput");
  const r = input.getBoundingClientRect();
  const panel = document.getElementById("searchResults");
  const spaceBelow = window.innerHeight - r.bottom;
  const spaceAbove = r.top;
  if(spaceBelow < 200 && spaceAbove > spaceBelow){
    panel.style.top = "auto";
    panel.style.bottom = (window.innerHeight - r.top + 6)+"px";
  } else {
    panel.style.bottom = "auto";
    panel.style.top = (r.bottom+6)+"px";
  }
  panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth-240))+"px";
  panel.style.width = Math.max(220, r.width)+"px";
}
function renderSearchResults(query){
  const panel = document.getElementById("searchResults");
  if(!query || !query.trim()){ panel.classList.remove("open"); panel.innerHTML=""; return; }
  const results = searchModel(query);
  if(!results.length){
    panel.innerHTML = `<div class="sr-empty">${t("searchNoResults")}</div>`;
  } else {
    panel.innerHTML = results.slice(0,30).map(r=>{
      const cls = CLASSES[r.node.class];
      const snippetShown = (r.snippet && r.snippet!==r.node.name) ? r.snippet : classLabel(r.node.class);
      return `<div class="sr-item" data-id="${r.node.id}">
        <span class="sr-icon">${cls.icon}</span>
        <div class="sr-main"><span class="sr-name">${r.node.name||t("noNameLabel")}</span><span class="sr-meta">${snippetShown}</span></div>
      </div>`;
    }).join("");
  }
  positionSearchResults();
  panel.classList.add("open");
  panel.querySelectorAll(".sr-item").forEach(item=>{
    item.addEventListener("click",()=>{
      const node = state.nodes.find(n=>n.id===item.getAttribute("data-id"));
      if(node) focusAndCenterNode(node);
      panel.classList.remove("open");
    });
  });
}
document.getElementById("searchInput").addEventListener("input",(ev)=>renderSearchResults(ev.target.value));
document.getElementById("searchInput").addEventListener("focus",(ev)=>{ if(ev.target.value.trim()) renderSearchResults(ev.target.value); });
document.addEventListener("click",(ev)=>{
  const panel = document.getElementById("searchResults");
  if(panel.classList.contains("open") && !panel.contains(ev.target) && ev.target.id!=="searchInput" && ev.target.id!=="searchMic"){
    panel.classList.remove("open");
  }
});
window.addEventListener("resize",()=>{ if(document.getElementById("searchResults").classList.contains("open")) positionSearchResults(); });
document.getElementById("searchMic").addEventListener("click",()=>{
  if(!SpeechRec){ toast(t("micUnavailable")); return; }
  const micBtn = document.getElementById("searchMic");
  startRecognition(micBtn, (text)=>{
    document.getElementById("searchInput").value = text;
    renderSearchResults(text);
  });
});

/* ---------------------------------------------------------------
   15. RENDER ALL
--------------------------------------------------------------- */
function renderAll(){
  render2D();
  if(view3D) rebuild3DObjects();
  updateDeleteEdgeBtn();
}

/* ---------------------------------------------------------------
   16. START
--------------------------------------------------------------- */
applyStaticTranslations();
renderLegend();
newModel();
renderInspector();
if(window.innerWidth < 700){ setInspectorCollapsed(true); }
})();
</script>
