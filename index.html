/* ---------------------------------------------------------------
   MODELL REPORT — druckbarer Bericht: aktuelle Ansicht als Bild
   (berücksichtigt Filter/Fokus sowie Karten-/Globusmodus), gefolgt
   von Beziehungs- und Objekt-Spezifikationstabellen.
--------------------------------------------------------------- */
function describeCurrentViewMode(){
  const parts = [];
  parts.push(geoMode ? (view3D ? t("reportModeGlobe") : t("reportModeMap")) : (view3D ? t("reportMode3D") : t("reportMode2D")));
  const hopTxt = HOP_STEPS[hopIdx]===Infinity ? t("all") : String(HOP_STEPS[hopIdx]);
  parts.push(t("reportModeLevels").replace("{n}", hopTxt));
  if(focusNodeId){
    const fn = state.nodes.find(n=>n.id===focusNodeId);
    if(fn) parts.push(t("reportModeFocus").replace("{name}", fn.name));
  }
  return parts.join(" · ");
}
function captureSvgImage(){
  const svg = document.getElementById("graph2d");
  const rect = svg.getBoundingClientRect();
  const clone = svg.cloneNode(true);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  clone.setAttribute("width", Math.round(rect.width));
  clone.setAttribute("height", Math.round(rect.height));
  clone.setAttribute("style", "background:#ffffff;display:block;");
  // Report-Darstellung: weißer Hintergrund, schwarze Objektbeschriftungen, blaue Beziehungslinien.
  // Direkte Attribut-Überschreibung statt CSS-Klassen, da die externen Stylesheets der Live-Ansicht
  // beim Einbetten in das eigenständige Report-Dokument nicht mitkommen.
  clone.querySelectorAll(".node-label").forEach(el=> el.setAttribute("fill", "#000000"));
  clone.querySelectorAll(".edge-line").forEach(el=>{ el.setAttribute("stroke", "#0071e3"); el.removeAttribute("style"); });
  clone.querySelectorAll(".connect-handle, .expand-badge, .nav-badge, .temp-edge").forEach(el=> el.remove());
  const arrowPath = clone.querySelector("marker#arrow path");
  if(arrowPath) arrowPath.setAttribute("fill", "#0071e3");
  return `<div class="report-svg-wrap">${clone.outerHTML}</div>`;
}
function captureThreeJsImage(){
  if(!three.renderer) return `<p class="report-hint">${t("reportImageFailed")}</p>`;
  try{
    rebuild3DObjects(true); // kurzzeitig mit dunklen Beschriftungen für den Report neu aufbauen
    three.renderer.render(three.scene, three.camera);
    const dataUrl = three.renderer.domElement.toDataURL("image/png");
    rebuild3DObjects(false); // Live-Ansicht (helle Beschriftungen) wiederherstellen
    three.renderer.render(three.scene, three.camera);
    return `<img class="report-img" src="${dataUrl}" alt="">`;
  }catch(e){ return `<p class="report-hint">${t("reportImageFailed")}</p>`; }
}
async function captureGeoMapImage(){
  if(typeof html2canvas === "undefined" || !leafletMap){ return `<p class="report-hint">${t("reportImageFailed")}</p>`; }
  try{
    const canvas = await html2canvas(document.getElementById("geoMap2D"), {useCORS:true, allowTaint:true, logging:false});
    return `<img class="report-img" src="${canvas.toDataURL("image/png")}" alt="">`;
  }catch(e){ return `<p class="report-hint">${t("reportImageFailed")}</p>`; }
}
async function generateModelReport(){
  toast(t("reportGenerating"));
  const vis = visibleSet();
  const visibleNodes = state.nodes.filter(n=>vis.nodes.has(n.id));
  const visibleEdges = state.edges.filter(e=>vis.edges.has(e.id));

  let imageHtml;
  if(geoMode && !view3D) imageHtml = await captureGeoMapImage();
  else if(view3D) imageHtml = captureThreeJsImage();
  else imageHtml = captureSvgImage();

  // Für jedes Objekt mit gültigen GPS-Koordinaten vorab einen kleinen Kartenausschnitt erzeugen
  // (parallel, damit es bei mehreren Objekten nicht zu lange dauert)
  const geoEntries = visibleNodes.map(n=>({ n, ll: nodeLatLon(n) })).filter(e=>e.ll);
  if(geoEntries.length) toast(t("reportGeneratingMaps"));
  const geoImages = await Promise.all(geoEntries.map(e=> captureMiniMapImage(e.ll.lat, e.ll.lon)));
  const geoImageMap = {};
  geoEntries.forEach((e,i)=>{ geoImageMap[e.n.id] = geoImages[i]; });

  const relRows = visibleEdges.map(e=>{
    const a = state.nodes.find(n=>n.id===e.from), b = state.nodes.find(n=>n.id===e.to);
    if(!a||!b) return "";
    const rolle = e.rolle ? (e.rolle[lang]||e.rolle.de||"") : "";
    const kontakt = e.kontakt ? (e.kontakt[lang]||e.kontakt.de||"") : "";
    return `<tr><td>${escapeHtml(a.name)}</td><td>${escapeHtml(rolle)}</td><td>${escapeHtml(b.name)}</td><td>${escapeHtml(kontakt)}</td></tr>`;
  }).filter(Boolean).join("");

  const objRows = visibleNodes.map(n=>{
    const cls = CLASSES[n.class];
    const clsLabel = cls ? (lang==="en" && cls.labelEn ? cls.labelEn : cls.label) : n.class;
    const fieldsTxt = Object.entries(n.params||{}).map(([k,v])=>{
      let label = k;
      if(k==="bemerkung") label = t("remarkFieldLabel");
      else if(cls && cls.fields){ const fdef = cls.fields.find(f=>f.key===k); if(fdef) label = fieldLabel(fdef); }
      const val = v ? (v[lang]||v.de||"") : "";
      return val ? `<b>${escapeHtml(label)}:</b> ${escapeHtml(val)}` : null;
    }).filter(Boolean).join("<br>");
    const ll = nodeLatLon(n);
    const mapImg = geoImageMap[n.id];
    const geoTxt = ll
      ? `${escapeHtml(String(ll.lat))}, ${escapeHtml(String(ll.lon))}` + (mapImg ? `<br><img class="report-geo-map" src="${mapImg}" alt="">` : "")
      : "–";
    const createdTxt = n.createdAt ? formatDateTimeForDisplay(n.createdAt) : "–";
    const imagesTxt = Array.isArray(n.images) && n.images.length
      ? n.images.map(src=>`<img class="report-obj-img" src="${src}" alt="">`).join("")
      : "–";
    return `<tr><td>${escapeHtml(n.name)}</td><td>${escapeHtml(clsLabel)}</td><td>${fieldsTxt||"–"}</td><td>${geoTxt}</td><td>${escapeHtml(createdTxt)}</td><td>${imagesTxt}</td></tr>`;
  }).join("");

  const dateStr = new Date().toLocaleString(lang==="en"?"en-US":"de-DE");
  const html = `<!DOCTYPE html><html lang="${lang}"><head><meta charset="UTF-8">
<title>${escapeHtml(t("reportTitle"))} — ${escapeHtml(state.modelName)}</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;color:#1d1d1f;max-width:1000px;margin:0 auto;padding:32px 24px 60px;}
  h1{font-size:24px;margin:0 0 4px;}
  h2{font-size:17px;margin:36px 0 12px;border-bottom:2px solid #0071e3;padding-bottom:6px;}
  .report-meta{color:#6e6e73;font-size:13px;margin:0 0 8px;}
  .report-toolbar{position:sticky;top:0;background:#fff;padding:10px 0;margin-bottom:10px;}
  .report-toolbar button{background:#0071e3;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;}
  .report-svg-wrap{background:#ffffff;border:0.35mm solid #000000;border-radius:0;padding:10px;text-align:center;box-sizing:border-box;}
  .report-svg-wrap svg{max-width:100%;height:auto;}
  .report-img{max-width:100%;border:0.35mm solid #000000;box-sizing:border-box;}
  .report-hint{color:#999;font-style:italic;}
  .report-obj-img{width:120px;height:120px;object-fit:cover;border-radius:6px;border:0.35mm solid #000000;margin:2px 4px 2px 0;}
  .report-geo-map{width:110px;height:110px;object-fit:cover;border-radius:6px;border:0.35mm solid #000000;margin-top:4px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #e5e5e5;vertical-align:top;}
  th{background:#f5f5f7;font-weight:700;}
  tr:nth-child(even){background:#fafafa;}
  @media print{
    .no-print{display:none !important;}
    body{padding:0;max-width:none;}
    h2{break-after:avoid;}
    tr{break-inside:avoid;}
  }
</style>
</head><body>
<div class="no-print report-toolbar"><button onclick="window.print()">🖨️ ${escapeHtml(t("reportPrintBtn"))}</button></div>
<h1>${escapeHtml(state.modelName)}</h1>
<p class="report-meta">${escapeHtml(t("reportGeneratedOn"))}: ${escapeHtml(dateStr)}<br>${escapeHtml(describeCurrentViewMode())}</p>

<h2>${escapeHtml(t("reportSectionImage"))}</h2>
${imageHtml}

<h2>${escapeHtml(t("reportSectionRelationships"))} (${visibleEdges.length})</h2>
<table><thead><tr><th>${escapeHtml(t("reportColFrom"))}</th><th>${escapeHtml(t("reportColRole"))}</th><th>${escapeHtml(t("reportColTo"))}</th><th>${escapeHtml(t("reportColComment"))}</th></tr></thead>
<tbody>${relRows || `<tr><td colspan="4">${escapeHtml(t("reportNoData"))}</td></tr>`}</tbody></table>

<h2>${escapeHtml(t("reportSectionObjects"))} (${visibleNodes.length})</h2>
<table><thead><tr><th>${escapeHtml(t("reportColName"))}</th><th>${escapeHtml(t("reportColClass"))}</th><th>${escapeHtml(t("reportColSpecs"))}</th><th>${escapeHtml(t("reportColGeo"))}</th><th>${escapeHtml(t("reportColCreated"))}</th><th>${escapeHtml(t("reportColImages"))}</th></tr></thead>
<tbody>${objRows || `<tr><td colspan="6">${escapeHtml(t("reportNoData"))}</td></tr>`}</tbody></table>

</body></html>`;

  const blob = new Blob([html], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const win = window.open(url, "_blank");
  if(!win){ toast(t("reportPopupBlocked")); }
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}
document.getElementById("btnModelReport").addEventListener("click", generateModelReport);

--------------------------------------------------------------- */
// Versucht, das zuletzt aktive (gespeicherte oder geöffnete) Modell automatisch zu laden.
// Existiert kein solcher Verweis mehr (z. B. erster Start, oder das referenzierte Modell wurde
// inzwischen gelöscht), wird wie bisher mit einem neuen, leeren Modell gestartet.
async function startupLoad(){
  try{ await migrateLocalStorageToIdb(); }catch(e){ console.error(e); }
  try{
    const last = await storageGet(LAST_MODEL_KEY);
    await storageGet(last.value); // wirft, falls das referenzierte Modell nicht mehr existiert
    await loadModel(last.value);
    return;
  }catch(e){ /* kein zuletzt aktives Modell vorhanden -> normal mit leerem Modell starten */ }
  newModel();
  renderInspector();
}
applyStaticTranslations();
renderLegend();
startupLoad();
if(window.innerWidth < 700){ setInspectorCollapsed(true); }
})();
</script>
