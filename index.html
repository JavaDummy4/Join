<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objekt-Beziehungsmodell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<!-- d3-force-3d (Kräfte-Layout für 2D und 3D) samt Abhängigkeiten; Reihenfolge ist wichtig.
     Fehlt die Bibliothek (offline), nutzt Join automatisch die eingebaute Layout-Berechnung. -->
<script src="https://cdn.jsdelivr.net/npm/d3-dispatch@3/dist/d3-dispatch.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-quadtree@3/dist/d3-quadtree.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-timer@3/dist/d3-timer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-binarytree@1/dist/d3-binarytree.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-octree@1/dist/d3-octree.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-force-3d@3/dist/d3-force-3d.min.js"></script>
<style>
  :root{
    --canvas-bg:#12161c;
    --canvas-grid:#1c222b;
    --panel-bg:#eceef2;
    --panel-bg-2:#dde1e8;
    --ink:#1a2028;
    --ink-soft:#5a6472;
    --line:#c7cdd7;
    --accent:#3fa9a0;
    --accent-dark:#2c7d76;
    --warn:#e8963c;
    --danger:#d1495b;
    --edge:#5b93c9;
    --node-neutral:#8a8f98;
    --white:#f6f7f9;
    font-family:'Space Grotesk',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--canvas-bg);color:var(--ink);overflow:hidden;}
  body{display:flex;flex-direction:column;}
  #app{display:flex;flex-direction:column;height:100vh;width:100vw;}

  /* Toolbar — Apple-Design */
  #toolbar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:#f5f5f7;border-bottom:1px solid rgba(0,0,0,.08);
    padding:10px 14px;z-index:5;
  }
  #toolbar .grp{display:flex;align-items:center;gap:8px;padding:0 10px;border-right:1px solid rgba(0,0,0,.08);}
  #toolbar .grp:last-child{border-right:none;}
  #bottomBar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
    background:#f5f5f7;border-top:1px solid rgba(0,0,0,.08);
    padding:8px 14px;z-index:5;
  }
  #bottomBar .grp{display:flex;align-items:center;gap:8px;padding:0 10px;border-right:1px solid rgba(0,0,0,.08);}
  #bottomBar .grp:last-child{border-right:none;}
  .modelname{font-weight:600;font-size:14px;padding:0 10px 0 2px;color:#1d1d1f;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;}
  button.btn{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    font-size:13px;font-weight:600;letter-spacing:-.1px;
    background:#ffffff;border:1px solid rgba(0,0,0,.1);color:#1d1d1f;
    padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    transition:background .15s ease, box-shadow .15s ease, transform .05s ease, border-color .15s ease;
  }
  button.btn:hover{background:#f5f5f7;border-color:rgba(0,0,0,.14);box-shadow:0 2px 6px rgba(0,0,0,.07);}
  button.btn:active{transform:scale(.96);box-shadow:0 1px 1px rgba(0,0,0,.05);}
  button.btn.primary{background:#0071e3;border-color:#0071e3;color:#fff;box-shadow:0 1px 3px rgba(0,113,227,.35);}
  button.btn.primary:hover{background:#0077ed;border-color:#0077ed;box-shadow:0 3px 8px rgba(0,113,227,.4);}
  button.btn.danger{background:#ff3b30;border-color:#ff3b30;color:#fff;box-shadow:0 1px 3px rgba(255,59,48,.35);}
  button.btn.danger:hover{background:#ff443a;box-shadow:0 3px 8px rgba(255,59,48,.4);}
  button.btn.toggle-on{background:#ff9500;border-color:#ff9500;color:#fff;box-shadow:0 1px 3px rgba(255,149,0,.35);}
  button.btn.toggle-on:hover{background:#ffa421;}
  button.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
  button.btn:disabled:hover{background:#ffffff;border-color:rgba(0,0,0,.1);box-shadow:none;}
  .segmented{display:flex;align-items:center;background:#e8e8ed;border-radius:8px;padding:2px;gap:2px;}
  .segmented button{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    font-size:13px;font-weight:600;color:#6e6e73;background:transparent;border:none;
    padding:6px 16px;border-radius:6px;cursor:pointer;transition:background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .segmented button:hover{color:#1d1d1f;}
  .segmented button.active{background:#ffffff;color:#0071e3;box-shadow:0 1px 3px rgba(0,0,0,.15);}

  .geo-switch{display:flex;align-items:center;gap:6px;margin-left:8px;cursor:pointer;user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600;color:#6e6e73;}
  .geo-switch-track{width:38px;height:22px;border-radius:11px;background:#d8d8dc;position:relative;transition:background .15s ease;flex:none;}
  .geo-switch-track.on{background:#34c759;}
  .geo-switch-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s ease;}
  .geo-switch-track.on .geo-switch-knob{left:18px;}
  .geo-switch.on #geoSwitchLabel{color:#1d1d1f;}

  #geoMap2D{position:absolute;inset:0;display:none;z-index:1;background:#dbe4ea;}
  #geoMap2D.active{display:block;}
  .geo-node-label{background:transparent;border:none;box-shadow:none;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;color:#1d1d1f;
    text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;white-space:nowrap;}
  #geoStagingBar{
    position:absolute;left:0;right:0;bottom:0;z-index:2;display:none;
    background:rgba(255,255,255,.92);border-top:1px solid rgba(0,0,0,.1);
    padding:8px 12px;gap:8px;overflow-x:auto;align-items:center;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  }
  #geoStagingBar.active{display:flex;}
  #geoStagingBar .geo-staging-label{font-size:11px;color:#6e6e73;flex:none;white-space:nowrap;}
  .geo-chip{
    flex:none;display:flex;align-items:center;gap:5px;background:#f5f5f7;border:1px solid rgba(0,0,0,.08);
    border-radius:16px;padding:5px 12px;font-size:12px;font-weight:600;color:#1d1d1f;cursor:pointer;white-space:nowrap;
  }
  .geo-chip:hover{background:#e8e8ed;}

  .image-gallery{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .image-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--panel-bg-2);border:1px solid var(--line);flex:none;}
  .image-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block;}
  .image-thumb-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:13px;line-height:1;cursor:pointer;padding:0;}
  .image-thumb-del:hover{background:#d1495b;}
  .image-add-btn{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink-soft);background:var(--panel-bg-2);border:1px dashed var(--line);cursor:pointer;}
  .image-add-btn:hover{background:var(--panel-bg);color:var(--accent);}
  .lightbox-img-wrap{display:flex;align-items:center;gap:10px;justify-content:center;}
  .lightbox-img{max-width:70vw;max-height:65vh;border-radius:8px;}
  .lightbox-nav{background:none;border:none;font-size:32px;color:var(--ink-soft);cursor:pointer;padding:0 6px;}
  .lightbox-nav:hover{color:var(--accent);}
  button.mic{
    border:1px solid rgba(0,0,0,.1);background:#ffffff;border-radius:50%;
    width:30px;height:30px;flex:none;cursor:pointer;font-size:14px;line-height:1;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, box-shadow .15s ease;
  }
  button.mic:hover{background:#f5f5f7;}
  button.mic.listening{background:#ff3b30;color:#fff;border-color:#ff3b30;animation:pulse 1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.5);}70%{box-shadow:0 0 0 8px rgba(255,59,48,0);}100%{box-shadow:0 0 0 0 rgba(255,59,48,0);}}

  #hopWrap{display:flex;align-items:center;gap:8px;font-size:12px;color:#6e6e73;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;}
  #hopWrap input[type=range]{width:110px;accent-color:#0071e3;}
  #hopLabel{font-family:'IBM Plex Mono',monospace;min-width:34px;text-align:center;font-size:12px;background:#e8e8ed;border-radius:4px;padding:2px 4px;color:#1d1d1f;}
  button.lang-flag{opacity:.45;padding:6px 10px;}
  button.lang-flag.active{opacity:1;border-color:#0071e3;background:#fff;color:#0071e3;font-weight:700;}
  #searchGrp{gap:6px;}
  .dropdown{position:relative;}
  .dropdown-caret{font-size:10px;opacity:.6;margin-left:2px;}
  .dropdown-panel{
    display:none;flex-direction:column;gap:2px;position:fixed;
    background:#ffffff;border-radius:10px;border:1px solid rgba(0,0,0,.08);
    box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px;min-width:230px;max-width:calc(100vw - 16px);z-index:80;
  }
  .dropdown-panel.open{display:flex;}
  .dropdown-item{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    font-size:13px;font-weight:500;color:#1d1d1f;background:none;border:none;
    text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;
    display:flex;align-items:center;white-space:nowrap;width:100%;
    transition:background .1s ease;
  }
  .dropdown-item:hover{background:#f5f5f7;}
  .dropdown-item:disabled{opacity:.35;cursor:not-allowed;}
  .dropdown-item:disabled:hover{background:none;}
  .dropdown-item.toggle-on{background:#ff9500;color:#fff;}
  .dropdown-item.toggle-on:hover{background:#ffa421;}
  .dropdown-sep{height:1px;background:rgba(0,0,0,.08);margin:5px 4px;}

  #aiChatPanel{
    display:none;flex-direction:column;position:fixed;width:380px;max-width:calc(100vw - 16px);
    background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:14px;
    box-shadow:0 12px 34px rgba(0,0,0,.2);z-index:70;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  }
  #aiChatPanel.open{display:flex;}
  #aiChatHeader{
    display:flex;align-items:center;justify-content:space-between;padding:10px 12px;
    background:#f5f5f7;border-bottom:1px solid rgba(0,0,0,.08);font-weight:700;font-size:13px;color:#1d1d1f;
  }
  #aiChatCloseBtn{border:none;background:none;font-size:14px;color:#6e6e73;cursor:pointer;padding:2px 6px;border-radius:6px;}
  #aiChatCloseBtn:hover{background:#e8e8ed;}
  #aiChatMessages{flex:1;min-height:120px;max-height:44vh;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
  .ai-msg{padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.45;max-width:92%;word-wrap:break-word;white-space:pre-wrap;}
  .ai-msg-user{background:#0071e3;color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
  .ai-msg-assistant{background:#f5f5f7;color:#1d1d1f;align-self:flex-start;border-bottom-left-radius:3px;}
  .ai-ref{color:#0071e3;font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;}
  .ai-ref:hover{color:#004999;}
  .ai-typing{opacity:.55;font-style:italic;}
  .ai-error{color:#ff3b30;}
  #aiChatInputRow{display:flex;gap:6px;padding:8px 10px;border-top:1px solid rgba(0,0,0,.08);}
  #aiChatInputRow input{flex:1;padding:7px 10px;border-radius:8px;border:1px solid rgba(0,0,0,.14);font-size:12.5px;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;}
  #aiChatInputRow button{padding:7px 12px;min-width:36px;}
  #aiChatFooter{font-size:10.5px;text-align:right;padding:0 12px 8px;}
  #aiChatFooter a{color:#6e6e73;text-decoration:none;}
  #aiChatFooter a:hover{color:#0071e3;text-decoration:underline;}
  .share-grid{display:flex;gap:14px;justify-content:center;padding:8px 0 4px;flex-wrap:wrap;}
  .share-item{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:none;border:none;cursor:pointer;width:76px;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  }
  .share-icon{
    width:56px;height:56px;border-radius:14px;background:#f5f5f7;
    display:flex;align-items:center;justify-content:center;font-size:26px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .1s ease, box-shadow .15s ease;
  }
  .share-item:hover .share-icon{transform:scale(1.06);box-shadow:0 3px 8px rgba(0,0,0,.14);}
  .share-item:active .share-icon{transform:scale(.96);}
  .share-label{font-size:12px;font-weight:600;color:#1d1d1f;text-align:center;}
  #searchInput{
    font-family:'Space Grotesk',sans-serif;font-size:13px;padding:7px 10px;border:1px solid var(--line);
    border-radius:6px;background:#fff;color:var(--ink);width:150px;
  }
  #searchInput:focus{outline:none;border-color:var(--accent);}
  #searchMic{width:30px;height:30px;font-size:13px;}
  .search-results{
    display:none;position:fixed;z-index:45;background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 6px 20px rgba(0,0,0,.2);max-height:50vh;overflow-y:auto;min-width:220px;
  }
  .search-results.open{display:block;}
  .search-results .sr-item{
    display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);
  }
  .search-results .sr-item:last-child{border-bottom:none;}
  .search-results .sr-item:hover{background:#f2fbfa;}
  .search-results .sr-icon{font-size:18px;flex:none;}
  .search-results .sr-main{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .search-results .sr-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .search-results .sr-meta{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .search-results .sr-empty{padding:12px;font-size:13px;color:var(--ink-soft);}
  @keyframes searchPulse{
    0%{ filter:drop-shadow(0 0 0px var(--warn)); }
    40%{ filter:drop-shadow(0 0 14px var(--warn)); }
    100%{ filter:drop-shadow(0 0 0px var(--warn)); }
  }
  .search-pulse{ animation:searchPulse 1.1s ease-out 2; }

  /* Layout */
  #layout{flex:1;display:flex;min-height:0;position:relative;}
  #inspector{
    width:300px;flex:none;background:var(--panel-bg);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-width:0;
    transition:width .2s ease;position:relative;z-index:4;
  }
  #inspector.collapsed{width:34px;}
  #inspectorHeader{
    display:flex;align-items:center;justify-content:flex-end;flex:none;
    padding:8px;border-bottom:1px solid var(--line);
  }
  #inspectorArrowBtn{
    background:var(--white);border:1px solid var(--line);border-radius:6px;
    width:26px;height:26px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none;
  }
  #inspectorArrowBtn:hover{border-color:var(--accent);}
  #inspectorContent{overflow-y:auto;padding:0 16px 16px;flex:1;min-width:266px;}
  #inspector.collapsed #inspectorContent{display:none;}
  #inspector.collapsed #inspectorHeader{justify-content:center;}
  #inspector h2{font-size:15px;margin:0 0 12px;letter-spacing:.2px;}
  #inspector .empty{color:var(--ink-soft);font-size:13px;line-height:1.5;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
  .field-row{display:flex;gap:6px;align-items:center;}
  .field input[type=text]{
    flex:1;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:7px 8px;
    border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%;
  }
  .field select{
    flex:1;font-family:'Space Grotesk',sans-serif;font-size:13px;padding:7px 8px;
    border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);
  }
  .node-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .node-icon{font-size:28px;width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .node-class-label{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .rel-list{list-style:none;margin:0;padding:0;}
  .rel-list li{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);}
  .rel-list .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--panel-bg-2);border-radius:3px;padding:1px 5px;}
  .link-btn{background:none;border:none;color:var(--accent-dark);font-size:12px;cursor:pointer;padding:0;text-decoration:underline;font-family:'Space Grotesk',sans-serif;}
  .small-x{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:0 4px;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .hint{font-size:11px;color:var(--ink-soft);line-height:1.5;margin-top:4px;}

  /* Canvas area */
  #canvasWrap{flex:1;position:relative;min-width:0;background:
      radial-gradient(circle at 1px 1px, var(--canvas-grid) 1px, transparent 0) 0 0/22px 22px,
      var(--canvas-bg);
  }
  svg#graph2d, #graph3d{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  #graph3d{display:none;}
  #graph3d canvas{display:block;}
  #graph2d{cursor:grab;}
  #graph2d.panning{cursor:grabbing;}
  .node-label{font-family:'Space Grotesk',sans-serif;font-size:12px;fill:var(--white);pointer-events:none;}
  .edge-line{stroke:var(--edge);stroke-width:2.2;fill:none;marker-end:url(#arrow);cursor:pointer;}
  .edge-line.selected{stroke:var(--danger);stroke-width:3;}
  .edge-line-hit{stroke:transparent;stroke-width:16;fill:none;cursor:pointer;}
  .node-circle{stroke-width:2.5;cursor:grab;}
  .node-circle.focus{stroke:var(--warn);stroke-width:4;}
  .connect-handle{fill:var(--accent);stroke:#fff;stroke-width:1.5;cursor:crosshair;opacity:0;transition:opacity .1s;}
  .node-group:hover .connect-handle{opacity:1;}
  .expand-badge{cursor:pointer;}
  .expand-badge circle{fill:var(--warn);stroke:#fff;stroke-width:1.5;}
  .expand-badge text{fill:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;pointer-events:none;}
  .expand-badge:hover circle{fill:#b06f26;}
  .nav-badge{cursor:pointer;}
  .nav-badge circle{fill:#34c759;stroke:#fff;stroke-width:1.5;}
  .nav-badge text{pointer-events:none;}
  .nav-badge:hover circle{fill:#28a745;}
  .temp-edge{stroke:var(--warn);stroke-width:2;stroke-dasharray:5 4;fill:none;pointer-events:none;}

  #legend{position:absolute;left:14px;bottom:14px;background:rgba(20,24,30,.82);border:1px solid #2a323d;border-radius:8px;padding:10px 12px;font-size:11px;color:#c9d0da;max-width:230px;max-height:60vh;display:flex;flex-direction:column;}
  #legendBody{overflow-y:auto;order:-1;}
  .legend-group{margin-bottom:6px;}
  .legend-group-title{color:#8fd8d0;font-weight:600;padding-left:0 !important;}
  .legend-cluster{margin-bottom:4px;}
  .legend-cluster summary{cursor:pointer;font-weight:700;color:#f0c86e;padding:3px 0;list-style:revert;}
  .legend-cluster summary:hover{color:#ffdd94;}
  .legend-cluster[open] summary{margin-bottom:2px;}
  #legend h3{margin:0 0 6px;font-size:11px;color:#8fd8d0;font-family:'IBM Plex Mono',monospace;font-weight:500;cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px;}
  #legend h3:hover{color:#bff0ea;}
  #legendArrow{display:inline-block;transition:transform .15s;font-size:10px;}
  #legendArrow.collapsed{transform:rotate(-90deg);}

  aiChatSystemPrompt: { de:"Du bist eine in das Objekt-Beziehungsmodellierungs-Tool \"Join\" eingebettete KI. Du kannst (1) Fragen zum unten stehenden Modell ausschließlich anhand der gegebenen Informationen beantworten, und (2) das Modell erweitern, wenn danach gefragt wird (z. B. \"füge X hinzu\", \"verbinde X mit Y\"). WICHTIG: Zeige JSON niemals als Teil deiner sichtbaren Antwort im Fließtext an -- JSON gehört ausschließlich in einen einzelnen ```json-Codeblock, nie sonst irgendwo im Text. Wenn eine Erweiterung gewünscht ist, schreibe zuerst einen kurzen Bestätigungssatz in normaler Sprache und gib DANACH einen ```json-Codeblock aus, der GENAU folgendem Format entspricht: {\"add_nodes\":[{\"name\":\"...\",\"class\":\"KLASSEN-KEY\",\"params\":{\"feldkey\":\"Wert\"},\"lat\":\"48.2082\",\"lon\":\"16.3738\"}],\"add_edges\":[{\"from\":\"Name (neu oder bestehend)\",\"to\":\"Name (neu oder bestehend)\",\"rolle\":\"...\",\"kontakt\":\"\"}]}. WICHTIG zu GPS: Versuche für JEDES neu angelegte Objekt (add_nodes), bei dem sich ein sinnvoller geografischer Ort ermitteln lässt (z. B. eine Stadt, ein konkretes Gebäude, ein Firmensitz, ein Flughafen, ein Land als Punkt der Hauptstadt), zusätzlich \"lat\" und \"lon\" als Dezimalgrad-Zahl (String) anzugeben. Gehe dabei zweistufig vor: 1) Ermittle zuerst eine möglichst genaue, vollständige Adresse des Ortes (Straße, Hausnummer, Postleitzahl, Ort, Land); ist im Modell oder in der Anfrage noch keine Adresse angegeben, recherchiere sie per Web-Suche, bevor du Koordinaten angibst. 2) Nutze diese Adresse dann gezielt, um darauf aufbauend über die Web-Suche die zugehörigen Koordinaten nachzuschlagen -- bevorzugt so, wie sie auf https://www.gpskoordinaten.de/ oder bei Google Maps für genau diese Adresse hinterlegt sind, statt dich auf dein antrainiertes Wissen zu verlassen. Das liefert deutlich genauere Werte als reines Schätzen, besonders bei weniger bekannten Orten. Nur wenn wirklich kein sinnvoller Ort ermittelbar ist (z. B. ein abstraktes Konzept, eine Beziehung, eine Person ohne bekannten Wohnort), lasse lat/lon einfach weg. Nutze für \"class\" ausschließlich einen der unten gelisteten gültigen Klassen-Keys, oder \"neutral\" falls unsicher; nutze für Zusatzinfos ohne passendes Feld den Schlüssel \"bemerkung\" in params. Beziehe dich bei from/to exakt auf vorhandene Objektnamen oder auf Namen, die du selbst in add_nodes neu anlegst. WICHTIG zu Aktualisierungen: Wirst du nach einem konkreten Attributwert eines BEREITS BESTEHENDEN Objekts gefragt (z. B. \"Recherchiere die Telefonnummer von X und trage sie ein\", \"Wie lautet die Öffnungszeit von Y? Ergänze das\", oder du ermittelst im Zuge deiner Antwort eine Information, die zu einem Feld eines bestehenden Objekts passt und dort noch fehlt), beantworte die Frage in normaler Sprache UND gib zusätzlich einen ```json-Codeblock mit {\"update_nodes\":[{\"name\":\"Name des bestehenden Objekts\",\"params\":{\"feldkey\":\"ermittelter Wert\"}}]} aus, damit der Wert direkt in dieses Objekt übernommen wird -- lege dafür NIEMALS ein neues add_nodes-Objekt für einen bereits existierenden Namen an. Nutze als feldkey nach Möglichkeit einen der für die Klasse dieses Objekts gültigen Feld-Keys aus der Klassenliste unten; passt kein Feld, nutze \"bemerkung\". update_nodes kann bei Bedarf auch \"lat\"/\"lon\" enthalten. Wenn stattdessen nach der Beziehung zwischen bereits bestehenden Objekten gefragt wird (z. B. \"wie hängen X und Y zusammen?\"), beantworte die Frage in normaler Sprache in deinem Fließtext, UND gib zusätzlich einen ```json-Codeblock mit {\"focus\":[\"Name des bestehenden Objekts 1\",\"Name des bestehenden Objekts 2\"]} aus, der alle für die Antwort relevanten, bereits existierenden Objekte auflistet, damit das Tool sie im Diagramm sichtbar macht -- erzeuge dafür KEINE add_nodes/add_edges. Wenn nur eine allgemeine Frage gestellt wurde, bei der kein sinnvoller Fokus auf bestimmte Objekte möglich ist, gib gar keinen JSON-Block aus. Wenn eine Anfrage sehr viele Objekte/Beziehungen umfasst, gib trotzdem das VOLLSTÄNDIGE JSON aus -- kürze es niemals ab, auch nicht bei großem Umfang. Antworte kurz und in der Sprache der Frage.", en:"You are an AI embedded in the object-relationship modeling tool \"Join\". You can (1) answer questions about the model below using only the information given, and (2) extend the model when asked (e.g. \"add X\", \"connect X to Y\"). IMPORTANT: never show JSON as part of your visible running text -- JSON belongs exclusively inside a single ```json code block, never anywhere else in the text. When an extension is requested, first write one short confirmation sentence in plain language, then output a ```json code block matching EXACTLY this format: {\"add_nodes\":[{\"name\":\"...\",\"class\":\"CLASS-KEY\",\"params\":{\"fieldkey\":\"value\"},\"lat\":\"48.2082\",\"lon\":\"16.3738\"}],\"add_edges\":[{\"from\":\"Name (new or existing)\",\"to\":\"Name (new or existing)\",\"rolle\":\"...\",\"kontakt\":\"\"}]}. IMPORTANT about GPS: for EVERY newly created object (add_nodes) where a sensible real-world location can be determined (e.g. a city, a specific building, a company headquarters, an airport, a country as its capital's point), try to also include \"lat\" and \"lon\" as a decimal-degree number (string). Proceed in two steps: 1) First determine as precise and complete an address as possible for the place (street, house number, postal code, city, country); if no address is given yet in the model or the request, research it via web search before providing coordinates. 2) Then use that address specifically to look up the matching coordinates via web search -- preferring how they are recorded on https://www.gpskoordinaten.de/ or Google Maps for exactly that address, rather than relying on your trained knowledge. This gives noticeably more accurate values than guessing, especially for lesser-known places. Only omit lat/lon when no sensible location genuinely applies (e.g. an abstract concept, a relationship, a person with no known place of residence). For \"class\" use only one of the valid class keys listed below, or \"neutral\" if unsure; use the \"bemerkung\" key inside params for details that don't fit any field. For from/to, refer exactly to existing object names or to names you create yourself in add_nodes. IMPORTANT about updates: if you're asked for a specific attribute value of an ALREADY EXISTING object (e.g. \"Look up the phone number of X and fill it in\", \"What are Y's opening hours? Add that\", or you determine information in the course of your answer that fits a field of an existing object and is currently missing there), answer the question in plain running text AND additionally output a ```json code block with {\"update_nodes\":[{\"name\":\"Name of the existing object\",\"params\":{\"fieldkey\":\"value found\"}}]} so the value is written directly into that object -- NEVER create a new add_nodes entry for a name that already exists. For fieldkey, prefer one of the valid field keys for that object's class from the class list below; if none fits, use \"bemerkung\". update_nodes may also include \"lat\"/\"lon\" if needed. If instead you're asked about the relationship between existing objects (e.g. \"how are X and Y connected?\"), answer the question in plain running text, AND additionally output a ```json code block with {\"focus\":[\"Existing object name 1\",\"Existing object name 2\"]} listing every existing object relevant to the answer, so the tool can make them visible in the diagram -- do NOT create add_nodes/add_edges for this. If only a general question was asked where focusing on specific objects doesn't make sense, output no JSON block at all. If a request involves a large number of objects/relationships, still output the COMPLETE JSON -- never truncate it, no matter how large. Answer briefly, in the language of the question." },

/* ---------------------------------------------------------------
   3. FORCE LAYOUT (einfache Feder/Abstoßungs-Simulation, statisch berechnet)
--------------------------------------------------------------- */
function runForceLayout(getPos, setPos, dims){
  const nodes = state.nodes;
  if(!nodes.length) return;
  const idIndex = {}; nodes.forEach((n,i)=>idIndex[n.id]=i);
  let pos = nodes.map(n=>Object.assign({},getPos(n)));
  const pinned = nodes.map(n=> dims===2 ? n.pinned2d : n.pinned3d);
  // Zufällige Startwerte falls alles 0
  const allZero = pos.every(p=>p.x===0 && p.y===0 && (dims===2 || p.z===0));
  if(allZero){
    pos.forEach((p,i)=>{
      const a = (i/nodes.length)*Math.PI*2;
      p.x = Math.cos(a)*140; p.y = Math.sin(a)*140;
      if(dims===3) p.z = (Math.random()-0.5)*140;
    });
  }
  const REPULSE = dims===2 ? 9000 : 4500;
  const SPRING = 0.02, IDEAL = dims===2 ? 130 : 110, CENTER = 0.003, ITER = 260;
  for(let it=0; it<ITER; it++){
    const disp = pos.map(()=>({x:0,y:0,z:0}));
    for(let i=0;i<pos.length;i++){
      for(let j=i+1;j<pos.length;j++){
        let dx=pos[i].x-pos[j].x, dy=pos[i].y-pos[j].y, dz=dims===3?(pos[i].z-pos[j].z):0;
        let d2 = dx*dx+dy*dy+dz*dz; if(d2<1) d2=1;
        const d = Math.sqrt(d2);
        const f = REPULSE/d2;
        const ux=dx/d, uy=dy/d, uz=dz/d;
        disp[i].x+=ux*f; disp[i].y+=uy*f; if(dims===3) disp[i].z+=uz*f;
        disp[j].x-=ux*f; disp[j].y-=uy*f; if(dims===3) disp[j].z-=uz*f;
      }
    }
    state.edges.forEach(e=>{
      const i=idIndex[e.from], j=idIndex[e.to];
      if(i===undefined||j===undefined) return;
      let dx=pos[i].x-pos[j].x, dy=pos[i].y-pos[j].y, dz=dims===3?(pos[i].z-pos[j].z):0;
      const d = Math.max(1,Math.sqrt(dx*dx+dy*dy+dz*dz));
      const f = SPRING*(d-IDEAL);
      const ux=dx/d, uy=dy/d, uz=dz/d;
      disp[i].x-=ux*f; disp[i].y-=uy*f; if(dims===3) disp[i].z-=uz*f;
      disp[j].x+=ux*f; disp[j].y+=uy*f; if(dims===3) disp[j].z+=uz*f;
    });
    for(let i=0;i<pos.length;i++){
      if(pinned[i]) continue;
      disp[i].x -= pos[i].x*CENTER; disp[i].y -= pos[i].y*CENTER;
      if(dims===3) disp[i].z -= pos[i].z*CENTER;
      pos[i].x += disp[i].x; pos[i].y += disp[i].y;
      if(dims===3) pos[i].z += disp[i].z;
    }
  }
  nodes.forEach((n,i)=> setPos(n,pos[i]));
}
/* ---------------------------------------------------------------
   3b. D3-FORCE-LAYOUT (bevorzugt, falls d3-force-3d geladen werden konnte)
   Erprobte Kräfte: Abstoßung (Barnes-Hut), Federn entlang der Beziehungen,
   Kollisionsvermeidung und ein leichter Zug zur Mitte, damit getrennte
   Gruppen nicht auseinanderdriften. Manuell verschobene (fixierte) Objekte
   bleiben dabei an ihrer Stelle.
--------------------------------------------------------------- */
const D3_LAYOUT = {
  2: { link:120, charge:-260, collide:44, pull:0.035 },
  3: { link:105, charge:-190, collide:34, pull:0.03 }
};
function d3ForceAvailable(dims){
  if(typeof d3==="undefined" || typeof d3.forceSimulation!=="function") return false;
  if(dims===3){
    // 3D braucht d3-force-3d (die normale d3-force kennt nur 2 Dimensionen)
    try{ const probe = d3.forceSimulation([]).stop(); return typeof probe.numDimensions==="function" && typeof d3.forceZ==="function"; }
    catch(e){ return false; }
  }
  return true;
}
// Baut eine Simulation aus dem aktuellen Modellzustand; Positionen werden NICHT zurückgeschrieben.
function buildD3Simulation(dims){
  const key = dims===2 ? "pos2d" : "pos3d";
  const pinKey = dims===2 ? "pinned2d" : "pinned3d";
  const allZero = state.nodes.every(n=>{ const p=n[key]||{}; return !p.x && !p.y && (dims===2 || !p.z); });
  const simNodes = state.nodes.map(n=>{
    const p = n[key]||{x:0,y:0,z:0};
    const o = { id:n.id, ref:n };
    if(!allZero){ o.x=p.x; o.y=p.y; if(dims===3) o.z=p.z||0; }  // sonst: d3-eigene gleichmäßige Startverteilung
    if(n[pinKey]){ o.fx=p.x; o.fy=p.y; if(dims===3) o.fz=p.z||0; }
    return o;
  });
  const ids = new Set(simNodes.map(o=>o.id));
  const simLinks = state.edges.filter(e=>ids.has(e.from) && ids.has(e.to) && e.from!==e.to)
                              .map(e=>({ source:e.from, target:e.to }));
  const cfg = D3_LAYOUT[dims];
  const sim = (dims===3 ? d3.forceSimulation(simNodes, 3) : d3.forceSimulation(simNodes));
  if(typeof sim.numDimensions==="function") sim.numDimensions(dims);
  sim.force("link", d3.forceLink(simLinks).id(d=>d.id).distance(cfg.link))
     .force("charge", d3.forceManyBody().strength(cfg.charge).distanceMax(cfg.link*6))
     .force("collide", d3.forceCollide(cfg.collide))
     .force("x", d3.forceX(0).strength(cfg.pull))
     .force("y", d3.forceY(0).strength(cfg.pull));
  if(dims===3) sim.force("z", d3.forceZ(0).strength(cfg.pull));
  sim.stop();
  return { sim, simNodes, allZero };
}
function writeBackD3(simNodes, dims){
  simNodes.forEach(o=>{
    const n = o.ref;
    if(dims===2){ n.pos2d.x=o.x; n.pos2d.y=o.y; }
    else { n.pos3d.x=o.x; n.pos3d.y=o.y; n.pos3d.z=o.z||0; }
  });
}
// Statische Berechnung wie bisher (synchron), nur mit d3 statt der eingebauten Simulation
function runD3Layout(dims){
  if(!state.nodes.length) return;
  const { sim, simNodes, allZero } = buildD3Simulation(dims);
  // Bestehende Anordnung nur sanft nachjustieren, statt sie komplett umzuwerfen
  sim.alpha(allZero ? 1 : 0.35);
  const ticks = Math.ceil(Math.log(sim.alphaMin()/sim.alpha()) / Math.log(1 - sim.alphaDecay()));
  sim.tick(Math.min(ticks, 400));
  writeBackD3(simNodes, dims);
}
function layout2D(){
  if(d3ForceAvailable(2)){ try{ runD3Layout(2); return; }catch(e){ console.error("d3-Layout 2D fehlgeschlagen, nutze eingebautes Layout:", e); } }
  runForceLayout(n=>n.pos2d, (n,p)=>{n.pos2d.x=p.x;n.pos2d.y=p.y;}, 2);
}
function layout3D(){
  if(d3ForceAvailable(3)){ try{ runD3Layout(3); return; }catch(e){ console.error("d3-Layout 3D fehlgeschlagen, nutze eingebautes Layout:", e); } }
  runForceLayout(n=>n.pos3d, (n,p)=>{n.pos3d.x=p.x;n.pos3d.y=p.y;n.pos3d.z=p.z;}, 3);
}

// "Lebendiges" 2D-Layout beim Ziehen: Nachbarn weichen weich aus und ordnen sich nach
let liveSim2D = null, liveSimNodes2D = null, liveRenderQueued = false;
function startLiveDrag2D(node){
  if(!d3ForceAvailable(2) || geoMode) return;
  try{
    const built = buildD3Simulation(2);
    liveSim2D = built.sim; liveSimNodes2D = built.simNodes;
    const me = liveSimNodes2D.find(o=>o.id===node.id);
    if(me){ me.fx = node.pos2d.x; me.fy = node.pos2d.y; }
    liveSim2D.on("tick", ()=>{
      liveSimNodes2D.forEach(o=>{ if(o.id!==node.id){ o.ref.pos2d.x=o.x; o.ref.pos2d.y=o.y; } });
      if(!liveRenderQueued){ liveRenderQueued = true; requestAnimationFrame(()=>{ liveRenderQueued=false; if(!view3D && !geoMode) render2D(); }); }
    });
    liveSim2D.alpha(0.3).alphaTarget(0.25).restart();
  }catch(e){ console.error("Live-Layout nicht möglich:", e); liveSim2D = null; }
}
function moveLiveDrag2D(node){
  if(!liveSim2D) return;
  const me = liveSimNodes2D.find(o=>o.id===node.id);
  if(me){ me.fx = node.pos2d.x; me.fy = node.pos2d.y; }
}
function endLiveDrag2D(){
  if(!liveSim2D) return;
  const sim = liveSim2D;
  sim.alphaTarget(0); // ausklingen lassen; stoppt von selbst
  sim.on("end", ()=>{ if(liveSim2D===sim){ liveSim2D=null; liveSimNodes2D=null; } markDirty(); });
}

/* ---------------------------------------------------------------
   4. SICHTBARKEIT / EBENEN-FILTER
--------------------------------------------------------------- */
function visibleSet(){
  const maxHop = HOP_STEPS[hopIdx];
  const adj = {};
  state.nodes.forEach(n=>adj[n.id]=[]);
  state.edges.forEach(e=>{ if(adj[e.from]) adj[e.from].push([e.to,e.id]); if(adj[e.to]) adj[e.to].push([e.from,e.id]); });
  const existing = new Set(state.nodes.map(n=>n.id));
  let seeds = focusNodeId ? [focusNodeId] : (multiFocusIds && multiFocusIds.size ? [...multiFocusIds] : null);
  if(seeds) seeds = seeds.filter(id=>existing.has(id));
  // Keine gültigen Ausgangsobjekte mehr (z. B. gelöscht oder aus einem vorher geladenen Modell) -> nicht filtern
  if(!seeds || !seeds.length || maxHop===Infinity){
    return { nodes:new Set(state.nodes.map(n=>n.id)), edges:new Set(state.edges.map(e=>e.id)), adj, hidden:new Set() };
  }
  const dist = {}; const queue=[];
  seeds.forEach(id=>{ if(!(id in dist)){ dist[id]=0; queue.push(id); } });
  const edgesUsed = new Set();
  while(queue.length){
    const cur = queue.shift();
    if(dist[cur]>=maxHop) continue;
    (adj[cur]||[]).forEach(([nb,eid])=>{
      edgesUsed.add(eid);
      if(!(nb in dist)){ dist[nb]=dist[cur]+1; queue.push(nb); }
    });
  }
  const nodeSet = new Set(Object.keys(dist));
  // Manuell per "+" aufgeklappte Objekte: deren Nachbarn zusätzlich sichtbar machen
  expandedNodes.forEach(id=>{
    (adj[id]||[]).forEach(([nb,eid])=>{ nodeSet.add(nb); edgesUsed.add(eid); });
  });
  // Objekte ganz ohne Beziehungen sind über die Graph-Traversierung vom Fokus-Objekt aus
  // niemals erreichbar und würden bei JEDER Auswahl dauerhaft unsichtbar bleiben -> immer mit anzeigen
  state.nodes.forEach(n=>{ if((adj[n.id]||[]).length===0) nodeSet.add(n.id); });
  const edgeSet = new Set([...edgesUsed].filter(eid=>{
    const e = state.edges.find(x=>x.id===eid);
    return e && nodeSet.has(e.from) && nodeSet.has(e.to);
  }));
  const hidden = new Set();
  nodeSet.forEach(id=>{
    const hasHiddenNb = (adj[id]||[]).some(([nb])=>!nodeSet.has(nb));
    if(hasHiddenNb) hidden.add(id);
  });
  return { nodes:nodeSet, edges:edgeSet, adj, hidden };
}
function expandNode(id){
  expandedNodes.add(id);
  renderAll();
}
// Ermittelt "Hauptobjekte" über Nähe-Zentralität (durchschnittliche Kantendistanz zu allen
// erreichbaren Objekten): Ein echtes Hauptobjekt (z. B. eine Stadt, ein Konzern) liegt strukturell
// näher an ALLEN anderen Objekten als ein Zwischenobjekt (z. B. eine einzelne Abteilung), da es
// über dieses Zwischenobjekt auch alle ANDEREN Zweige in wenigen Schritten erreicht. Reiner
// Beziehungs-Grad (Kantenanzahl) würde stattdessen oft fälschlich Zwischenobjekte mit vielen
// eigenen "Blättern" auswählen und damit die komplette erste Subebene wieder mit anzeigen.
function computeMainObjectIds(){
  const adj = {};
  state.nodes.forEach(n=> adj[n.id]=[]);
  state.edges.forEach(e=>{ if(adj[e.from]) adj[e.from].push(e.to); if(adj[e.to]) adj[e.to].push(e.from); });
  // Zentralität wird PRO zusammenhängender Gruppe bestimmt: Ein Modell kann aus mehreren
  // getrennten Gruppen bestehen (z. B. nach dem Koppeln). Ein globaler Vergleich ließe eine
  // kleine Gruppe immer "zentraler" wirken als eine große Hierarchie -- die große Gruppe wäre dann
  // komplett unsichtbar und ohne "+" nicht mehr erreichbar. So bekommt jede Gruppe eigene Hauptobjekte.
  const mains = new Set();
  const seen = new Set();
  state.nodes.forEach(n=>{
    if(seen.has(n.id) || adj[n.id].length===0) return; // isolierte Objekte werden ohnehin immer angezeigt
    const comp = []; const q=[n.id]; seen.add(n.id);
    while(q.length){ const c=q.shift(); comp.push(c); adj[c].forEach(nb=>{ if(!seen.has(nb)){ seen.add(nb); q.push(nb); } }); }
    const farness = {};
    comp.forEach(startId=>{
      const dist = {}; dist[startId]=0; const queue=[startId]; let total=0;
      while(queue.length){
        const cur = queue.shift();
        adj[cur].forEach(nb=>{ if(!(nb in dist)){ dist[nb]=dist[cur]+1; queue.push(nb); total+=dist[nb]; } });
      }
      farness[startId] = total/(comp.length-1);
    });
    const minF = Math.min(...comp.map(id=>farness[id]));
    const threshold = minF * 1.25; // Toleranzband, damit mehrere gleichwertige Hauptzweige erfasst werden
    comp.forEach(id=>{ if(farness[id] <= threshold) mains.add(id); });
  });
  return mains;
}
const LARGE_MODEL_THRESHOLD = 100;
// Wird nach jedem Laden/Öffnen eines Modells aufgerufen: bei mehr als LARGE_MODEL_THRESHOLD
// Objekten wird zunächst nur eine beherrschbare Übersicht gezeigt (Hauptobjekte + 1. Subebene),
// statt sofort alle Objekte auf einmal darzustellen -- für Übersichtlichkeit und Performance.
// Einzelne Zweige lassen sich bei Bedarf per "+" oder über den Ebenen-Regler weiter aufklappen.
function applyLargeModelDefaultView(){
  let isLarge = false;
  if(state.nodes.length > LARGE_MODEL_THRESHOLD){
    multiFocusIds = computeMainObjectIds();
    hopIdx = 0; // HOP_STEPS[0] = 0 -> nur die Hauptobjekte selbst, auch die 1. Ebene bleibt zunächst verborgen
    isLarge = true;
  } else {
    multiFocusIds = null;
    hopIdx = HOP_STEPS.length-1; // "Alle"
  }
  updateHopUI();
  return isLarge;
}

/* ---------------------------------------------------------------
   5. RENDERING – 2D (SVG)
--------------------------------------------------------------- */
const svg = document.getElementById("graph2d");
const edgeLayer = document.getElementById("edgeLayer");
const nodeLayer = document.getElementById("nodeLayer");
let panX=0, panY=0, zoom=1;
const ZOOM_MIN=0.2, ZOOM_MAX=4;

function svgSetTransform(){
  const t = `translate(${panX} ${panY}) scale(${zoom})`;
  edgeLayer.setAttribute("transform",t);
  nodeLayer.setAttribute("transform",t);
}
function centerOf(){ const r = svg.getBoundingClientRect(); return {cx:r.width/2, cy:r.height/2}; }

function render2D(){
  const {cx,cy} = centerOf();
  panX = panX || cx; panY = panY || cy;
  const vis = visibleSet();
  edgeLayer.innerHTML=""; nodeLayer.innerHTML="";
  state.edges.forEach(e=>{
    if(!vis.edges.has(e.id)) return;
    const a = state.nodes.find(n=>n.id===e.from), b = state.nodes.find(n=>n.id===e.to);
    if(!a||!b) return;
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    const hit = document.createElementNS("http://www.w3.org/2000/svg","path");
    hit.setAttribute("class","edge-line-hit");
    hit.setAttribute("d",`M${a.pos2d.x},${a.pos2d.y} L${b.pos2d.x},${b.pos2d.y}`);
    const line = document.createElementNS("http://www.w3.org/2000/svg","path");
    line.setAttribute("class","edge-line"+(selectedEdgeId===e.id?" selected":""));
    line.setAttribute("d",`M${a.pos2d.x},${a.pos2d.y} L${b.pos2d.x},${b.pos2d.y}`);
    [hit,line].forEach(el=>el.addEventListener("click",(ev)=>{ ev.stopPropagation(); selectEdge(e.id); }));
    g.appendChild(hit); g.appendChild(line);
    edgeLayer.appendChild(g);
  });
  state.nodes.forEach(n=>{
    if(!vis.nodes.has(n.id)) return;
    const cls = CLASSES[n.class];
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","node-group"+(pulseNodeId===n.id ? " search-pulse":""));
    g.setAttribute("transform",`translate(${n.pos2d.x},${n.pos2d.y})`);
    const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("class","node-circle"+(focusNodeId===n.id?" focus":""));
    circle.setAttribute("r",26);
    circle.setAttribute("fill",cls.color);
    circle.setAttribute("stroke", n.class==="neutral" ? "#fff" : "#12161c");
    const icon = document.createElementNS("http://www.w3.org/2000/svg","text");
    icon.setAttribute("text-anchor","middle"); icon.setAttribute("dy","7"); icon.setAttribute("font-size","22");
    icon.textContent = cls.icon;
    const label = document.createElementNS("http://www.w3.org/2000/svg","text");
    label.setAttribute("class","node-label"); label.setAttribute("text-anchor","middle"); label.setAttribute("dy","44");
    label.textContent = n.name || t("noNameLabel");
    const handle = document.createElementNS("http://www.w3.org/2000/svg","circle");
    handle.setAttribute("class","connect-handle"); handle.setAttribute("r",7);
    handle.setAttribute("cx",26*Math.cos(-Math.PI/4)); handle.setAttribute("cy",26*Math.sin(-Math.PI/4));
    g.appendChild(circle); g.appendChild(icon); g.appendChild(label); g.appendChild(handle);
    if(vis.hidden && vis.hidden.has(n.id)){
      const bx = 26*Math.cos(-3*Math.PI/4), by = 26*Math.sin(-3*Math.PI/4);
      const badge = document.createElementNS("http://www.w3.org/2000/svg","g");
      badge.setAttribute("class","expand-badge");
      badge.setAttribute("transform",`translate(${bx},${by})`);
      const bCircle = document.createElementNS("http://www.w3.org/2000/svg","circle");
      bCircle.setAttribute("r",9);
      const bPlus = document.createElementNS("http://www.w3.org/2000/svg","text");
      bPlus.setAttribute("text-anchor","middle"); bPlus.setAttribute("dy","4"); bPlus.setAttribute("font-size","13");
      bPlus.textContent = "+";
      badge.appendChild(bCircle); badge.appendChild(bPlus);
      badge.addEventListener("pointerdown",(ev)=>{ ev.stopPropagation(); });
      badge.addEventListener("click",(ev)=>{ ev.stopPropagation(); expandNode(n.id); });
      g.appendChild(badge);
    }
    if(nodeLatLon(n)){
      // Kleines Navigations-Symbol: nur sichtbar, wenn das Objekt gültige GPS-Koordinaten hat.
      // Einfacher Klick öffnet direkt die Google-Maps-Navigation zu dieser Koordinate.
      const nbx = 26*Math.cos(Math.PI/2), nby = 26*Math.sin(Math.PI/2);
      const navBadge = document.createElementNS("http://www.w3.org/2000/svg","g");
      navBadge.setAttribute("class","nav-badge");
      navBadge.setAttribute("transform",`translate(${nbx},${nby})`);
      const nCircle = document.createElementNS("http://www.w3.org/2000/svg","circle");
      nCircle.setAttribute("r",9);
      const nIcon = document.createElementNS("http://www.w3.org/2000/svg","text");
      nIcon.setAttribute("text-anchor","middle"); nIcon.setAttribute("dy","4"); nIcon.setAttribute("font-size","11");
      nIcon.textContent = "🧭";
      navBadge.appendChild(nCircle); navBadge.appendChild(nIcon);
      navBadge.setAttribute("title", t("navigateGoogleMaps"));
      navBadge.addEventListener("pointerdown",(ev)=>{ ev.stopPropagation(); });
      navBadge.addEventListener("click",(ev)=>{ ev.stopPropagation(); openGoogleMapsNav(n); });
      g.appendChild(navBadge);
    }
    attachNodeEvents2D(g, n, handle);
    nodeLayer.appendChild(g);
  });
  svgSetTransform();
}

/* Pointer-Interaktion 2D */
let dragNode2D = null, dragStart = null, panning=false, panStart=null, tempLineSrc=null;
let tempLineEl = null, dragActuallyMoved=false;
const DRAG_THRESHOLD = 5;

function attachNodeEvents2D(g, n, handle){
  g.addEventListener("pointerdown",(ev)=>{
    ev.stopPropagation();
    if(ev.target===handle || connectMode){
      tempLineSrc = n;
      tempLineEl = document.createElementNS("http://www.w3.org/2000/svg","line");
      tempLineEl.setAttribute("class","temp-edge");
      edgeLayer.appendChild(tempLineEl);
    } else {
      dragNode2D = n; dragActuallyMoved=false;
      dragStart = {x:ev.clientX,y:ev.clientY, ox:n.pos2d.x, oy:n.pos2d.y};
    }
    window.addEventListener("pointermove",onPointerMove2D);
    window.addEventListener("pointerup",onPointerUp2D,{once:true});
  });
}
function onPointerMove2D(ev){
  if(tempLineSrc){
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX-r.left-panX)/zoom, y=(ev.clientY-r.top-panY)/zoom;
    tempLineEl.setAttribute("x1",tempLineSrc.pos2d.x); tempLineEl.setAttribute("y1",tempLineSrc.pos2d.y);
    tempLineEl.setAttribute("x2",x); tempLineEl.setAttribute("y2",y);
  } else if(dragNode2D){
    const dx=(ev.clientX-dragStart.x)/zoom, dy=(ev.clientY-dragStart.y)/zoom;
    if(!dragActuallyMoved && Math.hypot(ev.clientX-dragStart.x, ev.clientY-dragStart.y) > DRAG_THRESHOLD){
      dragActuallyMoved = true; dragNode2D.pinned2d = true; markDirty();
      startLiveDrag2D(dragNode2D);
    }
    if(dragActuallyMoved){
      dragNode2D.pos2d.x = dragStart.ox+dx; dragNode2D.pos2d.y = dragStart.oy+dy;
      moveLiveDrag2D(dragNode2D);
      if(!liveSim2D) render2D(); // mit Live-Simulation zeichnet deren Takt neu
    }
  } else if(panning){
    panX = panStart.px + (ev.clientX-panStart.x);
    panY = panStart.py + (ev.clientY-panStart.y);
    svgSetTransform();
  }
}
function onPointerUp2D(ev){
  window.removeEventListener("pointermove",onPointerMove2D);
  if(tempLineSrc){
    const el = document.elementFromPoint(ev.clientX,ev.clientY);
    const targetG = el ? el.closest(".node-group") : null;
    if(targetG){
      const idx = [...nodeLayer.children].indexOf(targetG);
      const visNodes = state.nodes.filter(n=>visibleSet().nodes.has(n.id));
      const targetNode = visNodes[idx];
      if(targetNode && targetNode.id!==tempLineSrc.id) createEdge(tempLineSrc.id, targetNode.id);
    }
    tempLineEl && tempLineEl.remove();
    tempLineSrc=null; tempLineEl=null;
  }
  if(dragNode2D){
    if(!dragActuallyMoved){ selectNode(dragNode2D.id); }
    else endLiveDrag2D();
    dragNode2D=null;
  }
  panning=false; svg.classList.remove("panning");
  render2D();
}
svg.addEventListener("pointerdown",(ev)=>{
  if(ev.target===svg){
    panning=true; panStart={x:ev.clientX,y:ev.clientY,px:panX,py:panY};
    svg.classList.add("panning");
    selectedEdgeId=null; updateDeleteEdgeBtn();
    window.addEventListener("pointermove",onPointerMove2D);
    window.addEventListener("pointerup",onPointerUp2D,{once:true});
  }
});
svg.addEventListener("wheel",(ev)=>{
  ev.preventDefault();
  const factor = ev.deltaY<0 ? 1.08 : 0.92;
  zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom*factor));
  svgSetTransform();
},{passive:false});

/* ---------------------------------------------------------------
   6. RENDERING – 3D (three.js)
--------------------------------------------------------------- */
let three = { scene:null, camera:null, renderer:null, group:null, raycaster:null, meshes:{}, navBadges:{}, initialized:false };
let rot = {x:-0.3, y:0.5}, camDist=420;
const CAM_MIN=120, CAM_MAX=1400;
document.getElementById("graph3d").addEventListener("wheel",(ev)=>{
  ev.preventDefault();
  const factor = ev.deltaY<0 ? 0.9 : 1.1;
  camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, camDist*factor));
},{passive:false});
let dragging3D=null, panningView3D=false, panStart3D=null, connectSrc3D=null, tempLine3D=null;
let dragActuallyMoved3D=false, dragStart3D=null;

function init3D(){
  if(three.initialized) return;
  const container = document.getElementById("graph3d");
  const w = container.clientWidth, h = container.clientHeight;
  three.scene = new THREE.Scene();
  three.camera = new THREE.PerspectiveCamera(50, w/h, 1, 5000);
  three.renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
  three.renderer.setSize(w,h); three.renderer.setPixelRatio(window.devicePixelRatio||1);
  container.appendChild(three.renderer.domElement);
  three.scene.add(new THREE.AmbientLight(0xffffff,0.8));
  const dl = new THREE.DirectionalLight(0xffffff,0.6); dl.position.set(200,300,400); three.scene.add(dl);
  three.group = new THREE.Group(); three.scene.add(three.group);
  three.raycaster = new THREE.Raycaster();
  three.initialized = true;

  const dom = three.renderer.domElement;
  dom.addEventListener("pointerdown", on3DPointerDown);
  window.addEventListener("resize", resize3D);
  animate3D();
}
function resize3D(){
  if(!three.initialized) return;
  const container = document.getElementById("graph3d");
  const w = container.clientWidth, h = container.clientHeight;
  three.camera.aspect = w/h; three.camera.updateProjectionMatrix();
  three.renderer.setSize(w,h);
}
function makeSprite(text, color, textColor){
  const cvs = document.createElement("canvas"); cvs.width=256; cvs.height=96;
  const ctx = cvs.getContext("2d");
  ctx.font="46px sans-serif"; ctx.textAlign="center"; ctx.fillText(text.icon,128,54);
  ctx.font="500 26px 'Space Grotesk', sans-serif"; ctx.fillStyle=textColor||"#f6f7f9";
  ctx.fillText(text.label.length>16?text.label.slice(0,15)+"…":text.label,128,88);
  const tex = new THREE.CanvasTexture(cvs);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
  const spr = new THREE.Sprite(mat); spr.scale.set(70,26,1);
  return spr;
}
// Kleines, anklickbares Navigations-Symbol (Kompass) für Objekte mit gültigen GPS-Koordinaten
// in der 3D-/Globus-Ansicht -- öffnet per Klick die Google-Maps-Navigation.
function makeNavBadgeSprite(){
  const cvs = document.createElement("canvas"); cvs.width=64; cvs.height=64;
  const ctx = cvs.getContext("2d");
  ctx.beginPath(); ctx.arc(32,32,27,0,Math.PI*2); ctx.fillStyle="#34c759"; ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle="#ffffff"; ctx.stroke();
  ctx.font="30px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("🧭", 32, 35);
  const tex = new THREE.CanvasTexture(cvs);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
  const spr = new THREE.Sprite(mat); spr.scale.set(15,15,1);
  return spr;
}
function rebuild3DObjects(forReport){
  if(!three.initialized) return;
  while(three.group.children.length) three.group.remove(three.group.children[0]);
  three.meshes = {};
  three.navBadges = {};
  if(geoMode){ buildGlobeScene(forReport); return; }
  const vis = visibleSet();
  const edgeMat = new THREE.LineBasicMaterial({color:0x5b93c9});
  state.edges.forEach(e=>{
    if(!vis.edges.has(e.id)) return;
    const a = state.nodes.find(n=>n.id===e.from), b = state.nodes.find(n=>n.id===e.to);
    if(!a||!b) return;
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(a.pos3d.x,a.pos3d.y,a.pos3d.z),
      new THREE.Vector3(b.pos3d.x,b.pos3d.y,b.pos3d.z)]);
    const mat = e.id===selectedEdgeId ? new THREE.LineBasicMaterial({color:0xd1495b}) : edgeMat;
    const line = new THREE.Line(geo,mat); line.userData.edgeId = e.id;
    three.group.add(line);
  });
  state.nodes.forEach(n=>{
    if(!vis.nodes.has(n.id)) return;
    const cls = CLASSES[n.class];
    const geo = new THREE.SphereGeometry(16,20,20);
    const mat = new THREE.MeshStandardMaterial({color: new THREE.Color(cls.color), emissive: n.id===focusNodeId? new THREE.Color(0xE8963C):0x000000, emissiveIntensity:0.4});
    const mesh = new THREE.Mesh(geo,mat);
    mesh.position.set(n.pos3d.x,n.pos3d.y,n.pos3d.z);
    mesh.userData.nodeId = n.id;
    three.group.add(mesh);
    three.meshes[n.id]=mesh;
    const spr = makeSprite({icon:cls.icon, label:n.name||t("noNameLabel")}, cls.color, forReport?"#1d1d1f":"#f6f7f9");
    spr.position.set(n.pos3d.x,n.pos3d.y+34,n.pos3d.z);
    three.group.add(spr);
    if(!forReport && nodeLatLon(n)){
      const navSpr = makeNavBadgeSprite();
      navSpr.position.set(n.pos3d.x+18, n.pos3d.y-18, n.pos3d.z);
      navSpr.userData.navNodeId = n.id;
      three.group.add(navSpr);
      three.navBadges[n.id] = navSpr;
    }
  });
}
function animate3D(){
  requestAnimationFrame(animate3D);
  if(!three.initialized || !view3D) return;
  three.group.rotation.x = rot.x; three.group.rotation.y = rot.y;
  three.camera.position.set(0,0,camDist); three.camera.lookAt(0,0,0);
  three.renderer.render(three.scene, three.camera);
}
function ndcFromEvent(ev){
  const r = three.renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
}
function pickNode3D(ev){
  three.raycaster.setFromCamera(ndcFromEvent(ev), three.camera);
  const meshList = Object.values(three.meshes);
  const hits = three.raycaster.intersectObjects(meshList, true);
  return hits.length ? state.nodes.find(n=>n.id===hits[0].object.userData.nodeId) : null;
}
function pickNavBadge3D(ev){
  const badgeList = Object.values(three.navBadges||{});
  if(!badgeList.length) return null;
  three.raycaster.setFromCamera(ndcFromEvent(ev), three.camera);
  const hits = three.raycaster.intersectObjects(badgeList, true);
  return hits.length ? state.nodes.find(n=>n.id===hits[0].object.userData.navNodeId) : null;
}
function on3DPointerDown(ev){
  const navHit = pickNavBadge3D(ev);
  if(navHit){ openGoogleMapsNav(navHit); return; }
  const hitNode = pickNode3D(ev);
  if(hitNode && connectMode){
    connectSrc3D = hitNode;
    const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(hitNode.pos3d.x,hitNode.pos3d.y,hitNode.pos3d.z), new THREE.Vector3(hitNode.pos3d.x,hitNode.pos3d.y,hitNode.pos3d.z)]);
    tempLine3D = new THREE.Line(geo, new THREE.LineDashedMaterial({color:0xe8963c, dashSize:4, gapSize:3}));
    three.group.add(tempLine3D);
    window.addEventListener("pointermove", on3DConnectMove);
    window.addEventListener("pointerup", on3DConnectUp, {once:true});
  } else if(hitNode){
    dragging3D = hitNode; dragActuallyMoved3D=false; dragStart3D={x:ev.clientX,y:ev.clientY};
    window.addEventListener("pointermove", on3DDragMove);
    window.addEventListener("pointerup", on3DDragUp, {once:true});
  } else {
    // Check edge click
    three.raycaster.setFromCamera(ndcFromEvent(ev), three.camera);
    const lines = three.group.children.filter(c=>c.type==="Line" && c.userData.edgeId);
    const hits = three.raycaster.intersectObjects(lines);
    if(hits.length){ selectEdge(hits[0].object.userData.edgeId); return; }
    panningView3D = true;
    panStart3D = {x:ev.clientX,y:ev.clientY, rx:rot.x, ry:rot.y};
    selectedEdgeId=null; updateDeleteEdgeBtn(); rebuild3DObjects();
    window.addEventListener("pointermove", on3DPanMove);
    window.addEventListener("pointerup", ()=>{ panningView3D=false; window.removeEventListener("pointermove",on3DPanMove); }, {once:true});
  }
}
function on3DPanMove(ev){
  if(!panningView3D) return;
  rot.y = panStart3D.ry + (ev.clientX-panStart3D.x)*0.008;
  rot.x = Math.max(-1.3, Math.min(1.3, panStart3D.rx + (ev.clientY-panStart3D.y)*0.008));
}
function on3DDragMove(ev){
  if(!dragging3D) return;
  if(!dragActuallyMoved3D){
    if(Math.hypot(ev.clientX-dragStart3D.x, ev.clientY-dragStart3D.y) <= DRAG_THRESHOLD) return;
    dragActuallyMoved3D = true; dragging3D.pinned3d = true; markDirty();
  }
  // Verschiebung auf einer Ebene parallel zur Kamera, in Höhe des Knotens
  three.raycaster.setFromCamera(ndcFromEvent(ev), three.camera);
  const normal = new THREE.Vector3(); three.camera.getWorldDirection(normal);
  const planePoint = new THREE.Vector3(dragging3D.pos3d.x,dragging3D.pos3d.y,dragging3D.pos3d.z).applyEuler(three.group.rotation);
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, planePoint);
  const ipt = new THREE.Vector3();
  three.raycaster.ray.intersectPlane(plane, ipt);
  if(ipt){
    const inv = three.group.rotation.clone();
    const local = ipt.clone().applyEuler(new THREE.Euler(-inv.x,-inv.y,-inv.z,"ZYX"));
    dragging3D.pos3d.x = local.x; dragging3D.pos3d.y = local.y; dragging3D.pos3d.z = local.z;
    rebuild3DObjects();
  }
}
function on3DDragUp(){
  if(dragging3D && !dragActuallyMoved3D){ selectNode(dragging3D.id); }
  dragging3D=null; window.removeEventListener("pointermove",on3DDragMove);
}
function on3DConnectMove(ev){
  if(!connectSrc3D) return;
  three.raycaster.setFromCamera(ndcFromEvent(ev), three.camera);
  const normal = new THREE.Vector3(); three.camera.getWorldDirection(normal);
  const planePoint = new THREE.Vector3(connectSrc3D.pos3d.x,connectSrc3D.pos3d.y,connectSrc3D.pos3d.z).applyEuler(three.group.rotation);
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, planePoint);
  const ipt = new THREE.Vector3();
  three.raycaster.ray.intersectPlane(plane, ipt);
  if(ipt && tempLine3D){
    const posAttr = tempLine3D.geometry.attributes.position;
    const localEnd = ipt.clone(); three.group.worldToLocal(localEnd);
    posAttr.setXYZ(1, localEnd.x, localEnd.y, localEnd.z);
    posAttr.needsUpdate = true;
  }
}
function on3DConnectUp(ev){
  window.removeEventListener("pointermove", on3DConnectMove);
  const target = pickNode3D(ev);
  if(target && connectSrc3D && target.id!==connectSrc3D.id) createEdge(connectSrc3D.id, target.id);
  if(tempLine3D){ three.group.remove(tempLine3D); tempLine3D=null; }
  connectSrc3D=null;
  rebuild3DObjects();
}

/* ---------------------------------------------------------------
   7. GRAPH-MUTATIONEN
--------------------------------------------------------------- */
function createEdge(fromId,toId){
  if(state.edges.some(e=>e.from===fromId&&e.to===toId)) { toast(t("relationExists")); return; }
  state.edges.push({id:uid("edge"), from:fromId, to:toId, rolle:{de:"",en:""}, kontakt:{de:"",en:""}});
  markDirty();
  toast(t("relationCreated"));
  renderAll();
}
function deleteEdge(id){
  state.edges = state.edges.filter(e=>e.id!==id);
  if(selectedEdgeId===id) selectedEdgeId=null;
  markDirty();
  renderAll();
}
function selectEdge(id){ selectedEdgeId = id; updateDeleteEdgeBtn(); renderAll(); }
function updateDeleteEdgeBtn(){ document.getElementById("btnDeleteEdge").disabled = !selectedEdgeId; }

function updateHopUI(){
  const slider = document.getElementById("hopSlider");
  if(slider) slider.value = hopIdx;
  const lbl = document.getElementById("hopLabel");
  if(lbl) lbl.textContent = HOP_STEPS[hopIdx]===Infinity ? t("all") : String(HOP_STEPS[hopIdx]);
}
function selectNode(id){
  selectedNodeId = id;
  if(clickFilterMode){
    // Bisheriges Verhalten: Ansicht filtert auf die 1. Ebene des angeklickten Objekts,
    // weitere Ebenen werden ausgeblendet.
    focusNodeId = id;
    expandedNodes = new Set();
    hopIdx = 1; // HOP_STEPS[1] = 1
    updateHopUI();
  }
  // Bei ausgeschaltetem Schalter: nur auswählen/im Inspektor öffnen, die aktuell sichtbare
  // Ansicht (Beziehungen/Ebenen) bleibt komplett unverändert bestehen.
  renderInspector(); renderAll();
}
// Aktuelles Datum/Uhrzeit im Format von <input type="datetime-local"> (lokale Zeitzone)
function nowAsDatetimeLocalString(){
  const d = new Date();
  const pad = (n)=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function addObject(){

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRecognition = null; // nur eine Spracherkennungs-Sitzung darf gleichzeitig laufen
function micErrorMessage(err){
  switch(err){
    case "not-allowed":
    case "service-not-allowed": return t("micNotAllowed");
    case "no-speech": return t("micNoSpeech");
    case "network": return t("micNetwork");
    case "aborted": return null; // vom Nutzer/Programm selbst abgebrochen, keine Fehlermeldung nötig
    default: return t("micFailed");
  }
}
function startRecognition(button, onResult){
  // Falls bereits eine Sitzung läuft (z. B. anderer Mic-Button), diese zuerst sauber stoppen
  if(activeRecognition){
    try{ activeRecognition.abort(); }catch(e){}
    activeRecognition = null;
  }
  let rec;
  try{
    rec = new SpeechRec();
  }catch(e){
    toast(t("micFailed"));
    return;
  }
  rec.lang = lang==="en" ? "en-US" : "de-DE"; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onresult = (e)=>{ onResult(e.results[0][0].transcript); };
  rec.onerror = (e)=>{
    const msg = micErrorMessage(e && e.error);
    if(msg) toast(msg);
  };
  rec.onend = ()=>{
    button.classList.remove("listening");
    if(activeRecognition===rec) activeRecognition=null;
  };
  try{
    rec.start();
    activeRecognition = rec;
    button.classList.add("listening");
  }catch(e){
    toast(t("micFailed"));
    button.classList.remove("listening");
  }
}
function attachMic(button, onResult){
  if(!SpeechRec){ button.title=t("micUnavailable"); button.disabled=true; button.style.opacity=.35; return; }
  button.addEventListener("click",(ev)=>{
    ev.preventDefault();
    startRecognition(button, onResult);
  });
}

    reader.readAsDataURL(file);
  });

}

// Kleiner Kartenausschnitt mit roter Stecknadel -- selbst mit der bereits geladenen Leaflet-Bibliothek
// gerendert (statt eines unzuverlässigen externen Static-Map-Dienstes) und per html2canvas eingefangen.
// Nur für den druckbaren Report, dort ist eine interaktive Leaflet-Karte pro Zeile nicht praktikabel.
function captureMiniMapImage(lat, lon){
  return new Promise((resolve)=>{
    if(typeof L==="undefined" || typeof html2canvas==="undefined"){ resolve(null); return; }
    const container = document.createElement("div");
    container.style.cssText = "position:fixed;left:-9999px;top:-9999px;width:140px;height:140px;";
    document.body.appendChild(container);
    let map;
    try{
      map = L.map(container, {attributionControl:false, zoomControl:false, fadeAnimation:false}).setView([lat,lon], 14);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:18}).addTo(map);
      const pinIcon = L.divIcon({
        className: "",
        html: `<svg width="26" height="35" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
                 <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20c0-6.6-5.4-12-12-12z" fill="#ff3b30" stroke="#fff" stroke-width="1.5"/>
                 <circle cx="12" cy="12" r="5" fill="#fff"/>
               </svg>`,
        iconSize: [26,35], iconAnchor: [13,35]
      });
      L.marker([lat,lon], {icon:pinIcon}).addTo(map);
      map.invalidateSize();
    }catch(e){ container.remove(); resolve(null); return; }
    // Kurze Wartezeit, damit die Kartenkacheln laden können, bevor der Screenshot gemacht wird
    setTimeout(async ()=>{
      let dataUrl = null;
      try{ const canvas = await html2canvas(container, {useCORS:true, allowTaint:true, logging:false}); dataUrl = canvas.toDataURL("image/png"); }
      catch(e){ dataUrl = null; }
      map.remove(); container.remove();
      resolve(dataUrl);
    }, 1300);
  });
}

// Bilder im Browser auf max. 1100px Kantenlänge herunterskalieren (spart Upload-Zeit)
// Gibt bei Erfolg das verkleinerte Blob zurück, bei nicht dekodierbarem Format (z. B. HEIC-Fotos
// vom iPhone, die die meisten Desktop-Browser nicht direkt anzeigen können) null -- damit ein
// solches Bild NICHT unsichtbar/kaputt im Modell landet, sondern der Nutzer eine klare Rückmeldung
// bekommt, statt dass es erst nach dem Speichern/Neuladen "verschwindet".
function resizeImageFile(file, maxDim){
  return new Promise((resolve)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let {width, height} = img;
      const scale = Math.min(1, maxDim / Math.max(width, height));
      width = Math.round(width*scale); height = Math.round(height*scale);
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=> resolve(blob || null), "image/jpeg", 0.85);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

function buildImageGallery(node){
  node.images = node.images || [];

  const label = document.createElement("label"); label.textContent = t("imagesLabel");
  wrap.appendChild(label);

  const grid = document.createElement("div"); grid.className = "image-gallery";

    grid.innerHTML = "";
    node.images.forEach((src, idx)=>{
      const thumb = document.createElement("div"); thumb.className = "image-thumb";
      const img = document.createElement("img"); img.src = src;
      img.addEventListener("click", ()=> openImageLightbox(node, idx));
      const del = document.createElement("button"); del.className = "image-thumb-del"; del.textContent = "×";
      del.title = t("removeImage");
      del.addEventListener("click", (ev)=>{
        ev.stopPropagation();
        node.images.splice(idx,1); markDirty(); renderThumbs();
      });
      thumb.appendChild(img); thumb.appendChild(del);
      grid.appendChild(thumb);
    });
    const addBtn = document.createElement("button"); addBtn.className = "image-thumb image-add-btn"; addBtn.type="button";
    addBtn.innerHTML = "＋"; addBtn.title = t("addImage");
    addBtn.addEventListener("click", ()=>{
      const input = document.createElement("input");
      input.type = "file"; input.accept = "image/*"; input.multiple = true; input.style.display="none";
      input.addEventListener("change", async ()=>{
        const files = Array.from(input.files||[]);
        if(!files.length) return;
        toast(t("imagesProcessing"));
        let failedCount = 0;
        for(const file of files){
          try{
            const resized = await resizeImageFile(file, 900);
            if(!resized){ failedCount++; continue; } // nicht dekodierbares Format, z. B. HEIC -- überspringen statt kaputt zu speichern
            const dataUrl = await fileToDataURL(resized);
            node.images.push(dataUrl);
          }catch(e){ failedCount++; }
        }
        markDirty(); renderThumbs();
        if(failedCount>0) toast(t("imageFormatUnsupported").replace("{n}", failedCount));
      });
      document.body.appendChild(input); input.click();
      setTimeout(()=>input.remove(), 5000);
    });
    grid.appendChild(addBtn);
  }
  renderThumbs();
  wrap.appendChild(grid);
  return wrap;
}

async function callClaudeVision(apiKey, base64Image, mediaType){
  const prompt = t("photoScanPrompt");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5-20251001",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [
          { type:"image", source:{ type:"base64", media_type: mediaType, data: base64Image } },
          { type:"text", text: prompt }
        ]
      }]
    })
  });
  const data = await res.json().catch(()=>null);
  if(!res.ok){
    const msg = data && data.error && data.error.message ? data.error.message : ("HTTP "+res.status);
    throw new Error(msg);
  }
  const textPart = (data.content||[]).find(b=>b.type==="text");
  return textPart ? textPart.text : "";
}

function parsePhotoScanJson(raw){
  let cleaned = raw.trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
  const start = cleaned.indexOf("{"), end = cleaned.lastIndexOf("}");
  if(start>=0 && end>start) cleaned = cleaned.slice(start, end+1);
  return JSON.parse(cleaned);
}

function buildModelFromPhotoScan(scan, geoCoords){
  const baseX = (state.nodes.reduce((m,n)=>Math.max(m,n.pos2d.x),0)) + 400;
  const roomNode = addNodeQuick("raum", scan.raum || t("photoRoomDefaultName"), {
    nutzung: scan.raumnutzung || "", kontakt: t("photoScanSourceNote")
  }, baseX, 0, geoCoords);
  const surfaceNode = addNodeQuick("gegenstand", scan.oberflaeche || t("photoSurfaceDefaultName"), {
    kontakt: t("photoScanSourceNote")
  }, baseX, 260, geoCoords);
  addEdgeQuick(surfaceNode, roomNode, t("photoRelBefindetSichIn"));
  const items = Array.isArray(scan.objekte) ? scan.objekte : [];
  const NI = Math.max(items.length,1);
  items.forEach((it, i)=>{
    const angle = (i/NI) * 2*Math.PI;
    const x = surfaceNode.pos2d.x + 220*Math.cos(angle);
    const y = surfaceNode.pos2d.y + 220*Math.sin(angle) + 260;
    const itemNode = addNodeQuick("gegenstand", it.name || "Objekt", {
      material: it.material || "", farbe: it.farbe || "",
      anzahl: it.anzahl ? String(it.anzahl) : "", kontakt: it.beschreibung || t("photoScanSourceNote")
    }, x, y, geoCoords);
    addEdgeQuick(itemNode, surfaceNode, t("photoRelBefindetSichAuf"));
  });
  return items.length;
}
function addNodeQuick(cls, name, paramsPlain, x, y, geoCoords){
  const params = {};
  Object.entries(paramsPlain).forEach(([k,v])=>{ if(v) params[k] = {de:v, en:v}; });
  const n = { id:uid("obj"), class:cls, name, params, group: state.nodes[0]?state.nodes[0].group:"A",
              pos2d:{x,y}, pos3d:{x,y,z:0}, pinned2d:false, pinned3d:false, createdAt: nowAsDatetimeLocalString() };
  if(geoCoords){ n.lat = geoCoords.lat; n.lon = geoCoords.lon; }
  state.nodes.push(n);
  return n;
}
function addEdgeQuick(a,b,rolle){
  state.edges.push({ id:uid("edge"), from:a.id, to:b.id, rolle:{de:rolle,en:rolle}, kontakt:{de:"",en:""} });
}
// Holt den aktuellen Gerätestandort, ohne bei Fehlschlag/Ablehnung den Foto-Workflow zu unterbrechen
function getCurrentLocationSafe(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos)=> resolve({ lat: pos.coords.latitude.toFixed(6), lon: pos.coords.longitude.toFixed(6) }),
      ()=> resolve(null),
      { enableHighAccuracy:true, timeout:8000 }
    );
  });
}

async function runPhotoScan(file){
  const apiKey = getPhotoApiKey();
  if(!apiKey){ showPhotoKeyPrompt(()=>runPhotoScan(file)); return; }
  toast(t("photoScanAnalyzing"));
  try{
    const resizedBlob = await resizeImageFile(file, 1100);
    if(!resizedBlob){ toast(t("imageFormatUnsupportedSingle")); return; }
    const base64 = await fileToBase64(resizedBlob);
    // Bei eingeschaltetem GEO-Modus wird versucht, den aktuellen Gerätestandort zu ermitteln und
    // allen aus dem Foto erzeugten Objekten (Raum, Oberfläche, Gegenstände) mitzugeben.
    const geoCoords = geoMode ? await getCurrentLocationSafe() : null;
    const rawText = await callClaudeVision(apiKey, base64, "image/jpeg");
    const scan = parsePhotoScanJson(rawText);
    const count = buildModelFromPhotoScan(scan, geoCoords);
    layout2D(); layout3D(); markDirty(); renderAll();
    let msg = t("photoScanDone").replace("{n}", count);
    if(geoCoords) msg += " " + t("photoScanGeoApplied");
    toast(msg);
  }catch(err){
    console.error(err);
    toast(t("photoScanError")+(err && err.message ? err.message : "?"));
  }
}

function serializeClassesForAI(){
  const lines = ["GÜLTIGE KLASSEN (Key: Feld-Keys):"];
  Object.entries(CLASSES).forEach(([key,c])=>{
