function serializeModelForAI(){
  const lines = [];
  lines.push(`Modellname: ${state.modelName}`);
  lines.push(`Anzahl Objekte: ${state.nodes.length}, Anzahl Beziehungen: ${state.edges.length}`);
  lines.push(""); lines.push("OBJEKTE (Name (Klasse): Felder):");
  const maxNodes = 2000;
  state.nodes.slice(0,maxNodes).forEach(n=>{
    const cls = CLASSES[n.class];
    const clsLabel = cls ? cls.label : n.class;
    const fieldsTxt = Object.entries(n.params||{}).map(([k,v])=>{
      const fdef = cls && cls.fields ? cls.fields.find(f=>f.key===k) : null;
      const label = fdef ? fdef.label : k;
      const val = v && v.de ? v.de : (v && v.en ? v.en : "");
      return val ? `${label}: ${val}` : null;
    }).filter(Boolean).join("; ");
    lines.push(`- "${n.name}" (${n.class}/${clsLabel})${fieldsTxt ? " — "+fieldsTxt : ""}`);
  });
  if(state.nodes.length>maxNodes) lines.push(`... (${state.nodes.length-maxNodes} weitere Objekte gekürzt)`);
  lines.push(""); lines.push("BEZIEHUNGEN:");
  const maxEdges = 2500;
  state.edges.slice(0,maxEdges).forEach(e=>{
    const fromN = state.nodes.find(n=>n.id===e.from), toN = state.nodes.find(n=>n.id===e.to);
    if(!fromN||!toN) return;
    const rolle = e.rolle && e.rolle.de ? e.rolle.de : "";
    lines.push(`- "${fromN.name}" --${rolle}--> "${toN.name}"`);
  });
  if(state.edges.length>maxEdges) lines.push(`... (${state.edges.length-maxEdges} weitere Beziehungen gekürzt)`);
  return lines.join("\n");
}

async function callClaudeOnce(apiKey, systemPrompt, messages){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json", "x-api-key": apiKey,
      "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"
    },
    // Web-Suche aktiviert: damit kann die KI GPS-Koordinaten (bevorzugt wie bei Google Maps/anderen
    // Kartendiensten hinterlegt) tatsächlich nachschlagen, statt sie nur aus dem Training zu schätzen.
    body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:8192, system:systemPrompt, messages,
      tools:[{ type:"web_search_20250305", name:"web_search" }] })
  });
  const data = await res.json().catch(()=>null);
  if(!res.ok){
    const msg = data && data.error && data.error.message ? data.error.message : ("HTTP "+res.status);
    throw new Error(msg);
  }
  // Alle Text-Blöcke zusammenführen (bei genutzter Web-Suche können mehrere Text-/Tool-Blöcke
  // ineinander verschachtelt sein, nicht nur ein einzelner)
  const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  return { text, stopReason: data.stop_reason, content: data.content||[] };
}
// Ruft die API auf und setzt eine abgeschnittene Antwort automatisch fort (Anthropic-Prefill-Technik:
// der bisherige Text wird als eigener "assistant"-Turn angehängt, Claude schreibt exakt dort weiter),
// bis das JSON vollständig ist -- damit wird das Modell bei größeren Antworten nie mitten im JSON
// abgeschnitten, egal wie viele Objekte/Beziehungen erzeugt werden.
async function callClaudeText(apiKey, systemPrompt, baseMessages){
  let combinedText = "";
  let priorBlocks = []; // bisher erhaltene Antwort-Blöcke (Text sowie Web-Such-Blöcke)
  const MAX_CONTINUATIONS = 6;
  for(let i=0; i<=MAX_CONTINUATIONS; i++){
    let messages = baseMessages;
    if(priorBlocks.length){
      // Fortsetzung: bisherige Blöcke als angefangene Assistenten-Antwort mitschicken.
      // Die API lehnt eine angefangene Antwort ab, die auf Leerzeichen/Zeilenumbruch endet --
      // daher am letzten Textblock abschneiden.
      const blocks = priorBlocks.map(b=>({...b}));
      const last = blocks[blocks.length-1];
      if(last && last.type==="text"){ last.text = last.text.replace(/\s+$/,""); if(!last.text) blocks.pop(); }
      if(blocks.length) messages = [...baseMessages, {role:"assistant", content: blocks}];
    }
    let res;
    try{ res = await callClaudeOnce(apiKey, systemPrompt, messages); }
    catch(err){
      if(i===0) throw err; // erster Aufruf fehlgeschlagen -> echter Fehler
      break;               // Fortsetzung fehlgeschlagen -> bisherigen Stand verwenden statt alles zu verwerfen
    }
    combinedText += res.text;
    priorBlocks = priorBlocks.concat(res.content);
    // max_tokens: Antwort abgeschnitten; pause_turn: Web-Suche hat pausiert -- in beiden Fällen weitermachen
    if(res.stopReason !== "max_tokens" && res.stopReason !== "pause_turn") break;
  }
  return combinedText;
}

function extractActionFromResponse(raw){
  let action = null;
  let matchedBlock = null; // der Roh-Codeblock-Inhalt, der als Aktion geparst wurde (für Anzeige-Bereinigung)
  // 1) Bevorzugt einen ```json-Block suchen
  let m = raw.match(/```json\s*([\s\S]*?)```/i);
  if(m){ try{ action = JSON.parse(m[1]); matchedBlock = m[0]; }catch(e){ action = null; } }
  // 2) Sonst irgendeinen Codeblock, der sich als JSON parsen lässt
  if(!action){
    const generic = [...raw.matchAll(/```[a-z]*\s*([\s\S]*?)```/gi)];
    for(const g of generic){
      try{ action = JSON.parse(g[1]); matchedBlock = g[0]; break; }catch(e){}
    }
  }
  // 3) Sonst prüfen, ob die GESAMTE Antwort nur JSON ist (kein Codeblock, kein Fließtext)
  let wholeResponseIsJson = false;
  if(!action){
    const trimmed = raw.trim();
    if(trimmed.startsWith("{") && trimmed.endsWith("}")){
      try{ action = JSON.parse(trimmed); wholeResponseIsJson = true; }catch(e){ action = null; }
    }
  }
  // Anzeige-Text: IMMER jeden Codeblock entfernen -- egal ob er als Aktion erkannt wurde oder nicht,
  // damit niemals rohes JSON im Chat sichtbar wird.
  let displayText = raw.replace(/```[a-z]*\s*[\s\S]*?```/gi, "").trim();
  if(wholeResponseIsJson) displayText = ""; // die gesamte Antwort war die Aktion selbst, kein separater Text
  return { text: displayText || t("aiChatDone"), action };
}

function applyAiFocus(names){
  const found = [];
  (names||[]).forEach(name=>{
    const n = state.nodes.find(x=>x.name.trim().toLowerCase()===(name||"").trim().toLowerCase());
    if(n && !found.includes(n)) found.push(n);
  });
  if(!found.length) return 0;
  focusAndCenterNode(found[0]);
  hopIdx = Math.max(hopIdx, 3); // mind. Ebene "3", damit mehrere genannte Objekte eher mit sichtbar sind
  updateHopUI();
  found.slice(1).forEach(n=> expandedNodes.add(n.id));
  renderAll();
  return found.length;
}

function applyAiActions(action){
  const findExisting = (name)=> state.nodes.find(n=>n.name.trim().toLowerCase()===(name||"").trim().toLowerCase());
  const createdHere = {};
  const created = [];
  let geoCount = 0;
  (action.add_nodes||[]).forEach(spec=>{
    if(!spec || !spec.name) return;
    const key = spec.name.trim().toLowerCase();
    if(findExisting(spec.name) || createdHere[key]) return;
    const cls = CLASSES[spec.class] ? spec.class : "neutral";
    const params = {};
    Object.entries(spec.params||{}).forEach(([k,v])=>{ if(v) params[k] = {de:String(v), en:String(v)}; });
    if(!params.bemerkung) params.bemerkung = {de:t("aiChatGeneratedNote"), en:t("aiChatGeneratedNote")};
    const lastX = state.nodes.length ? state.nodes[state.nodes.length-1].pos2d.x : 0;
    const n = { id:uid("obj"), class:cls, name:spec.name, params, group: state.nodes[0]?state.nodes[0].group:"A",
                pos2d:{x:lastX+220,y:(Math.random()-.5)*160}, pos3d:{x:lastX+220,y:(Math.random()-.5)*160,z:(Math.random()-.5)*160},
                pinned2d:false, pinned3d:false, createdAt: nowAsDatetimeLocalString() };
    // GPS-Koordinaten der KI übernehmen, sofern gültig (siehe System-Prompt: die KI soll dies für
    // geografisch verortbare Objekte von sich aus versuchen und mitliefern)
    const latNum = parseFloat(spec.lat), lonNum = parseFloat(spec.lon);
    if(!isNaN(latNum) && !isNaN(lonNum) && latNum>=-90 && latNum<=90 && lonNum>=-180 && lonNum<=180){
      n.lat = String(latNum); n.lon = String(lonNum); geoCount++;
    }
    state.nodes.push(n);
    createdHere[key] = n;
    created.push(n);
  });
  const resolve = (name)=> createdHere[(name||"").trim().toLowerCase()] || findExisting(name);
  let edgeCount = 0;
  (action.add_edges||[]).forEach(spec=>{
    if(!spec) return;
    const a = resolve(spec.from), b = resolve(spec.to);
    if(a && b && a.id!==b.id){
      state.edges.push({ id:uid("edge"), from:a.id, to:b.id, rolle:{de:spec.rolle||"",en:spec.rolle||""}, kontakt:{de:spec.kontakt||"",en:spec.kontakt||""} });
      edgeCount++;
    }
  });
  // Werte an BEREITS BESTEHENDEN Objekten aktualisieren (z. B. wenn die KI zu einer Frage wie
  // "Recherchiere die Telefonnummer von X" eine Antwort findet -- ohne update_nodes würde das
  // Ergebnis nur im Chat stehen, aber nie im Objekt selbst landen).
  let updatedCount = 0;
  (action.update_nodes||[]).forEach(spec=>{
    if(!spec || !spec.name) return;
    const target = resolve(spec.name);
    if(!target) return;
    let changed = false;
    Object.entries(spec.params||{}).forEach(([k,v])=>{
      if(v===undefined || v===null || v==="") return;
      target.params = target.params || {};
      target.params[k] = { de:String(v), en:String(v) };
      changed = true;
    });
    const latNum = parseFloat(spec.lat), lonNum = parseFloat(spec.lon);
    if(!isNaN(latNum) && !isNaN(lonNum) && latNum>=-90 && latNum<=90 && lonNum>=-180 && lonNum<=180){
      target.lat = String(latNum); target.lon = String(lonNum); changed = true;
    }
    if(changed) updatedCount++;
  });
  if(created.length || edgeCount || updatedCount){ layout2D(); layout3D(); markDirty(); }
  return { nodes: created.length, edges: edgeCount, geo: geoCount, updated: updatedCount, firstNode: created[0] };
}

function linkifyChatText(text){
  const names = state.nodes.map(n=>({id:n.id, name:n.name})).filter(n=>n.name && n.name.trim().length>1)
    .sort((a,b)=>b.name.length-a.name.length);
  const isWordChar = c => c!==undefined && /[\wÄÖÜäöüß]/.test(c);
  let result = "", i = 0;
  outer:
  while(i < text.length){
    for(const n of names){
      if(text.startsWith(n.name, i)){
        const before = text[i-1], after = text[i+n.name.length];
        if(!isWordChar(before) && !isWordChar(after)){
          result += `<span class="ai-ref" data-id="${n.id}">${escapeHtml(n.name)}</span>`;
          i += n.name.length; continue outer;
        }
      }
    }
    result += escapeHtml(text[i]); i++;
  }
  return result;
}

async function sendAiChatMessage(){
  const input = document.getElementById("aiChatInput");
  const question = input.value.trim();
  if(!question) return;
  const apiKey = getPhotoApiKey();
  if(!apiKey){ showPhotoKeyPrompt(()=>{ input.value = question; sendAiChatMessage(); }); return; }
  input.value = "";
  appendChatMessage("user", question);
  aiChatHistory.push({role:"user", content: question});
  const thinkingId = appendChatMessage("assistant", t("aiChatThinking"), true);
  const systemPrompt = t("aiChatSystemPrompt") + "\n\n" + serializeClassesForAI() + "\n\n" + serializeModelForAI();
  try{
    const raw = await callClaudeText(apiKey, systemPrompt, aiChatHistory);
    const { text, action } = extractActionFromResponse(raw);
    let finalText = text;
    if(action){
      const res = applyAiActions(action);
      if(res.nodes || res.edges || res.updated){
        if(res.nodes || res.edges) finalText += "\n\n" + t("aiChatApplied").replace("{nodes}", res.nodes).replace("{edges}", res.edges);
        if(res.updated>0) finalText += (res.nodes||res.edges?" ":"\n\n") + t("aiChatUpdated").replace("{n}", res.updated);
        if(res.geo>0) finalText += " " + t("aiChatGeoApplied").replace("{n}", res.geo);
        renderInspector(); renderAll();
      }
      if(Array.isArray(action.focus) && action.focus.length){
        const n = applyAiFocus(action.focus);
        if(n) finalText += "\n\n" + t("aiChatFocused").replace("{n}", n);
      }
    }
    updateChatMessage(thinkingId, finalText, true);
    // Leere Antworten nicht speichern (die API lehnt leere Nachrichten im Verlauf ab);
    // stattdessen die unbeantwortete Frage entfernen, damit Frage/Antwort paarweise bleiben
    if(raw && raw.trim()) aiChatHistory.push({role:"assistant", content: raw});
    else aiChatHistory.pop();
    if(aiChatHistory.length>12) aiChatHistory = aiChatHistory.slice(-12);
  }catch(err){
    aiChatHistory.pop(); // fehlgeschlagene Frage nicht im Verlauf lassen
    updateChatMessage(thinkingId, t("aiChatError")+(err && err.message ? err.message : "?"), false);
  }
}

function normalizeText(s){ return s.toLowerCase().replace(/[^a-zäöüß0-9]+/g," ").trim(); }
function matchClassBySpeech(spokenText){
  const spoken = normalizeText(spokenText);
  let best=null, bestScore=0;
  Object.entries(CLASSES).forEach(([key,c])=>{
    if(key==="neutral") return;
    [c.label, c.labelEn].filter(Boolean).forEach(rawLabel=>{
      const label = normalizeText(rawLabel);
      let score = 0;
      if(spoken===label) score = 100;
      else if(spoken.includes(label) || label.includes(spoken)) score = 80;
      else {
        const words = label.split(" ").filter(w=>w.length>2);
        if(words.some(w=>spoken.includes(w))) score = 50;
      }
      if(score>bestScore){ bestScore=score; best=key; }
    });
  });
  return bestScore>0 ? best : null;
}

/* Zweisprachige Werte: jedes Merkmal (außer dem Namen) wird als {de,en}
   abgelegt. Alte, einfache Textwerte werden beim ersten Zugriff automatisch
   migriert (als Wert der zuvor genutzten Sprache, meist Deutsch). */
function getBilingual(obj, key){
  if(!obj[key] || typeof obj[key] !== "object"){
    obj[key] = { de: (typeof obj[key]==="string" ? obj[key] : ""), en:"" };
  }
  return obj[key];
}
function getBiValue(obj, key){ return getBilingual(obj,key)[lang] || ""; }
function setBiValue(obj, key, val){ getBilingual(obj,key)[lang] = val; }

function renderInspector(){

  const node = state.nodes.find(n=>n.id===selectedNodeId);
  if(!node){ box.innerHTML = `<h2>${t("objectHeader")}</h2><div class="empty">${t("emptyInspector")}</div>`; return; }
  const cls = CLASSES[node.class];

  // Datum & Zeit: universell für jedes Objekt, wird bei Erzeugung automatisch befüllt

  // GPS-Koordinaten: universell für jedes Objekt, für die GEO-Karten-/Globusansicht

  box.appendChild(fieldRow(t("latLabel"), node.lat, (val)=>{ node.lat=val.trim(); refreshNavBtn(); renderAll(); }));

  // Bilder: universell für jedes Objekt, mehrere pro Objekt möglich (Galerie), direkt im

    const wrap = document.createElement("div");

    // Cluster-Vorauswahl: filtert, welche Gruppen/Klassen im Dropdown erscheinen

    clusterSelect.value = lastSelectedCluster;
    clusterRow.appendChild(clusterLabelEl); clusterRow.appendChild(clusterSelect);
    box.appendChild(clusterRow);

    const row = document.createElement("div"); row.className="field-row";
    const select = document.createElement("select");

      select.innerHTML = Object.entries(GROUPS).filter(([,g])=>g.cluster===clusterKey).map(([gKey,g])=>{
        const opts = Object.entries(CLASSES).filter(([,c])=>c.group===gKey)
          .map(([k,c])=>`<option value="${k}">${c.icon} ${classLabel(k)}</option>`).join("");
        return `<optgroup label="${g.icon} ${groupLabel(gKey)}">${opts}</optgroup>`;
      }).join("");

    buildClassOptions(lastSelectedCluster);

    const assignBtn = document.createElement("button"); assignBtn.className="btn primary"; assignBtn.textContent=t("assign");

    const tagTxt = e.from===node.id ? t("parentTag") : t("childTag");
    top.innerHTML = `<span>${CLASSES[other.class].icon} ${other.name} <span class="tag">${tagTxt}</span></span>`;
    const x = document.createElement("button"); x.className="small-x"; x.textContent="✕";
    x.addEventListener("click",()=>deleteEdge(e.id));
    top.appendChild(x);

    // Rolle/Kontakt beziehen sich auf DIESE konkrete Beziehung, nicht auf das Objekt allgemein
    const relFields = document.createElement("div"); relFields.style.marginTop="6px"; relFields.style.display="flex"; relFields.style.flexDirection="column"; relFields.style.gap="4px";
    relFields.appendChild(edgeFieldRow(t("roleTowards")+other.name, e, "rolle"));
    relFields.appendChild(edgeFieldRow(t("contactForRel"), e, "kontakt"));
    li.appendChild(relFields);
    list.appendChild(li);
  });
  if(!relatedEdges.length){
    const li = document.createElement("li"); li.innerHTML=`<span style='color:var(--ink-soft)'>${t("noConnections")}</span>`;
    list.appendChild(li);
  }
  box.appendChild(list);
  const relHint = document.createElement("div"); relHint.className="hint";
  relHint.textContent = t("relationshipHint");

  const delBtn = document.createElement("button"); delBtn.className="btn danger"; delBtn.textContent=t("deleteObject"); delBtn.style.width="100%";
  delBtn.addEventListener("click",()=>{ if(confirm(t("confirmDeleteObject"))) deleteObject(node); });
  box.appendChild(delBtn);

function edgeFieldRow(labelText, edge, key){
  const row = document.createElement("div"); row.className="field-row"; row.style.gap="4px";

  input.style.fontSize="11px"; input.style.padding="5px 7px"; input.value = getBiValue(edge,key);

  attachMic(mic,(spokenText)=>{ input.value=spokenText; setBiValue(edge,key,spokenText); markDirty(); });
  row.appendChild(input); row.appendChild(mic);
  return row;
}
function bilingualFieldRow(labelText, obj, key){
  const wrap = document.createElement("div"); wrap.className="field";
  const label = document.createElement("label"); label.textContent = labelText+" · "+lang.toUpperCase();
  const row = document.createElement("div"); row.className="field-row";
  const input = document.createElement("input"); input.type="text"; input.value = getBiValue(obj,key);
  input.addEventListener("input",()=>{ setBiValue(obj,key,input.value); markDirty(); });
  row.appendChild(input);
  const mic = document.createElement("button"); mic.className="mic"; mic.textContent="🎤";
  attachMic(mic,(spokenText)=>{ input.value=spokenText; setBiValue(obj,key,spokenText); markDirty(); });
  row.appendChild(mic);
  wrap.appendChild(label); wrap.appendChild(row);
  return wrap;
}
function fieldRow(labelText, value, onChange, withMic){
  const wrap = document.createElement("div"); wrap.className="field";
  const label = document.createElement("label"); label.textContent = labelText;
  const row = document.createElement("div"); row.className="field-row";
  const input = document.createElement("input"); input.type="text"; input.value=value||"";
  input.addEventListener("input",()=>{ onChange(input.value); markDirty(); });
  row.appendChild(input);
  if(withMic){
    const mic = document.createElement("button"); mic.className="mic"; mic.textContent="🎤";
    attachMic(mic,(spokenText)=>{ input.value=spokenText; onChange(spokenText); markDirty(); });
    row.appendChild(mic);
  }
  wrap.appendChild(label); wrap.appendChild(row);
  return wrap;
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")||"modell"; }

// Zugriffsschicht für gespeicherte Modelle: IndexedDB (Browser-Datenbank mit viel Platz,
// typischerweise hunderte MB) statt localStorage (meist nur ca. 5 MB für ALLE Modelle zusammen --
// dort gingen bei vollem Speicher die eingebetteten Bilder verloren). Ist IndexedDB nicht nutzbar
// (z. B. manche Browser bei lokal geöffneten Dateien), wird auf localStorage zurückgegriffen.
const IDB_NAME = "join-db", IDB_STORE = "kv";
let idbPromise = null;
function openIdb(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve)=>{
    try{
      if(!window.indexedDB){ resolve(null); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> resolve(null);
      req.onblocked = ()=> resolve(null);
    }catch(e){ resolve(null); }
  });
  return idbPromise;
}
function idbRequest(db, mode, fn){
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, mode);
    const req = fn(tx.objectStore(IDB_STORE));
    tx.oncomplete = ()=> resolve(req ? req.result : undefined);
    tx.onerror = ()=> reject(tx.error || new Error("IndexedDB-Fehler"));
    tx.onabort = ()=> reject(tx.error || new Error("IndexedDB abgebrochen (evtl. Speicher voll)"));
  });
}
async function storageSet(key, value){
  const db = await openIdb();
  if(db){
    await idbRequest(db, "readwrite", st=> st.put(value, key));
    // Veraltete Kopie im alten Speicher entfernen (gibt dort Platz frei, vermeidet Doppelungen)
    try{ localStorage.removeItem(key); }catch(e){}
    return {key, value, shared:false};
  }
  localStorage.setItem(key, value);
  return {key, value, shared:false};
}
async function storageGet(key){
  const db = await openIdb();
  if(db){
    const v = await idbRequest(db, "readonly", st=> st.get(key));
    if(v!==undefined && v!==null) return {key, value:v, shared:false};
  }
  let lv = null; try{ lv = localStorage.getItem(key); }catch(e){}
  if(lv!==null) return {key, value:lv, shared:false};
  throw new Error(key);
}
async function storageList(prefix){
  const keys = new Set();
  const db = await openIdb();
  if(db){
    const all = await idbRequest(db, "readonly", st=> st.getAllKeys());
    (all||[]).forEach(k=>{ if(typeof k==="string" && k.indexOf(prefix)===0) keys.add(k); });
  }
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(prefix)===0) keys.add(k);
    }
  }catch(e){}
  return { keys:[...keys] };
}
// Einmalige Übernahme bereits in localStorage gespeicherter Modelle in die IndexedDB
async function migrateLocalStorageToIdb(){
  const db = await openIdb();
  if(!db) return;
  const legacy = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && (k.indexOf("model:")===0 || k===LAST_MODEL_KEY)) legacy.push(k);
    }
  }catch(e){ return; }
  for(const k of legacy){
    try{
      const existing = await idbRequest(db, "readonly", st=> st.get(k));
      if(existing===undefined) await idbRequest(db, "readwrite", st=> st.put(localStorage.getItem(k), k));
      localStorage.removeItem(k);
    }catch(e){ console.error("Übernahme in IndexedDB fehlgeschlagen für", k, e); }
  }
  // Browser bitten, die Daten nicht bei Speicherknappheit automatisch zu löschen
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}

// Schlüssel für das "zuletzt aktive Modell" -- bewusst OHNE "model:"-Präfix, damit dieser
// Eintrag nicht fälschlich in der "Öffnen"-Liste (storageList("model:")) auftaucht.
const LAST_MODEL_KEY = "lastActiveModelKey";
async function saveCurrentModel(name){
  const id = state.modelId || (slug(name)+"-"+Date.now());
  state.modelId = id; state.modelName = name;
  // Download ZUERST auslösen, bevor irgendein "await" durchlaufen wird: mobile Browser (u. a.
  // Safari/iOS) blockieren einen Download, sobald die Nutzeraktion "verbraucht" ist. Ein Fehler beim
  // Download darf außerdem nicht das eigentliche Speichern als gescheitert melden.
  let filename = null, downloadError = null;
  try{ filename = downloadCurrentModelAsFile(); }
  catch(err){ downloadError = err; console.error("Datei-Download beim Speichern fehlgeschlagen:", err); }

  const payload = { name, nodes: state.nodes, edges: state.edges, savedAt: Date.now() };
  // Notlösung nur, falls selbst die Browser-Datenbank voll ist bzw. nur localStorage verfügbar ist:
  // dann ohne Bilder ablegen -- die vollständige Fassung steckt in der heruntergeladenen Datei.
  let json = JSON.stringify(payload), imagesStripped = false;
  const trySet = async (value)=>{ await storageSet("model:"+id, value); };
  try{
    try{ await trySet(json); }
    catch(quotaErr){
      const slim = { ...payload, nodes: payload.nodes.map(n=>{ const c={...n}; delete c.images; return c; }) };
      await trySet(JSON.stringify(slim)); imagesStripped = true;
    }
    state.dirty = false;
    document.getElementById("modelNameLabel").textContent = name;
    try{ await storageSet(LAST_MODEL_KEY, "model:"+id); }catch(e){ /* nicht kritisch */ }
    let msg = downloadError ? (t("savedLocally")+" "+t("downloadFailedHint")) : t("savedAndDownloaded").replace("{file}", filename);
    if(imagesStripped) msg += " " + t("savedWithoutImagesHint");
    toast(msg);
  }catch(err){
    toast(t("saveFailed")+(err && err.message ? err.message : "?")+t("saveFailedHint"));
    console.error("Speichern fehlgeschlagen:", err);
  }
}
async function listSavedModels(){
  try{
    const res = await storageList("model:");
    if(!res || !res.keys) return [];
    const items = [];
    for(const k of res.keys){
      try{
        const r = await storageGet(k);
        if(r){ const data = JSON.parse(r.value); items.push({key:k, name:data.name, savedAt:data.savedAt, count:(data.nodes||[]).length}); }
      }catch(e){}
    }
    items.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
    return items;
  }catch(err){ console.error(err); return []; }
}
async function loadModel(key){
  try{
    const r = await storageGet(key);
    if(!r) return;
    try{ await storageSet(LAST_MODEL_KEY, key); }catch(e){ /* nicht kritisch für den Ladevorgang selbst */ }
    const data = JSON.parse(r.value);
    state = { modelId:key.replace("model:",""), modelName:data.name, nodes:data.nodes, edges:data.edges, dirty:false };
    state.nodes.forEach(n=>{ n.pos2d = n.pos2d||{x:0,y:0}; n.pos3d = n.pos3d||{x:0,y:0,z:0}; n.group = n.group||"A"; n.params = n.params||{}; });
    state.edges.forEach(e=>{ if(e.rolle===undefined) e.rolle={de:"",en:""}; if(e.kontakt===undefined) e.kontakt={de:"",en:""}; });
    selectedNodeId=null; focusNodeId=null; selectedEdgeId=null; expandedNodes = new Set();
    const isLarge = applyLargeModelDefaultView();
    layout2D(); layout3D();
    document.getElementById("modelNameLabel").textContent = data.name;
    renderInspector(); renderAll();
    toast(isLarge ? t("modelLoadedLargeHint").replace("{name}", data.name).replace("{n}", state.nodes.length) : t("modelLoaded")+data.name);
  }catch(err){ toast(t("loadFailed")+(err && err.message ? err.message : "?")); console.error(err); }
}
function remapAndImport(data, sameGroup){
  const idMap = {};
  const newGroup = sameGroup ? (state.nodes[0]?state.nodes[0].group:"A") : uid("grp");
  let mergedCount = 0;
  data.nodes.forEach(n=>{
    let targetNode = null;
    if(sameGroup){
      // Objekte mit gleichem Namen UND gleicher Klasse gelten als dasselbe Objekt
      targetNode = state.nodes.find(existing=>
        existing.class===n.class && existing.name.trim().toLowerCase()===n.name.trim().toLowerCase()
      );
    }
    if(targetNode){
      idMap[n.id] = targetNode.id;
      const cls = CLASSES[targetNode.class];
      const fieldKeys = new Set([...(cls && cls.fields ? cls.fields.map(f=>f.key) : []), ...Object.keys(n.params||{}), "bemerkung"]);
      const conflictNotes = [];
      fieldKeys.forEach(key=>{
        if(key==="bemerkung") return; // wird separat zusammengeführt
        const incoming = (n.params||{})[key];
        const incomingVal = incoming ? (incoming.de || incoming.en || "") : "";
        if(!incomingVal) return;
        targetNode.params[key] = targetNode.params[key] || {de:"",en:""};
        const existingVal = targetNode.params[key].de || targetNode.params[key].en || "";
        if(!existingVal){
          targetNode.params[key] = { de: incoming.de || incomingVal, en: incoming.en || incomingVal };
        } else if(existingVal.trim() !== incomingVal.trim()){
          const fdef = cls && cls.fields ? cls.fields.find(f=>f.key===key) : null;
          const label = fdef ? fdef.label : key;
          conflictNotes.push(`${label}: "${incomingVal}" (übernommen wurde "${existingVal}")`);
        }
      });
      // Bemerkungen beider Objekte sowie ggf. Konflikthinweise zusammenführen
      const incomingRemark = (n.params||{}).bemerkung ? ((n.params.bemerkung.de || n.params.bemerkung.en || "")) : "";
      targetNode.params.bemerkung = targetNode.params.bemerkung || {de:"",en:""};
      const existingRemark = targetNode.params.bemerkung.de || targetNode.params.bemerkung.en || "";
      const pieces = [existingRemark];
      if(incomingRemark && incomingRemark.trim() !== existingRemark.trim()) pieces.push(incomingRemark);
      if(conflictNotes.length) pieces.push(t("mergeConflictNote").replace("{model}", data.name||"") + " " + conflictNotes.join("; "));
      const combined = pieces.filter(Boolean).join(" | ");
      targetNode.params.bemerkung = { de: combined, en: combined };
      // Bilder beider Objekte zusammenführen (keine Bilder verlieren)
      if(Array.isArray(n.images) && n.images.length){
        targetNode.images = targetNode.images || [];
        n.images.forEach(src=>{ if(!targetNode.images.includes(src)) targetNode.images.push(src); });
      }
      // GPS-Koordinaten übernehmen, falls das Zielobjekt noch keine hat
      if(!nodeLatLon(targetNode) && n.lat && n.lon){ targetNode.lat = n.lat; targetNode.lon = n.lon; }
      mergedCount++;
    } else {
      const newId = uid("obj");
      idMap[n.id]=newId;
      const paramsCopy = JSON.parse(JSON.stringify(n.params||{}));
      paramsCopy.bemerkung = paramsCopy.bemerkung || {de:"",en:""};
      state.nodes.push(Object.assign({},n,{id:newId, group:newGroup, params: paramsCopy,
        pos2d:{x:n.pos2d.x+300,y:n.pos2d.y}, pos3d:{x:n.pos3d.x+300,y:n.pos3d.y,z:n.pos3d.z}, pinned2d:false, pinned3d:false}));
    }
  });
  data.edges.forEach(e=>{
    if(idMap[e.from] && idMap[e.to]){
      const incomingRolle = (e.rolle && e.rolle.de) || "";
      const alreadyExists = state.edges.some(ex=> ex.from===idMap[e.from] && ex.to===idMap[e.to] && ((ex.rolle&&ex.rolle.de)||"")===incomingRolle );
      if(!alreadyExists) state.edges.push({id:uid("edge"), from:idMap[e.from], to:idMap[e.to], rolle:e.rolle||{de:"",en:""}, kontakt:e.kontakt||{de:"",en:""}});
    }
  });
  // Ist die Großmodell-Übersicht aktiv, Hauptobjekte neu bestimmen, damit auch die eben
  // hinzugekommenen Gruppen einen sichtbaren Einstiegspunkt (mit "+") bekommen
  if(multiFocusIds) multiFocusIds = computeMainObjectIds();
  layout2D(); layout3D(); markDirty(); renderAll();
  if(sameGroup && mergedCount>0){
    setTimeout(()=>toast(t("mergedObjectsCount").replace("{n}", mergedCount)), 1600);
  }
}

/* --- Als Datei sichern (Download) / aus Datei öffnen (Upload) --- */
function normalizeLoadedModel(data){
  data.nodes = data.nodes||[];
  data.edges = data.edges||[];
  data.nodes.forEach(n=>{
    n.pos2d = n.pos2d||{x:0,y:0}; n.pos3d = n.pos3d||{x:0,y:0,z:0};
    n.group = n.group||"A"; n.pinned2d=false; n.pinned3d=false;
    n.params = n.params||{}; n.class = CLASSES[n.class] ? n.class : "neutral";
  });
  data.edges.forEach(e=>{ if(e.rolle===undefined) e.rolle={de:"",en:""}; if(e.kontakt===undefined) e.kontakt={de:"",en:""}; });
  return data;
}
// Löst den eigentlichen Browser-Download aus (ohne Rückfrage/Bestätigungsdialog) und gibt den
// verwendeten Dateinamen zurück. Wird sowohl vom expliziten "Als Datei sichern" als auch
// automatisch beim normalen "Speichern" genutzt.
function downloadCurrentModelAsFile(){
  const payload = { format:"objekt-beziehungsmodell-v1", name: state.modelName, nodes: state.nodes, edges: state.edges, exportedAt: Date.now() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const filename = slug(state.modelName)+".json";
  a.href = url; a.download = filename; a.style.display = "none";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 1500);
  return filename;
}
function exportModelToFile(){
  const filename = downloadCurrentModelAsFile();
  state.dirty = false;
  toast(t("fileDownloading")+filename);
}
function downloadJsonFile(json, filename){
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
async function shareModelFile(){
  const payload = { format:"objekt-beziehungsmodell-v1", name: state.modelName, nodes: state.nodes, edges: state.edges, exportedAt: Date.now() };
  const json = JSON.stringify(payload, null, 2);
  const filename = slug(state.modelName)+".json";
  let file = null;
  try{ file = new File([json], filename, {type:"application/json"}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({ files:[file], title: state.modelName, text: t("shareText")+state.modelName });
      return;
    }catch(err){
      if(err && err.name==="AbortError"){ toast(t("shareCancelled")); return; }
      // Bei sonstigem Fehler auf die Icon-Auswahl unten ausweichen
    }
  }
  openShareSheet(json, filename);
}
function openShareSheet(json, filename){
  const items = [
    { icon:"📧", label:t("shareEmail"), action:"email" },
    { icon:"💬", label:"WhatsApp", action:"whatsapp" },
    { icon:"📋", label:t("shareCopy"), action:"copy" },
    { icon:"⬇️", label:t("shareDownload"), action:"download" },
  ];
  const itemsHtml = items.map(it=>`<button class="share-item" data-action="${it.action}"><span class="share-icon">${it.icon}</span><span class="share-label">${it.label}</span></button>`).join("");
  openModal(`<h3>${t("shareTitle")}</h3><p class="hint">${t("shareHint")}</p><div class="share-grid">${itemsHtml}</div><p class="hint" style="font-size:11px;opacity:.75;">${t("shareAttachNotice")}</p><div class="modal-actions"><button class="btn" id="closeM">${t("close")}</button></div>`);
  document.getElementById("closeM").onclick = closeModal;
  document.querySelectorAll(".share-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const action = btn.dataset.action;
      if(action==="email"){
        downloadJsonFile(json, filename);
        toast(t("shareAttachHint").replace("{filename}", filename));
        const subject = encodeURIComponent(t("shareText")+state.modelName);
        const body = encodeURIComponent(t("shareEmailBody").replace("{filename}", filename));
        setTimeout(()=>{ window.location.href = `mailto:?subject=${subject}&body=${body}`; }, 900);
      } else if(action==="whatsapp"){
        downloadJsonFile(json, filename);
        toast(t("shareAttachHint").replace("{filename}", filename));
        const text = encodeURIComponent(t("shareWhatsappText").replace("{filename}", filename).replace("{name}", state.modelName));
        setTimeout(()=>{ window.open(`https://wa.me/?text=${text}`, "_blank"); }, 900);
      } else if(action==="copy"){
        navigator.clipboard.writeText(json).then(()=>toast(t("shareCopied"))).catch(()=>toast(t("shareCopyFailed")));
      } else if(action==="download"){
        downloadJsonFile(json, filename);
        toast(t("fileDownloading")+filename);
      }
      closeModal();
    });
  });
}
function importModelFromFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const raw = JSON.parse(reader.result);
      if(!raw || !Array.isArray(raw.nodes) || !Array.isArray(raw.edges)) throw new Error("invalid format");
      const data = normalizeLoadedModel(raw);
      state = { modelId:null, modelName: data.name || file.name.replace(/\.json$/i,""), nodes:data.nodes, edges:data.edges, dirty:false };
      selectedNodeId=null; focusNodeId=null; selectedEdgeId=null; expandedNodes = new Set();
      const isLarge = applyLargeModelDefaultView();
      layout2D(); layout3D();
      document.getElementById("modelNameLabel").textContent = state.modelName;
      renderInspector(); renderAll();
      toast(isLarge ? t("modelLoadedLargeHint").replace("{name}", state.modelName).replace("{n}", state.nodes.length) : t("modelLoadedFromFile")+state.modelName);
    }catch(err){
      toast(t("fileInvalidFormat"));
      console.error(err);
    }
  };
  reader.onerror = ()=>toast(t("fileReadError"));
  reader.readAsText(file);
}
document.getElementById("btnExportFile").addEventListener("click", exportModelToFile);
document.getElementById("btnShareFile").addEventListener("click", shareModelFile);
document.getElementById("btnImportFile").addEventListener("click", ()=>{ pendingFileMode="open"; document.getElementById("fileImportInput").click(); });
document.getElementById("fileImportInput").addEventListener("change",(ev)=>{
  const file = ev.target.files[0];
  const mode = pendingFileMode;
  pendingFileMode = "open";
  if(!file){ ev.target.value=""; return; }
  if(mode==="open"){
    importModelFromFile(file);
  } else {
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const raw = JSON.parse(reader.result);
        const data = normalizeLoadedModel(raw);
        remapAndImport(data, mode==="merge");
        toast((mode==="merge"?t("mergedWith"):t("coupledWith"))+(data.name||file.name));
        if(mode==="couple"){ setConnectMode(true); toast(t("coupleHint")); }
      }catch(err){ toast(t("modelCouldNotLoad")); console.error(err); }
    };
    reader.readAsText(file);
  }
  ev.target.value = "";
});

<p>Über das Suchfeld unten ein Objekt finden. Nach Auswahl zeigt die Ansicht automatisch nur die erste Beziehungsebene — ein „+" am Objekt blendet weitere Nachbarn ein. Über den Schalter „Beim Klick filtern" neben dem Ebenen-Regler lässt sich das abschalten: Ist er aus, bleibt beim Anklicken eines Objekts die aktuell sichtbare Ansicht komplett unverändert — es wird nur im Inspektor geöffnet, statt die übrigen Objekte auszublenden.</p>
<h4>KI-Chat (💬 neben der Suche)</h4>
<p>Fragen zum aktuellen Modell stellen („Wer leitet die Abteilung X?") oder Erweiterungen in normaler Sprache beschreiben („Füge einen neuen Mitarbeiter Y in Abteilung X hinzu", auch per Mikrofon diktierbar — sendet dann automatisch). Erkennt die KI eine gewünschte Änderung, legt sie die passenden Objekte/Beziehungen direkt im Modell an, versucht dabei für real verortbare neue Objekte (Städte, Gebäude, Firmensitze u. Ä.) zunächst eine genaue Adresse und darauf aufbauend passende GPS-Koordinaten zu recherchieren (bevorzugt über gpskoordinaten.de oder Google Maps, statt nur zu schätzen), und markiert alles zur Prüfung. Fragst du nach einem konkreten, bisher fehlenden Wert eines bereits bestehenden Objekts (z. B. „Recherchiere die Telefonnummer von Firma X und trage sie ein"), trägt die KI den gefundenen Wert direkt in das passende Feld dieses Objekts ein, statt ihn nur im Chat zu nennen. Fragst du stattdessen nach der Beziehung zwischen bereits bestehenden Objekten, zentriert die Ansicht automatisch auf die genannten Objekte, statt etwas Neues anzulegen. Genannte Objektnamen in der Antwort sind anklickbar; auch größere Ergänzungen werden bei Bedarf automatisch fortgesetzt, statt abgeschnitten zu werden.</p>
<h4>2D / 3D</h4>
<p>Mit dem Schalter unten zwischen flacher und räumlicher Ansicht wechseln. „Neu anordnen" berechnet die Positionen neu; das geschieht auch automatisch beim Laden eines Modells. Die Anordnung nutzt die Bibliothek d3-force (in 3D d3-force-3d): Objekte überlappen sich nicht, zusammengehörige Zweige liegen beieinander, und beim Ziehen eines Objekts in 2D weichen die Nachbarn weich aus. Ein gezogenes Objekt bleibt danach an seiner Stelle fixiert. Ohne Internetverbindung verwendet Join automatisch die eingebaute, einfachere Anordnung.</p>
<h4>GPS-Koordinaten &amp; GEO-Modus</h4>
<p>Jedes Objekt hat zusätzlich Felder für Breiten- und Längengrad — per „📍 Meinen Standort verwenden" lassen sie sich auch direkt vom Gerät übernehmen (Standortfreigabe erforderlich, funktioniert am zuverlässigsten über eine https-Verbindung, z. B. nach dem Hosting auf GitHub Pages). Trägst du Koordinaten ein und aktivierst den „GEO"-Schalter neben 2D/3D, werden georeferenzierte Objekte als Stecknadeln statt im freien Diagramm auf einer echten Karte (2D) bzw. einem Globus mit Ländergrenzen (3D) angezeigt — Beziehungen zwischen zwei georeferenzierten Objekten erscheinen als Bogen. Objekte ohne Koordinaten werden am unteren Rand (2D) bzw. in einem Ring über dem Globus (3D) gesammelt; anklicken öffnet sie im Inspektor, damit du Koordinaten ergänzen kannst. In der 2D-Kartenansicht lässt sich eine Stecknadel außerdem verschieben: dafür erst den „Verschieben"-Schalter neben „GEO" aktivieren (standardmäßig immer ausgeschaltet, um versehentliches Verschieben zu vermeiden), danach mit Maus oder Finger an die neue Position ziehen — die GPS-Koordinaten werden automatisch aktualisiert. Objekte mit gültigen GPS-Koordinaten zeigen zusätzlich ein kleines grünes 🧭-Symbol (im 2D-Diagramm, im 3D-Modus und in der 2D-Karte sowie als Button im Inspektor; der Globus zeigt bewusst nur schlichte Nadeln mit rotem Kopf und dem Objektnamen) — ein Klick darauf öffnet direkt die Google-Maps-Navigation zu dieser Koordinate. Für die Kartenkacheln bzw. die Erdtextur wird eine Internetverbindung benötigt.</p>
<h4>Speichern, Teilen, Öffnen</h4>
<p>„Speichern" legt das Modell lokal im Browser ab und lädt es dabei automatisch zusätzlich als Datei herunter (ohne Rückfrage) — so hast du immer auch eine echte Datei zum Weitergeben/Sichern. Über „Menü" lässt sich das Modell außerdem teilen (E-Mail/WhatsApp/nativ) oder aus einer Datei laden. Beim erneuten Öffnen des Tools wird automatisch das zuletzt gespeicherte bzw. geöffnete Modell wieder geladen, statt mit einem leeren Modell zu starten.</p>
<h4>Fusionieren &amp; Koppeln</h4>
<p>„Fusionieren" führt zwei Modelle zusammen — Objekte mit gleichem Namen und gleicher Klasse werden automatisch zu einem Objekt vereint, abweichende Werte landen in der Bemerkung. „Koppeln" fügt ein zweites Modell separat daneben ein, um beide Modelle manuell über eine Kante zu verbinden. Bei beiden lässt sich die zweite Datei entweder aus zuvor lokal gespeicherten Modellen wählen oder direkt „📂 Datei vom PC" auswählen.</p>
<h4>Foto analysieren (KI)</h4>
<p>Über das 📷-Symbol neben dem Suchfeld (bei den KI-Chat-Symbolen) ein Foto aufnehmen (z. B. ein Tisch mit Gegenständen). Claude Vision erkennt automatisch:</p>
<p>• den <b>Raum</b> (falls erkennbar)<br>
• die <b>Oberfläche/das Möbelstück</b> (z. B. Tisch) → „befindet sich in" → Raum<br>
• alle <b>einzelnen Objekte</b> darauf (z. B. Gläser, Kugelschreiber) → „befindet sich auf" → Oberfläche, inkl. Material, Farbe und Anzahl, wo erkennbar</p>
<p>Die erkannten Objekte werden dem aktuellen Modell <b>hinzugefügt</b> (nichts wird ersetzt) und zur Prüfung markiert. Ist der „GEO"-Schalter zu diesem Zeitpunkt eingeschaltet, wird zusätzlich versucht, den aktuellen Gerätestandort zu ermitteln und als GPS-Koordinaten an Raum, Oberfläche und alle Gegenstände zu übergeben.</p>
<h4>Modell Report</h4>
<p>„Menü" → „📄 Modell Report" erzeugt einen druckbaren Bericht in einem neuen Browser-Tab: zuerst ein Bild der gerade angezeigten Ansicht — inklusive aktivem Fokus/Ebenen-Filter sowie Karten- oder Globusdarstellung, falls GEO aktiv ist —, danach eine Tabelle aller sichtbaren Beziehungen und zuletzt eine Tabelle aller sichtbaren Objekte mit ihren Spezifikationen inklusive hinterlegter Bilder (mittelgroß dargestellt) sowie – bei vorhandenen GPS-Koordinaten – einem kleinen Kartenausschnitt mit roter Stecknadel an der jeweiligen Position. Ein „Drucken"-Button oben im Report löst den Ausdruck aus.</p>
<h4>Eigener API-Key (Foto-Analyse &amp; KI-Chat)</h4>
<p>Beide KI-Funktionen benötigen denselben, einmal hinterlegten, separat zu bezahlenden Anthropic API-Key — ein Claude.ai-Abo (Pro/Max) reicht dafür <b>nicht</b> aus, da API und Chat-Abo getrennt abgerechnet werden. Key erstellen unter <b>platform.claude.com</b> → „API Keys" → „Create Key". Kosten liegen typischerweise im Cent-Bereich pro Nutzung. Der Key wird ausschließlich lokal in diesem Browser gespeichert und nur direkt an die Anthropic-API übertragen. Empfehlung: in der Konsole unter „Limits" ein niedriges monatliches Ausgabenlimit setzen.</p>
</div>`,
en: `<h3>❓ Quick Guide</h3>
<div class="help-body">
<h4>Getting Started</h4>
<p>Load an existing model via "Menu" → "Open", or start fresh with "New Model". "+ Object" creates a new object.</p>
<h4>Classes &amp; Objects</h4>
<p>Every object belongs to a class (e.g. Person, City, Company, Whale, Furniture) with its own icon, color, and fields — over 80 classes are built in already. A new object starts as "Unassigned" and is given a class in the inspector on the right.</p>
<h4>Class Legend</h4>
<p>Bottom left, "Classes" opens a list of every available class with its icon and color on click — it expands upward.</p>
<h4>Relationships</h4>
<p>Turn on "🔗 Connect" in the menu, then drag from one object to another to create an edge. The role and comment of a relationship can be edited in the inspector.</p>
<h4>Remark</h4>
<p>Every object also has a "Remark" field for notes that don't fit any other field — right under the name in the inspector.</p>
<h4>Images</h4>
<p>Below the GPS fields, you can attach any number of images to an object — pick them via the "＋" tile (automatically resized, stored directly in the model, so they travel along when you share or open the file on another device). Click an image to enlarge it; the "×" removes it again.</p>
<h4>Date &amp; Time</h4>
<p>Every object is automatically stamped with the current date and time when it's created — whether via "+ Object", the AI chat, or photo analysis. The value can always be changed afterward in the inspector using the native date/time picker.</p>
<h4>Voice Input</h4>
<p>The 🎤 microphone icon appears in several places — text fields in the inspector, the search field, and the AI chat — and turns spoken text directly into the matching field (Chrome/Edge, requires an internet connection).</p>
<h4>Search &amp; Focus</h4>
<p>Use the search field at the bottom to find an object. Once selected, the view automatically shows only its first-degree relationships — a "+" on an object reveals further neighbors. The "Filter on click" switch next to the levels slider turns this off: when it's off, clicking an object leaves the currently visible view completely unchanged — it just opens in the inspector instead of hiding the other objects.</p>
<h4>AI Chat (💬 next to search)</h4>
<p>Ask questions about the current model ("Who leads department X?") or describe extensions in plain language ("Add a new employee Y in department X" — dictate it via the microphone and it sends automatically). When the AI recognizes a requested change, it creates the matching objects/relationships directly in the model, tries to first research a precise address and then, based on that, accurate GPS coordinates for newly created objects with a real-world location (cities, buildings, company sites, etc.) — preferring gpskoordinaten.de or Google Maps over just guessing — and tags everything for you to verify. If you ask for a specific, currently missing value on an already existing object (e.g. "Look up company X's phone number and fill it in"), the AI writes the value it finds directly into that object's matching field instead of only stating it in the chat. If you instead ask about the relationship between existing objects, the view automatically centers on the objects mentioned instead of creating anything new. Object names mentioned in its replies are clickable; larger extensions are automatically continued rather than cut off if needed.</p>
<h4>2D / 3D</h4>
<p>Use the switch at the bottom to toggle between the flat diagram and the spatial view. "Rearrange" recalculates positions; this also happens automatically whenever a model is loaded. The layout uses the d3-force library (d3-force-3d in 3D): objects don't overlap, related branches stay together, and when you drag an object in 2D its neighbors smoothly make room. A dragged object stays fixed where you drop it. Without an internet connection Join automatically falls back to its simpler built-in layout.</p>
<h4>GPS Coordinates &amp; GEO Mode</h4>
<p>Every object also has latitude/longitude fields — "📍 Use My Location" can fill them in directly from your device (requires location permission, works most reliably over an https connection, e.g. after hosting on GitHub Pages). Fill them in and turn on the "GEO" switch next to 2D/3D, and geo-referenced objects appear as pin markers on a real map (2D) or a globe with country borders (3D) instead of the free-form diagram — relationships between two geo-referenced objects are drawn as arcs. Objects without coordinates are collected at the bottom edge (2D) or in a ring above the globe (3D); click one to open it in the inspector and add coordinates. In the 2D map view, a pin can also be moved: first turn on the "Move" switch next to "GEO" (always off by default, to avoid accidental moves), then drag it to the new spot with the mouse or a finger — GPS coordinates update automatically. Objects with valid GPS coordinates also show a small green 🧭 icon (in the 2D diagram, in 3D, and on the 2D map, plus as a button in the inspector; the globe deliberately shows only slim red-headed pins with the object name) — click it to open Google Maps navigation to that coordinate directly. An internet connection is needed for the map tiles / earth texture.</p>
<h4>Save, Share, Open</h4>
<p>"Save" stores the model locally in the browser and automatically downloads it as a file too (no confirmation needed) — so you always have an actual file to pass on or back up. From "Menu" you can also share the model (email/WhatsApp/native share) or load one from a file. Reopening the tool automatically reloads the last saved or opened model instead of starting with a blank one.</p>
<h4>Merge &amp; Couple</h4>
<p>"Merge" combines two models — objects with the same name and class are automatically unified into one, with differing values recorded in the Remark field. "Couple" inserts a second model alongside the current one so you can connect both manually with an edge. For either, pick the second file from previously saved local models or choose "📂 File from computer" directly.</p>
<h4>Analyze Photo (AI)</h4>
<p>Using the 📷 icon next to the search field (by the AI chat icons), take a picture (e.g. a table with items on it). Claude Vision automatically identifies:</p>
<p>• the <b>room</b> (if recognizable)<br>
• the <b>surface/piece of furniture</b> (e.g. a table) → "is located in" → room<br>
• every <b>individual object</b> on it (e.g. glasses, pens) → "is located on" → surface, including material, color, and quantity where recognizable</p>
<p>Recognized objects are <b>added</b> to the current model (nothing is replaced) and tagged for you to verify. If the "GEO" switch is turned on at that moment, the tool also tries to determine your device's current location and applies it as GPS coordinates to the room, the surface, and every object.</p>
<h4>Model Report</h4>
<p>"Menu" → "📄 Model Report" generates a printable report in a new browser tab: first an image of the view currently shown — including any active focus/level filter, and the map or globe display if GEO is on —, then a table of every visible relationship, and finally a table of every visible object with its specifications, including any attached images (shown at medium size) and, where GPS coordinates are set, a small map excerpt with a red pin at that position. A "Print" button at the top of the report triggers printing.</p>
<h4>Your own API key (photo analysis &amp; AI chat)</h4>
<p>Both AI features share the same, separately billed Anthropic API key, entered once — a Claude.ai subscription (Pro/Max) is <b>not</b> enough, since the API and the chat subscription are billed separately. Create a key at <b>platform.claude.com</b> → "API Keys" → "Create Key". Cost is typically a few cents at most per use. The key is stored only locally in this browser and sent only directly to the Anthropic API. Recommendation: set a low monthly spending limit under "Limits" in the console.</p>
</div>`

function showSaveModal(){
  openModal(`
    <h3>${t("saveModalTitle")}</h3>
    <input type="text" id="saveNameInput" value="${state.modelName}">
    <div class="modal-actions">
      <button class="btn" id="cancelSave">${t("cancel")}</button>
      <button class="btn primary" id="confirmSave">${t("save")}</button>
    </div>`);
  document.getElementById("cancelSave").onclick = closeModal;

async function showOpenModal(mode){
  // mode: 'open' | 'merge' | 'couple'
  const items = await listSavedModels();
  const title = mode==="open" ? t("openModalTitleOpen") : mode==="merge" ? t("openModalTitleMerge") : t("openModalTitleCouple");
  const diskBtnHtml = `<button class="btn" id="openFromDiskBtn">${t("openFromDisk")}</button>`;
  const diskHintHtml = `<p class="hint">${t("openFromDiskHint")}</p>`;
  const triggerDiskPick = ()=>{ pendingFileMode = mode; closeModal(); document.getElementById("fileImportInput").click(); };
  if(!items.length){ openModal(`<h3>${title}</h3><p class="hint">${t("noSavedModels")}</p>${diskHintHtml}<div class="modal-actions">${diskBtnHtml}<button class="btn" id="closeM">${t("close")}</button></div>`); document.getElementById("closeM").onclick=closeModal; document.getElementById("openFromDiskBtn").onclick=triggerDiskPick; return; }
  openModal(`<h3>${title}</h3><ul class="modal-list">${items.map(it=>`<li data-key="${it.key}"><span>${it.name}</span><span class="tag" style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft)">${it.count}${t("objectsCount")}</span></li>`).join("")}</ul>${diskHintHtml}<div class="modal-actions">${diskBtnHtml}<button class="btn" id="closeM">${t("cancel")}</button></div>`);
  document.getElementById("closeM").onclick=closeModal;
  document.getElementById("openFromDiskBtn").onclick=triggerDiskPick;
  document.querySelectorAll(".modal-list li").forEach(li=>{
    li.addEventListener("click", async ()=>{
      const key = li.getAttribute("data-key");
      closeModal();
      if(mode==="open"){ loadModel(key); }
      else{
        try{
          const r = await storageGet(key);
          const data = JSON.parse(r.value);
          remapAndImport(data, mode==="merge");
          toast((mode==="merge"?t("mergedWith"):t("coupledWith"))+data.name);
          if(mode==="couple"){ setConnectMode(true); toast(t("coupleHint")); }
        }catch(err){ toast(t("modelCouldNotLoad")); console.error(err); }
      }
    });
  });
}

function positionMenuPanel(){

  const panel = document.getElementById("menuPanel");
  const r = btn.getBoundingClientRect();
  panel.style.top = (r.bottom+6)+"px";
  const desiredLeft = r.left;

  panel.style.left = Math.max(8, Math.min(desiredLeft, maxLeft))+"px";

/* ---------------------------------------------------------------
   GEO-MODUS: Karte (2D, Leaflet) und Globus (3D, Three.js) —
   zeigt Objekte mit GPS-Koordinaten an ihrer echten Position;
   Objekte ohne Koordinaten werden an einer Sammelstelle angezeigt.
--------------------------------------------------------------- */
let leafletMap = null, leafletLayer = null, geoGlobe = null;

function nodeLatLon(n){
  const lat = parseFloat(n.lat), lon = parseFloat(n.lon);
  if(isNaN(lat) || isNaN(lon) || lat<-90 || lat>90 || lon<-180 || lon>180) return null;
  return {lat, lon};
}
// Öffnet Google Maps in einem neuen Tab mit gestarteter Navigation zur Koordinate des Objekts
function openGoogleMapsNav(n){
  const ll = nodeLatLon(n);
  if(!ll) return;
  const url = `https://www.google.com/maps/dir/?api=1&destination=${ll.lat},${ll.lon}&travelmode=driving`;
  window.open(url, "_blank", "noopener");
}
function useMyLocationForNode(node){
  if(!navigator.geolocation){ toast(t("geoLocationUnavailable")); return; }
  toast(t("geoLocationRequesting"));
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      node.lat = pos.coords.latitude.toFixed(6);
      node.lon = pos.coords.longitude.toFixed(6);
      markDirty();
      renderInspector();
      renderAll(); // immer neu zeichnen, damit u. a. das Navigations-Symbol sofort erscheint
      toast(t("geoLocationSet"));
    },
    (err)=>{
      toast(err && err.code===1 ? t("geoLocationDenied") : t("geoLocationError"));
    },
    { enableHighAccuracy:true, timeout:10000 }
  );
}
function setGeoMode(on){
  geoMode = on;
  if(on && !view3D && typeof L==="undefined") toast(t("geoNoInternet"));
  document.getElementById("geoSwitchTrack").classList.toggle("on", on);
  document.getElementById("geoSwitchWrap").classList.toggle("on", on);
  applyGeoVisibility();

// --- 2D: Leaflet-Karte ---
function ensureLeafletMap(){
  if(leafletMap || typeof L==="undefined") return;
  leafletMap = L.map("geoMap2D", {zoomControl:true, attributionControl:true}).setView([20,10], 2);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: "&copy; OpenStreetMap"
  }).addTo(leafletMap);
  leafletLayer = L.layerGroup().addTo(leafletMap);
}
function curvedLatLngs(a, b){
  // Grobe Bogen-Näherung ueber eine quadratische Bezierkurve, seitlich vom Mittelpunkt versetzt
  const midLat = (a.lat+b.lat)/2, midLng = (a.lon+b.lon)/2;
  const dx = b.lon-a.lon, dy = b.lat-a.lat;
  const offset = 0.15;
  const curveLat = midLat + (-dx)*offset;
  const curveLng = midLng + (dy)*offset;
  const pts = []; const N = 24;
  for(let i=0;i<=N;i++){
    const tt = i/N;
    const lat = (1-tt)*(1-tt)*a.lat + 2*(1-tt)*tt*curveLat + tt*tt*b.lat;
    const lng = (1-tt)*(1-tt)*a.lon + 2*(1-tt)*tt*curveLng + tt*tt*b.lon;
    pts.push([lat,lng]);
  }
  return pts;
}
function renderGeoMap2D(){
  ensureLeafletMap();
  if(!leafletMap){ return; }
  leafletLayer.clearLayers();
  const vis = visibleSet();
  const withGeo = [];
  state.nodes.forEach(n=>{
    if(!vis.nodes.has(n.id)) return;
    const ll = nodeLatLon(n);
    if(!ll) return;
    withGeo.push(n);
    const cls = CLASSES[n.class];
    const color = cls?cls.color:"#8a8f98";
    const isFocus = n.id===focusNodeId;
    const size = isFocus ? 34 : 26;
    const pinIcon = L.divIcon({
      className: "geo-pin-icon",
      html: `<svg width="${size}" height="${size*1.35}" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
               <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20c0-6.6-5.4-12-12-12z" fill="${color}" stroke="#fff" stroke-width="1.5"/>
               <circle cx="12" cy="12" r="5" fill="#fff"/>
               <g class="nav-badge-leaflet" style="cursor:pointer;">
                 <circle cx="19" cy="4" r="5.5" fill="#34c759" stroke="#fff" stroke-width="1"/>
                 <text x="19" y="6.5" text-anchor="middle" font-size="6">🧭</text>
               </g>
             </svg>`,
      iconSize: [size, size*1.35],
      iconAnchor: [size/2, size*1.35] // Spitze der Nadel zeigt exakt auf die Koordinate
    });
    // Verschiebbarkeit richtet sich direkt nach dem "Verschieben"-Schalter (standardmäßig aus,
    // damit ein normales Antippen/Anklicken nie versehentlich die Position ändert).
    const marker = L.marker([ll.lat, ll.lon], { icon: pinIcon, draggable: geoDragMode }).addTo(leafletLayer);
    marker.bindTooltip(`${cls?cls.icon:"⚪"} ${n.name}`, {direction:"top", offset:[0,-size]});
    marker.on("click", (ev)=>{
      // Grünes Kompass-Symbol oben rechts an der Nadel: einfacher Klick öffnet direkt die
      // Google-Maps-Navigation, statt das Objekt nur auszuwählen.
      const target = ev.originalEvent && ev.originalEvent.target;
      if(target && target.closest && target.closest(".nav-badge-leaflet")){ openGoogleMapsNav(n); return; }
      selectNode(n.id);
    });
    marker.on("dragstart", ()=> marker.closeTooltip());
    marker.on("dragend", ()=>{
      const pos = marker.getLatLng();
      n.lat = pos.lat.toFixed(6); n.lon = pos.lng.toFixed(6);
      markDirty();
      if(selectedNodeId===n.id) renderInspector();
      toast(t("geoPositionUpdated"));
      renderGeoMap2D(); // Beziehungsbögen und Tooltip-Position neu zeichnen
    });
  });
  state.edges.forEach(e=>{
    if(!vis.edges.has(e.id)) return;
    const a = state.nodes.find(n=>n.id===e.from), b = state.nodes.find(n=>n.id===e.to);
    if(!a||!b) return;
    const aa = nodeLatLon(a), bb = nodeLatLon(b);
    if(!aa||!bb) return;
    const line = L.polyline(curvedLatLngs(aa,bb), {color:"#0071e3", weight:2, opacity:0.75}).addTo(leafletLayer);
    const rolle = e.rolle ? (e.rolle[lang]||e.rolle.de||"") : "";
    if(rolle) line.bindTooltip(rolle, {sticky:true});
    line.on("click", ()=> selectEdge(e.id));
  });
  renderGeoStaging(withGeo);
  setTimeout(()=>{ if(leafletMap) leafletMap.invalidateSize(); }, 60);
}
function renderGeoStaging(placedNodes){
  const bar = document.getElementById("geoStagingBar");
  const vis = visibleSet();
  const placedIds = new Set(placedNodes.map(n=>n.id));
  const missing = state.nodes.filter(n=> vis.nodes.has(n.id) && !placedIds.has(n.id));
  bar.querySelectorAll(".geo-chip").forEach(c=>c.remove());
  missing.forEach(n=>{
    const cls = CLASSES[n.class];
    const chip = document.createElement("div"); chip.className = "geo-chip";
    chip.textContent = `${cls?cls.icon:"⚪"} ${n.name}`;
    chip.addEventListener("click", ()=> selectNode(n.id));
    bar.appendChild(chip);
  });
  bar.classList.toggle("active", geoMode && !view3D && missing.length>0);
}

// --- 3D: Globus mit Three.js ---
function latLonToVector3(lat, lon, radius){
  const phi = (90-lat) * Math.PI/180;
  const theta = (lon+180) * Math.PI/180;
  return new THREE.Vector3(
    -radius*Math.sin(phi)*Math.cos(theta),
    radius*Math.cos(phi),
    radius*Math.sin(phi)*Math.sin(theta)
  );
}
let countryBordersGroup = null, countryBordersRequested = false;
const EARTH_TEXTURE_URLS = [
  "https://cdn.jsdelivr.net/npm/three-globe@2/example/img/earth-blue-marble.jpg",
  "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/textures/planets/earth_atmos_2048.jpg",
  "https://unpkg.com/three-globe@2/example/img/earth-blue-marble.jpg"
];
function ensureGlobe(){
  if(geoGlobe) return;
  const geo = new THREE.SphereGeometry(300, 64, 64);
  // Ozeanblau als Basisfarbe, damit auch ohne geladene Textur Land/Wasser-Kontrast erkennbar ist,
  // sobald die Ländergrenzen (siehe unten) darübergelegt werden.
  const mat = new THREE.MeshStandardMaterial({color:0x1b3a5c});
  const sphere = new THREE.Mesh(geo, mat);
  const loader = new THREE.TextureLoader();
  (function tryLoad(i){
    if(i>=EARTH_TEXTURE_URLS.length) return; // alle Quellen fehlgeschlagen -> eingefärbte Kugel bleibt Ersatz
    loader.load(EARTH_TEXTURE_URLS[i],
      (tex)=>{ mat.map = tex; mat.color.set(0xffffff); mat.needsUpdate = true; },
      undefined,
      ()=> tryLoad(i+1)
    );
  })(0);
  geoGlobe = { sphere };
}
function loadCountryBorders(){
  if(countryBordersRequested) return;
  countryBordersRequested = true;
  fetch("https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json")
    .then(res=>res.json())
    .then(geoJson=>{
      const group = new THREE.Group();
      const mat = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.55});
      const R = 301.2;
      function addRing(ring){
        const pts = ring.map(([lon,lat]) => latLonToVector3(lat, lon, R));
        if(pts.length){ pts.push(pts[0]); }
        const bg = new THREE.BufferGeometry().setFromPoints(pts);
        group.add(new THREE.Line(bg, mat));
      }
      (geoJson.features||[]).forEach(f=>{
        const g = f && f.geometry;
        if(!g) return;
        if(g.type==="Polygon") g.coordinates.forEach(addRing);
        else if(g.type==="MultiPolygon") g.coordinates.forEach(poly=>poly.forEach(addRing));
      });
      countryBordersGroup = group;
      if(geoMode && view3D){ three.group.add(countryBordersGroup); }
    })
    .catch(()=>{ /* Ländergrenzen nicht ladbar (z. B. offline) -- Globus bleibt ohne Grenzlinien nutzbar */ });
}
// Globus: bewusst schlicht -- dünne Stecknadel mit rotem Kugelkopf (unabhängig von der Klasse)
function makeGeoPinMesh(isFocus, nodeId){
  const group = new THREE.Group();
  const scale = isFocus ? 1.3 : 1;
  const shaftH = 12*scale, shaftR = 0.45*scale, headR = 2.6*scale;
  const shaftMat = new THREE.MeshStandardMaterial({ color: 0xc8c8cc, metalness:0.6, roughness:0.35 });
  const headMat = new THREE.MeshStandardMaterial({
    color: 0xe0201b, emissive: isFocus ? new THREE.Color(0xff6a4d) : 0x000000, emissiveIntensity:0.5
  });
  // dünner, silberner Schaft; Spitze zeigt zur Kugeloberfläche
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(shaftR, shaftR*0.3, shaftH, 8), shaftMat);
  shaft.position.y = shaftH/2;
  group.add(shaft);
  // roter Kugelkopf
  const head = new THREE.Mesh(new THREE.SphereGeometry(headR, 14, 14), headMat);
  head.position.y = shaftH + headR*0.8;
  group.add(head);
  group.userData.nodeId = nodeId; shaft.userData.nodeId = nodeId; head.userData.nodeId = nodeId;
  return group;
}
// Globus: nur dezenter Objektname, ohne Icon/Bild
function makeGlobeLabelSprite(name, forReport){
  const cvs = document.createElement("canvas"); cvs.width=256; cvs.height=48;
  const ctx = cvs.getContext("2d");
  ctx.font="500 22px 'Space Grotesk', sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle = forReport ? "rgba(29,29,31,0.85)" : "rgba(246,247,249,0.7)";
  const label = (name||"").length>20 ? name.slice(0,19)+"…" : (name||"");
  ctx.fillText(label, 128, 24);
  const tex = new THREE.CanvasTexture(cvs);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  spr.scale.set(52,9.75,1);
  return spr;
}
function buildGlobeScene(forReport){
  ensureGlobe();
  three.group.add(geoGlobe.sphere);
  if(countryBordersGroup){ three.group.add(countryBordersGroup); }
  else { loadCountryBorders(); }
  const vis = visibleSet();
  const R = 300;
  const AXIS_Y = new THREE.Vector3(0,1,0);
  state.nodes.forEach(n=>{
    if(!vis.nodes.has(n.id)) return;
    const ll = nodeLatLon(n);
    const cls = CLASSES[n.class];
    let pos;
    if(ll){ pos = latLonToVector3(ll.lat, ll.lon, R+4); }
    else {
      const idx = state.nodes.indexOf(n);
      const angle = idx * 2.399963; // Goldener-Winkel-Verteilung für die Sammelstelle
      pos = new THREE.Vector3(Math.cos(angle)*(R+90), R+130, Math.sin(angle)*(R+90));
    }
    // Stecknadel radial zur Kugeloberfläche ausgerichtet. Auf dem Globus nur Nadel + dezenter Name,
    // ohne Klassenbild und ohne Navigations-Symbol.
    const radialDir = pos.clone().normalize();
    const pin = makeGeoPinMesh(n.id===focusNodeId, n.id);
    pin.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(AXIS_Y, radialDir));
    pin.position.copy(pos);
    pin.userData.nodeId = n.id;
    three.group.add(pin); three.meshes[n.id] = pin;
    const spr = makeGlobeLabelSprite(n.name||t("noNameLabel"), forReport);
    spr.position.copy(pos).add(radialDir.clone().multiplyScalar(24));
    three.group.add(spr);
  });
  state.edges.forEach(e=>{
    if(!vis.edges.has(e.id)) return;
    const a = state.nodes.find(n=>n.id===e.from), b = state.nodes.find(n=>n.id===e.to);
    if(!a||!b) return;
    const aa = nodeLatLon(a), bb = nodeLatLon(b);
    if(!aa||!bb) return; // Bögen nur zwischen zwei georeferenzierten Objekten
    const p1 = latLonToVector3(aa.lat, aa.lon, R+4);
    const p2 = latLonToVector3(bb.lat, bb.lon, R+4);
    const mid = p1.clone().add(p2).multiplyScalar(0.5);
    const liftFactor = 1 + p1.distanceTo(p2)/(R*2.2);
    mid.normalize().multiplyScalar(R * liftFactor);
    const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
    const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(30));
    const mat = e.id===selectedEdgeId ? new THREE.LineBasicMaterial({color:0xd1495b}) : new THREE.LineBasicMaterial({color:0x5b93c9});
    const line = new THREE.Line(geo, mat); line.userData.edgeId = e.id;
    three.group.add(line);
  });
}

/* ---------------------------------------------------------------
   14b. ZWEI-FINGER-PINCH (ZOOM PER TOUCH)
--------------------------------------------------------------- */
const canvasWrapEl = document.getElementById("canvasWrap");
const activeTouches = new Map();
let pinchPrevDist = null, pinchPrevMid = null;
function touchPt(ev){ return {x:ev.clientX, y:ev.clientY}; }
function touchDist(){ const p=[...activeTouches.values()]; return Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y); }
function touchMid(){ const p=[...activeTouches.values()]; return {x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2}; }
canvasWrapEl.addEventListener("pointerdown",(ev)=>{
  if(ev.pointerType!=="touch") return;
  activeTouches.set(ev.pointerId, touchPt(ev));
  if(activeTouches.size===2){
    // Laufende Einzelfinger-Aktionen (Verschieben/Verbinden) abbrechen, Pinch übernimmt
    dragNode2D=null; panning=false;
    if(tempLineSrc){ tempLineEl && tempLineEl.remove(); tempLineSrc=null; tempLineEl=null; }
    dragging3D=null; panningView3D=false;
    pinchPrevDist = touchDist(); pinchPrevMid = touchMid();
  }
},true);
canvasWrapEl.addEventListener("pointermove",(ev)=>{
  if(ev.pointerType!=="touch" || !activeTouches.has(ev.pointerId)) return;
  activeTouches.set(ev.pointerId, touchPt(ev));
  if(activeTouches.size===2 && pinchPrevDist){
    // Im 2D-GEO-Kartenmodus liegt die (unsichtbare) SVG-Zoomlogik hier falsch: Sie würde
    // panX/panY/zoom anhand von Finger-Koordinaten verändern, die eigentlich für die Leaflet-
    // Karte gedacht sind -- und diese verfälschten Werte blieben bestehen, bis man zur
    // normalen 2D-Ansicht zurückwechselt. Dort wurden dann alle Objekte scheinbar unsichtbar
    // (weit verschoben/verzerrt), erst ein Neuladen setzte panX/panY/zoom zurück. Deshalb hier
    // im GEO-2D-Fall gar nicht eingreifen und Leaflet die eigene, native Pinch-Geste überlassen.
    if(geoMode && !view3D) return;
    ev.preventDefault();
    const dist = touchDist(), mid = touchMid();
    const scaleFactor = dist/pinchPrevDist;
    if(view3D){
      camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, camDist/scaleFactor));
    } else {
      const worldX = (pinchPrevMid.x-panX)/zoom, worldY = (pinchPrevMid.y-panY)/zoom;
      zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom*scaleFactor));
      panX = mid.x - worldX*zoom; panY = mid.y - worldY*zoom;
      svgSetTransform();
    }
    pinchPrevDist = dist; pinchPrevMid = mid;
  }
},{capture:true, passive:false});
function endTouch(ev){
  activeTouches.delete(ev.pointerId);
  if(activeTouches.size<2){ pinchPrevDist=null; pinchPrevMid=null; }
}
canvasWrapEl.addEventListener("pointerup", endTouch, true);
canvasWrapEl.addEventListener("pointercancel", endTouch, true);

function searchModel(queryRaw){
  const q = normalizeText(queryRaw);
  if(!q) return [];
  const resultsMap = new Map();
  const addResult = (node, snippet)=>{ if(!resultsMap.has(node.id)) resultsMap.set(node.id, {node, snippet}); };
  state.nodes.forEach(node=>{
    const cls = CLASSES[node.class];
    if(node.name && normalizeText(node.name).includes(q)){ addResult(node, node.name); return; }
    if(cls.label && normalizeText(cls.label).includes(q)){ addResult(node, cls.label); return; }
    if(cls.labelEn && normalizeText(cls.labelEn).includes(q)){ addResult(node, cls.labelEn); return; }
    if(node.params){
      for(const val of Object.values(node.params)){
        if(val && typeof val==="object"){
          if(val.de && normalizeText(val.de).includes(q)){ addResult(node, val.de); return; }
          if(val.en && normalizeText(val.en).includes(q)){ addResult(node, val.en); return; }
        }
      }
    }
  });
  state.edges.forEach(e=>{
    [e.rolle, e.kontakt].forEach(field=>{
      if(field && typeof field==="object"){
        const hit = (field.de && normalizeText(field.de).includes(q)) || (field.en && normalizeText(field.en).includes(q));
        if(hit){
          const a = state.nodes.find(n=>n.id===e.from), b = state.nodes.find(n=>n.id===e.to);
          const snippet = field.de || field.en;
          if(a) addResult(a, snippet);
          if(b) addResult(b, snippet);
        }
      }
    });
  });
  return [...resultsMap.values()];
}
function centerNode2D(node){
  const {cx,cy} = centerOf();
  panX = cx - node.pos2d.x*zoom;
  panY = cy - node.pos2d.y*zoom;
  render2D();
}
function centerNode3D(node){
  if(!three.initialized) return;
  const p = new THREE.Vector3(node.pos3d.x, node.pos3d.y, node.pos3d.z).applyEuler(three.group.rotation);
  three.group.position.set(-p.x, -p.y, -p.z);
}
function focusAndCenterNode(node){
  pulseNodeId = node.id;
  selectNode(node.id);
  setInspectorCollapsed(false);
  if(view3D){ centerNode3D(node); rebuild3DObjects(); }
  else { centerNode2D(node); }
  setTimeout(()=>{ pulseNodeId=null; }, 2300);
}
function positionSearchResults(){
  const input = document.getElementById("searchInput");
  const r = input.getBoundingClientRect();
  const panel = document.getElementById("searchResults");
  const spaceBelow = window.innerHeight - r.bottom;
  const spaceAbove = r.top;
  if(spaceBelow < 200 && spaceAbove > spaceBelow){
    panel.style.top = "auto";
    panel.style.bottom = (window.innerHeight - r.top + 6)+"px";
  } else {
    panel.style.bottom = "auto";
    panel.style.top = (r.bottom+6)+"px";
  }
  panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth-240))+"px";
  panel.style.width = Math.max(220, r.width)+"px";
}
function renderSearchResults(query){
  const panel = document.getElementById("searchResults");
  if(!query || !query.trim()){ panel.classList.remove("open"); panel.innerHTML=""; return; }
  const results = searchModel(query);
  if(!results.length){
    panel.innerHTML = `<div class="sr-empty">${t("searchNoResults")}</div>`;
  } else {
    panel.innerHTML = results.slice(0,30).map(r=>{
      const cls = CLASSES[r.node.class];
      const snippetShown = (r.snippet && r.snippet!==r.node.name) ? r.snippet : classLabel(r.node.class);
      return `<div class="sr-item" data-id="${r.node.id}">
        <span class="sr-icon">${cls.icon}</span>
        <div class="sr-main"><span class="sr-name">${r.node.name||t("noNameLabel")}</span><span class="sr-meta">${snippetShown}</span></div>
      </div>`;
    }).join("");
  }
  positionSearchResults();
  panel.classList.add("open");
  panel.querySelectorAll(".sr-item").forEach(item=>{
    item.addEventListener("click",()=>{
      const node = state.nodes.find(n=>n.id===item.getAttribute("data-id"));
      if(node) focusAndCenterNode(node);
      panel.classList.remove("open");
    });
  });
}
